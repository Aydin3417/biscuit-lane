# The iOS build, on somebody else's Mac.
#
# There is no Mac behind this repository. The iOS project was written and
# read on Windows and had never been compiled when this file was added
# (4 Oct 2026), so this job is two things at once: the first proof that
# the project builds at all, and the only road from here to TestFlight.
#
# It runs by hand, or when a tag named ios-* is pushed — the tag is there
# because a "Run workflow" button only exists for a file on the default
# branch, and the work may be on another one:
#
#     git tag ios-1 && git push origin ios-1
#
# WITHOUT SECRETS it stops after the archive. That is still worth a run:
# it answers "does it compile" before anybody is asked for a key.
#
# WITH THEM it signs the archive and sends it to App Store Connect, where
# it appears under TestFlight a few minutes later. Three repository
# secrets, all from App Store Connect > Users and Access > Integrations >
# App Store Connect API, a team key with the Admin role (a lesser role
# cannot ask Apple for the distribution certificate):
#
#     ASC_KEY_ID      the Key ID, ten characters
#     ASC_ISSUER_ID   the Issuer ID above the key list
#     ASC_KEY_P8      the whole text of the AuthKey_XXXX.p8 file
#
# WHY THE ARCHIVE IS SIGNED AD HOC. Signing it properly here would need
# a development certificate, and a fresh runner has none - Xcode would
# mint a new one on every run until Apple's limit on them is reached. The
# export step signs instead, with the distribution certificate Apple
# keeps on its own side, which costs nothing per run.
#
# It was first archived with signing switched off altogether, and the
# first upload (4 Oct 2026, tag ios-3) was refused by App Store Connect:
# error 90035, "App.app/App is not properly signed". An archive with no
# signature at all gives the export step nothing to re-sign over. Signed
# ad hoc ("-"), it has one.
name: ios

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the build to TestFlight (needs the three secrets)
        type: boolean
        default: true
  push:
    tags:
      - 'ios-*'

jobs:
  build:
    # Capacitor 8 wants Xcode 26, and so does the App Store.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # The runner's temp directory is not known where a job's env is
      # read, only once a step is running; the first run of this file
      # was refused for asking too early.
      - name: Where the archive goes
        run: echo "ARCHIVE=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Builds the page, packs it into www/, copies it into the native
      # project and rewrites the Swift package list. The package paths
      # point into node_modules, which is why the install comes first.
      - name: Build the page and sync it into the native project
        run: npm run sync

      - name: Which Xcode
        run: xcodebuild -version

      # Every upload needs a build number App Store Connect has not seen.
      # The minute it was built is one, and it only goes up.
      - name: Archive
        run: |
          set -o pipefail
          BUILD=$(date -u +%Y%m%d%H%M)
          echo "build $BUILD"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES             PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcbeautify --renderer github-actions

      - name: What was built
        run: |
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties' "$ARCHIVE/Info.plist"
          du -sh "$ARCHIVE/Products/Applications/App.app"

      # The second upload (tag ios-4) got past the app and was refused over
      # App.app/Frameworks/GoogleMobileAds.framework: the same 90035. The
      # frameworks that arrive already signed by somebody else are signed
      # ad hoc here too, so that everything in the archive is in the one
      # state the app's own binary was in when it was accepted.
      - name: One signature state for everything in the archive
        run: |
          APP="$ARCHIVE/Products/Applications/App.app"
          say() { codesign -dvv "$1" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature|flags' | tr '\n' ' '; echo; }
          for f in "$APP"/Frameworks/*.framework; do
            [ -e "$f" ] || continue
            echo "before  $(basename "$f"): $(say "$f")"
            codesign --force --sign - --timestamp=none "$f"
            echo "after   $(basename "$f"): $(say "$f")"
          done
          codesign --force --sign - --timestamp=none --preserve-metadata=entitlements "$APP"
          echo "app: $(say "$APP")"

      # Signing and sending are two steps so that what was signed can be
      # looked at before Apple is asked about it.
      - name: Sign
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          ls -la "$RUNNER_TEMP/export"

      - name: What the signatures say
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        run: |
          cd "$RUNNER_TEMP/export"
          unzip -q -o ./*.ipa -d payload
          APP=payload/Payload/App.app
          for c in "$APP"/Frameworks/*.framework "$APP"; do
            [ -e "$c" ] || continue
            echo "== $(basename "$c")"
            codesign -dvv "$c" 2>&1 | grep -E 'Authority=|TeamIdentifier|flags' | head -4
            codesign -d -r- "$c" 2>&1 | grep -v '^Executable' | head -3
            codesign --verify --strict "$c" 2>&1 | head -3 && echo "   verifies"
          done
          rm -rf payload

      - name: Send to TestFlight
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        run: |
          set -o pipefail
          xcrun altool --upload-app --type ios \
            -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Throw the key away
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      # The logs are the only thing anybody without a Mac can debug from.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
