# The iOS build, on somebody else's Mac.
#
# There is no Mac behind this repository. The iOS project was written and
# read on Windows and had never been compiled when this file was added
# (4 Oct 2026), so this job is two things at once: the first proof that
# the project builds at all, and the only road from here to TestFlight.
#
# It runs by hand, or when a tag named ios-* is pushed — the tag is there
# because a "Run workflow" button only exists for a file on the default
# branch, and the work may be on another one:
#
#     git tag ios-1 && git push origin ios-1
#
# WITHOUT SECRETS it stops after the archive. That is still worth a run:
# it answers "does it compile" before anybody is asked for a key.
#
# WITH THEM it signs the archive and sends it to App Store Connect, where
# it appears under TestFlight a few minutes later. Three repository
# secrets, all from App Store Connect > Users and Access > Integrations >
# App Store Connect API, a team key with the Admin role (a lesser role
# cannot create or revoke a certificate):
#
#     ASC_KEY_ID      the Key ID, ten characters
#     ASC_ISSUER_ID   the Issuer ID above the key list
#     ASC_KEY_P8      the whole text of the AuthKey_XXXX.p8 file
#
# WHO SIGNS IT. The archive is signed ad hoc, which needs no certificate.
# The export is signed with a distribution certificate made for the run
# (tools/ios-cert.js), whose key is thrown away with the runner: a runner
# keeps nothing, and the certificate Apple offers to keep on its own side writes
# the holder's name into the signature in a spelling that does not match
# the certificate when the name has an accent in it. Four uploads were
# refused (tags ios-3 to ios-7, 4 Oct 2026) before the bytes were printed
# side by side.
name: ios

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the build to TestFlight (needs the three secrets)
        type: boolean
        default: true
  push:
    tags:
      - 'ios-*'

jobs:
  build:
    # Capacitor 8 wants Xcode 26, and so does the App Store.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # The runner's temp directory is not known where a job's env is
      # read, only once a step is running; the first run of this file
      # was refused for asking too early.
      - name: Where the archive goes
        run: echo "ARCHIVE=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Builds the page, packs it into www/, copies it into the native
      # project and rewrites the Swift package list. The package paths
      # point into node_modules, which is why the install comes first.
      - name: Build the page and sync it into the native project
        run: npm run sync

      - name: Which Xcode
        run: xcodebuild -version

      # Every upload needs a build number App Store Connect has not seen.
      # The minute it was built is one, and it only goes up.
      - name: Archive
        run: |
          set -o pipefail
          BUILD=$(date -u +%Y%m%d%H%M)
          echo "build $BUILD"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES             PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcbeautify --renderer github-actions

      - name: What was built
        run: |
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties' "$ARCHIVE/Info.plist"
          du -sh "$ARCHIVE/Products/Applications/App.app"

      # A key made here, and a certificate and a profile asked for by API.
      # tools/ios-cert.js says why the certificate Apple keeps on its own
      # side could not be used, and why this one is left standing.
      - name: A certificate for this run
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          D="$RUNNER_TEMP/signing"; mkdir -p "$D"
          node -e "const c=require('crypto');process.stdout.write(c.generateKeyPairSync('rsa',{modulusLength:2048,privateKeyEncoding:{type:'pkcs1',format:'pem'},publicKeyEncoding:{type:'spki',format:'pem'}}).privateKey)" > "$D/key.pem"
          openssl req -new -key "$D/key.pem" -out "$D/csr.pem" -subj "/CN=Pawtika CI/C=TR"
          node tools/ios-cert.js create "$D"

          KC="$RUNNER_TEMP/build.keychain-db"; PW=$(uuidgen)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$D/key.pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/security
          security import "$D/cert.cer" -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

          UUID=$(node -p "require('$D/signing.json').profileUuid")
          for P in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$P"; cp "$D/profile.mobileprovision" "$P/$UUID.mobileprovision"
          done

      # Signing and sending are two steps so that what was signed can be
      # looked at before Apple is asked about it.
      - name: Sign
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          ls -la "$RUNNER_TEMP/export"

      # "# designated" is a requirement worked out from the certificate
      # when somebody asks; "designated" without the hash is one written
      # into the signature, which is the thing that was wrong.
      - name: What the signatures say
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        run: |
          cd "$RUNNER_TEMP/export"
          unzip -q -o ./*.ipa -d payload
          APP=payload/Payload/App.app
          for c in "$APP"/Frameworks/*.framework "$APP"; do
            [ -e "$c" ] || continue
            echo "== $(basename "$c")"
            codesign -dvv "$c" 2>&1 | grep -E 'Authority=Apple Distribution|TeamIdentifier|flags' | head -3
            codesign -d -r- "$c" 2>&1 | grep -v '^Executable' | head -2
            codesign --verify --strict "$c" && echo "   verifies"
          done
          codesign -d --entitlements - "$APP" 2>/dev/null | head -24 || true
          rm -rf payload

      - name: Send to TestFlight
        if: env.ASC_KEY_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      # The key goes; the certificate stays. Revoking it here cost the
      # first build its review (tools/ios-cert.js says how). The next run
      # clears the one before last.
      - name: Throw the keys away
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing" "$HOME/.appstoreconnect/private_keys"

      # The logs are the only thing anybody without a Mac can debug from.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
