<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pawtika — the advertisement, as a page</title>
<!--
  The stage a film is shot on: a background, a headline, and a phone
  whose screen is the game itself, running in an iframe.

    stage.html?film=basket&lang=tr

  Nothing on the phone is drawn for the advertisement. Every tap and
  swipe in a film goes through the game's own buttons and its own
  tryMove, so a film cannot show a screen or a move the build does not
  have. The page is 540 x 960 and record.js photographs it at 2x, which
  is the 1080 x 1920 every vertical placement asks for.

  Time on this page belongs to record.js (see clock.js): open it in a
  browser and it plays in real time, without sound, which is enough to
  look at a film while writing it.
-->
<link rel="stylesheet" href="../../src/fonts.css">
<style>
:root{
  --cream:#F6EADA; --text:#2C2118; --dim:#6B5949;
  --accent:#D98A18; --accent-strong:#7E4C0A;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:540px; height:960px; overflow:hidden; background:#15110d; }
body{ font-family:"Karla",system-ui,sans-serif; -webkit-font-smoothing:antialiased; position:relative; }

/* backgrounds: the seven the store slides use, stacked, one shown */
.bg{ position:absolute; inset:0; opacity:0; }
.bg.on{ opacity:1; }
.bg-amber{ background:
  radial-gradient(120% 60% at 12% 0%, rgba(255,214,140,.55), transparent 60%),
  radial-gradient(90% 55% at 100% 38%, rgba(255,160,60,.35), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(110,52,6,.75), transparent 60%),
  linear-gradient(165deg,#D98A18,#A85F0B 55%,#7E4C0A); }
.bg-sage{ background:
  radial-gradient(120% 60% at 90% 0%, rgba(196,228,212,.45), transparent 60%),
  radial-gradient(90% 55% at 0% 40%, rgba(88,170,140,.35), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(12,48,38,.8), transparent 60%),
  linear-gradient(165deg,#3A8A70,#276853 55%,#184536); }
.bg-plum{ background:
  radial-gradient(120% 60% at 10% 0%, rgba(214,196,240,.45), transparent 60%),
  radial-gradient(90% 55% at 100% 42%, rgba(168,44,68,.28), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(38,26,58,.85), transparent 60%),
  linear-gradient(165deg,#8672A8,#6E5A8C 55%,#463861); }
.bg-navy{ background:
  radial-gradient(120% 60% at 88% 0%, rgba(120,150,210,.35), transparent 60%),
  radial-gradient(90% 55% at 0% 40%, rgba(217,138,24,.22), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(6,10,18,.9), transparent 60%),
  linear-gradient(165deg,#2C3B55,#1B2636 55%,#111827); }
.bg-cream{ background:
  radial-gradient(110% 55% at 95% 0%, rgba(247,215,155,.95), transparent 62%),
  radial-gradient(100% 55% at 0% 46%, rgba(196,228,212,.75), transparent 60%),
  radial-gradient(120% 60% at 60% 108%, rgba(233,216,195,.95), transparent 60%),
  linear-gradient(170deg,#FFFAF2,#F6EADA); }
.bg-blush{ background:
  radial-gradient(110% 55% at 5% 0%, rgba(246,204,211,.95), transparent 62%),
  radial-gradient(100% 55% at 100% 44%, rgba(247,215,155,.8), transparent 60%),
  radial-gradient(120% 60% at 40% 108%, rgba(233,216,195,.95), transparent 60%),
  linear-gradient(170deg,#FFFAF2,#F6EADA); }

/* ---------- the phone ---------- */
/* the lens fades the phone out towards the headline, so the camera can
   sit close on the board and the top of the phone slides away under the
   words instead of colliding with them */
#lens{ position:absolute; inset:0; z-index:2; }
#cam{ position:absolute; left:0; top:0; width:415px; height:874px; transform-origin:0 0; }
.glow{ position:absolute; left:50%; top:-90px; width:640px; height:1060px; margin-left:-320px;
  background:radial-gradient(closest-side, rgba(0,0,0,.36), rgba(0,0,0,.16) 55%, transparent 78%); }
.phone{ position:absolute; inset:0; padding:11px; border-radius:62px; background:#0d0d10;
  box-shadow:inset 0 0 0 1.5px #3b3b42, inset 0 0 0 4px #17171b; }
.screen{ position:relative; width:393px; height:852px; border-radius:51px; overflow:hidden; background:#FFFAF2; }
.screen iframe{ position:absolute; left:0; top:54px; width:393px; height:798px; border:0; display:block; }
.status{ position:absolute; left:0; top:0; width:393px; height:54px; display:flex; align-items:center;
  justify-content:space-between; padding:14px 30px 0 44px; font:700 16px/1 "Karla",system-ui; letter-spacing:.2px; }
.status .r{ display:flex; align-items:center; gap:6px; }
.status svg{ display:block; }
.island{ position:absolute; left:50%; top:11px; width:124px; height:36px; margin-left:-62px; border-radius:20px; background:#000; }
.homebar{ position:absolute; left:50%; bottom:8px; width:138px; height:5px; margin-left:-69px; border-radius:3px; background:rgba(0,0,0,.42); }

/* ---------- the words ---------- */
#copy{ position:absolute; left:0; right:0; top:0; z-index:4; text-align:center; padding:0 22px; }
#copy .eyebrow{ font:700 15px/1 "Karla",system-ui; letter-spacing:3px; text-transform:uppercase; margin-bottom:12px; }
#copy h1{ font:800 44px/1.08 "Grandstander",system-ui; letter-spacing:-.4px; }
#copy h1 span{ display:block; white-space:nowrap; width:max-content; margin:0 auto; }
#copy h1 em{ font-style:normal; -webkit-background-clip:text; background-clip:text; color:transparent; }
#copy .line{ opacity:0; }
.deep #copy h1{ color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.10); }
.deep #copy .eyebrow{ color:rgba(255,255,255,.82); }
.deep #copy h1 em{ background-image:linear-gradient(100deg,#FFE9B4,#FFC658); text-shadow:none; }
.light #copy h1{ color:var(--text); }
.light #copy .eyebrow{ color:var(--accent-strong); }
.light #copy h1 em{ background-image:linear-gradient(100deg,#D98A18,#B8431F); }

/* ---------- the last card ---------- */
#end{ position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; opacity:0; pointer-events:none; padding:0 30px 40px; }
#end .pets{ display:flex; align-items:flex-end; justify-content:center; gap:14px; margin-bottom:30px; }
#end .pets canvas{ display:block; }
#end .icon{ width:132px; height:132px; border-radius:30px; display:block; box-shadow:0 14px 34px rgba(0,0,0,.34); }
#end .name{ font:800 64px/1 "Grandstander",system-ui; color:#fff; margin-top:22px; letter-spacing:-.5px; }
#end .tag{ font:700 25px/1.25 "Grandstander",system-ui; color:#FFE2A6; margin-top:10px; }
#end .cta{ margin-top:34px; padding:17px 34px 15px; border-radius:999px; background:#fff; color:#2C2118;
  font:800 27px/1 "Grandstander",system-ui; box-shadow:0 8px 0 rgba(0,0,0,.22); }
#end .fine{ margin-top:22px; font:600 16px/1.3 "Karla",system-ui; color:rgba(255,255,255,.86); letter-spacing:.3px; }
#end > *{ opacity:0; }
</style>
</head>
<body class="deep">
<div class="bg bg-amber on" data-bg="amber"></div>
<div class="bg bg-sage" data-bg="sage"></div>
<div class="bg bg-plum" data-bg="plum"></div>
<div class="bg bg-navy" data-bg="navy"></div>
<div class="bg bg-cream" data-bg="cream"></div>
<div class="bg bg-blush" data-bg="blush"></div>

<div id="lens"><div id="cam">
  <div class="glow"></div>
  <div class="phone"><div class="screen">
    <div class="status" id="status"><span>9:41</span><span class="r" id="statusIcons"></span></div>
    <iframe id="game" title="Pawtika"></iframe>
    <div class="island"></div>
    <div class="homebar"></div>
  </div></div>
</div></div>

<div id="copy"></div>
<div id="end"></div>

<script src="films.js"></script>
<script src="bed.js"></script>
<script>
const P = new URLSearchParams(location.search);
const LANG = P.get('lang') === 'tr' ? 'tr' : 'en';
const FILM = P.get('film') || 'basket';
document.documentElement.lang = LANG;

const $ = (s, r) => (r || document).querySelector(s);
const C = window.__clock || null;          /* absent when the page is just opened in a browser */
const game = $('#game');
const K = () => game.contentWindow;        /* the game's window */
const BL = () => K().BL;
const KC = () => K().__clock;

const ease = {
  out: k => 1 - Math.pow(1 - k, 3),
  inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }
};
const lerp = (a, b, k) => a + (b - a) * k;

/* a tween and a wait on whichever clock is running the page */
const tween = (ms, fn, e) => C ? C.tween(ms, fn, e) : new Promise(done => {
  const t0 = performance.now();
  const step = () => { const k = Math.min(1, (performance.now() - t0) / ms); fn(e ? e(k) : k); k < 1 ? requestAnimationFrame(step) : done(); };
  step();
});
const wait = ms => C ? C.wait(ms) : new Promise(r => setTimeout(r, ms));
/* the same on the game's clock, for while the camera is off */
const kwait = ms => KC() ? KC().wait(ms) : new Promise(r => setTimeout(r, ms));

const AD = window.AD = {
  ready: false, rec: false, done: false, err: null, n: 0, marks: [],

  /* ---- what record.js calls ---- */
  start() {
    if (C) C.freeze();
    if (KC()) KC().freeze();
    AD.rec = true;
    const film = FILMS[FILM];
    Promise.resolve().then(() => film(AD, LANG)).then(() => { AD.done = true; }, e => { AD.err = String(e && e.stack || e); AD.done = true; });
  },
  async tick() {
    const dt = 1000 / 60;
    const kc = KC();
    if (AD.rec) { AD.n++; await kc.audioTo(AD.n / 60); }
    kc.advance(dt);
    await null;
    if (AD.rec) C.advance(dt);
    await null;
    return { rec: AD.rec, done: AD.done, err: AD.err, n: AD.n };
  },
  wav: () => KC().wav(),

  /* ---- what a film calls ---- */
  wait, kwait, tween, ease, K, BL,
  lang: LANG,
  mark(name) { AD.marks.push({ name, at: AD.n / 60 }); },

  /* The camera: which point of the phone's screen (in the game's own
     393 x 852 points, status bar included) sits at which point of the
     page, and how large. */
  camNow: { s: 1, sx: 196.5, sy: 426, px: 270, py: 560 },
  setCam(c) {
    Object.assign(AD.camNow, c);
    const m = AD.camNow;
    $('#cam').style.transform = `translate(${m.px - m.s * (11 + m.sx)}px,${m.py - m.s * (11 + m.sy)}px) scale(${m.s})`;
  },
  cam(to, ms, e) {
    const a = Object.assign({}, AD.camNow), b = Object.assign({}, a, to);
    return tween(ms || 0, k => AD.setCam({ s: lerp(a.s, b.s, k), sx: lerp(a.sx, b.sx, k), sy: lerp(a.sy, b.sy, k), px: lerp(a.px, b.px, k), py: lerp(a.py, b.py, k) }), e || ease.inOut);
  },
  /* a small knock on the camera, for a cut or a blast */
  async punch(amount, ms) {
    const s0 = AD.camNow.s;
    await tween(ms || 260, k => AD.setCam({ s: s0 * (1 + (amount || .03) * Math.sin(Math.PI * k)) }));
    AD.setCam({ s: s0 });
  },

  bg(name, ms, tone) {
    const on = $('.bg.on'), nx = $(`.bg[data-bg="${name}"]`);
    if (tone) document.body.className = tone;
    if (!nx || nx === on) return Promise.resolve();
    nx.style.zIndex = 1; nx.classList.add('on'); nx.style.opacity = 0;
    return tween(ms || 0, k => { nx.style.opacity = k; }).then(() => {
      if (on) { on.classList.remove('on'); on.style.opacity = ''; }
      nx.style.zIndex = ''; nx.style.opacity = '';
    });
  },
  /* where the phone starts to show, in page points from the top; 0 is
     the whole phone */
  lensAt: 0,
  setLens(y) {
    AD.lensAt = y;
    const m = y <= 0 ? 'none' : `linear-gradient(to bottom, transparent ${y - 30}px, #000 ${y}px)`;
    $('#lens').style.webkitMaskImage = m; $('#lens').style.maskImage = m;
  },
  lens(y, ms) { const y0 = AD.lensAt; return tween(ms || 0, k => AD.setLens(lerp(y0, y, k))); },
  /* The camera, said the way a film wants to say it: this stretch of the
     game's screen (in the game's own points, top and bottom) is to fill
     this stretch of the page, as large as the page's width allows. */
  frame(a, b, o) {
    o = o || {};
    const y0 = o.y0 === undefined ? 252 : o.y0, y1 = o.y1 === undefined ? 780 : o.y1;
    const s = Math.min(o.max || 1.16, (y1 - y0) / (b - a));
    return { s, sx: o.sx === undefined ? 196.5 : o.sx, sy: 54 + (a + b) / 2, px: 270, py: o.top ? y0 + s * (b - a) / 2 : (y0 + y1) / 2 };
  },
  /* the top and bottom of something in the game, for frame() */
  span(...sel) {
    let a = 1e9, b = -1e9;
    /* where it will be, not where it is: a screen or a card that is still
       arriving is scaled, and its rectangle is a few points out */
    sel.forEach(q => {
      const el = typeof q === 'string' ? K().document.querySelector(q) : q;
      let y = 0;
      for (let n = el; n; n = n.offsetParent) y += n.offsetTop;
      for (let p = el.parentElement; p; p = p.parentElement) y -= p.scrollTop;
      a = Math.min(a, y); b = Math.max(b, y + el.offsetHeight);
    });
    return [a, b];
  },

  /* A headline: one or two lines, [[...]] takes the gradient. The old
     one leaves upward as the new one arrives from below. */
  async copy(lines, o) {
    o = o || {};
    const box = $('#copy');
    const old = [...box.children];
    const leave = old.length ? tween(o.out === undefined ? 180 : o.out, k => old.forEach(el => { el.style.opacity = 1 - k; el.style.transform = `translateY(${-14 * k}px)`; })).then(() => old.forEach(el => el.remove())) : null;
    if (leave) await leave;
    if (!lines) return;
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const mark = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<em>$1</em>');
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;left:0;right:0;top:${o.top === undefined ? 120 : o.top}px;padding:0 22px`;
    el.innerHTML = (o.eyebrow ? `<div class="eyebrow line">${esc(o.eyebrow)}</div>` : '') +
      `<h1>${lines.map(l => `<span class="line">${mark(l)}</span>`).join('')}</h1>`;
    box.appendChild(el);
    const h = $('h1', el);
    if (o.size) h.style.fontSize = o.size + 'px';
    /* a line wider than the page is made smaller until it is not */
    let px = parseFloat(getComputedStyle(h).fontSize);
    const wide = () => Math.max(...[...h.children].map(s => s.scrollWidth));
    while (wide() > 540 - 64 && px > 26) { px -= .5; h.style.fontSize = px + 'px'; }
    const ls = [...el.querySelectorAll('.line')];
    const stagger = o.stagger === undefined ? 90 : o.stagger, dur = o.in === undefined ? 380 : o.in;
    await tween(dur + stagger * (ls.length - 1), kAll => {
      const t = kAll * (dur + stagger * (ls.length - 1));
      ls.forEach((l, i) => {
        const k = Math.max(0, Math.min(1, (t - i * stagger) / dur));
        const e = ease.back(k);
        l.style.opacity = Math.min(1, k * 2.2);
        l.style.transform = `translateY(${(1 - e) * 26}px) scale(${.94 + .06 * e})`;
      });
    });
  },

  /* ---- hands ---- */
  finger: null,
  fingerEl() {
    if (AD.finger && AD.finger.isConnected) return AD.finger;
    const d = K().document, el = d.createElement('div');
    el.style.cssText = 'position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;' +
      'background:rgba(255,255,255,.5);border:3px solid #fff;' +
      'box-shadow:0 0 0 1.5px rgba(44,33,24,.55),0 4px 14px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(44,33,24,.22);z-index:99999;pointer-events:none;opacity:0;';
    d.body.appendChild(el);
    AD.fingerAt = { x: 300, y: 700, o: 0, s: 1 };
    return AD.finger = el;
  },
  fingerSet(p) {
    const el = AD.fingerEl();
    Object.assign(AD.fingerAt, p);
    const f = AD.fingerAt;
    el.style.opacity = f.o;
    el.style.transform = `translate(${f.x}px,${f.y}px) scale(${f.s})`;
  },
  /* glide to a point of the game's screen, arriving visible */
  async fingerTo(x, y, ms) {
    AD.fingerEl();
    const a = Object.assign({}, AD.fingerAt);
    if (a.o < .05) { a.x = x + 46; a.y = y + 70; }
    await tween(ms === undefined ? 300 : ms, k => AD.fingerSet({ x: lerp(a.x, x, k), y: lerp(a.y, y, k), o: lerp(a.o, 1, Math.min(1, k * 2)), s: 1 }), ease.out);
  },
  fingerDown: () => tween(90, k => AD.fingerSet({ s: lerp(1, .74, k) })),
  fingerUp: () => tween(120, k => AD.fingerSet({ s: lerp(.74, 1, k) })),
  fingerAway: ms => { const o = AD.fingerAt ? AD.fingerAt.o : 0; return tween(ms === undefined ? 200 : ms, k => AD.fingerSet({ o: lerp(o, 0, k) })); },

  centre(target) {
    const el = typeof target === 'string' ? K().document.querySelector(target) : target;
    if (!el) throw new Error('nothing to tap: ' + target);
    const r = el.getBoundingClientRect();
    return { el, x: r.left + r.width / 2, y: r.top + r.height / 2 };
  },
  /* press one of the game's own buttons */
  async tap(target, o) {
    o = o || {};
    const { el, x, y } = AD.centre(target);
    await AD.fingerTo(x + (o.dx || 0), y + (o.dy || 0), o.ms);
    await AD.fingerDown();
    el.click();
    if (o.then) o.then();
    await AD.fingerUp();
    if (!o.stay) await AD.fingerAway();
  },
  /* type into one of the game's own fields */
  async type(target, text, per) {
    const { el } = AD.centre(target);
    for (let i = 1; i <= text.length; i++) {
      el.value = text.slice(0, i);
      el.dispatchEvent(new (K().Event)('input', { bubbles: true }));
      try { BL().SFX.tap(); } catch (e) { }
      await wait(per || 95);
    }
  },
  cell(r, c) {
    const G = BL().game, rect = K().document.querySelector('#board').getBoundingClientRect();
    return { x: rect.left + G.ox + (c + .5) * G.cell, y: rect.top + G.oy + (r + .5) * G.cell };
  },
  /* drag one tile onto its neighbour; resolves when the board is still */
  async swipe(a, b, o) {
    o = o || {};
    const pa = AD.cell(a[0], a[1]), pb = AD.cell(b[0], b[1]);
    await AD.fingerTo(pa.x, pa.y, o.ms === undefined ? 260 : o.ms);
    await AD.fingerDown();
    const move = BL().tryMove(a, b);
    await tween(150, k => AD.fingerSet({ x: lerp(pa.x, pb.x, k), y: lerp(pa.y, pb.y, k) }), ease.out);
    await AD.fingerUp();
    AD.fingerAway(180);
    if (!o.nowait) await move;
    return move;
  },
  async still(max) {
    const t0 = C ? C.t : 0;
    while (BL().game.busy && (!C || C.t - t0 < (max || 9000))) await wait(34);
  },

  /* Off camera: the game is moved on while nothing is filmed and no
     sound is kept, and the page's own clock stands still. */
  async offcam(fn) {
    const S = BL().save, snd = S.settings.sound;
    S.settings.sound = false;
    AD.rec = false;
    try { await fn(); } finally { BL().save.settings.sound = snd; AD.rec = true; }
  },
  clearModals() {
    const d = K().document;
    const m = d.getElementById('modals'); if (m) m.innerHTML = '';
    d.querySelectorAll('.veil').forEach(v => v.remove());
    const t = d.getElementById('toasts'); if (t) t.innerHTML = '';
  },
  /* the status bar takes the colour of whatever is under it */
  status(bg, dark) {
    const ink = dark ? '#fff' : '#17120d';
    $('#status').style.background = bg; $('#status').style.color = ink;
    $('#statusIcons').innerHTML = `
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="${ink}"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="${ink}"/><rect x="10" y="3" width="3" height="9" rx="1" fill="${ink}"/><rect x="15" y="0" width="3" height="12" rx="1" fill="${ink}"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.2c2.5 0 4.7 1 6.3 2.6l1.2-1.3C14 1.4 11.4 .2 8.5 .2S3 1.4 1 3.5l1.2 1.3C3.8 3.2 6 2.2 8.5 2.2z" fill="${ink}"/><path d="M8.5 6c1.5 0 2.8 .6 3.8 1.5l1.2-1.3C12.2 5 10.4 4.2 8.5 4.2S4.800 5 3.5 6.2l1.2 1.3C5.7 6.600 7 6 8.5 6z" fill="${ink}"/><circle cx="8.5" cy="10" r="1.8" fill="${ink}"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="${ink}" stroke-opacity=".45"/><rect x="2" y="2" width="19" height="9" rx="2" fill="${ink}"/><rect x="24" y="4.2" width="2" height="4.6" rx="1" fill="${ink}" fill-opacity=".5"/></svg>`;
  },
  /* whatever colour the game has at the top of its screen right now */
  statusAuto() {
    const d = K().document;
    let el = d.elementFromPoint(196, 2), bg = 'rgba(0, 0, 0, 0)';
    while (el && /rgba\(0, 0, 0, 0\)|transparent/.test(bg = K().getComputedStyle(el).backgroundColor)) el = el.parentElement;
    if (!el) bg = 'rgb(255, 250, 242)';
    const m = bg.match(/[\d.]+/g).map(Number);
    AD.status(bg, (m[0] * 299 + m[1] * 587 + m[2] * 114) / 1000 < 128);
  },

  /* ---- the last card ---- */
  async endCard(o) {
    const end = $('#end');
    const B = BL();
    /* each animal drawn by the game, then cut to what was drawn so they
       can stand on one line */
    const pets = (o.pets || [0, 2, 1]).map((bi, i) => {
      const S = 520, cv = document.createElement('canvas');
      cv.width = S; cv.height = S;
      const c = cv.getContext('2d');
      c.translate(S / 2, S * .3);
      const b = B.BREEDS[bi];
      B.art.drawBody(c, B.art.specOf(bi, b.coats[0], b.eyes), S * .42, { mouth: i === 1 ? 'open' : 'smile' });
      const px = c.getImageData(0, 0, S, S).data;
      let x0 = S, y0 = S, x1 = 0, y1 = 0;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (px[(y * S + x) * 4 + 3] > 40) {
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      const t = document.createElement('canvas');
      t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
      t.getContext('2d').drawImage(cv, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
      const h = i === 1 ? 178 : 138;
      t.style.height = h + 'px'; t.style.width = Math.round(h * t.width / t.height) + 'px';
      return t;
    });
    end.innerHTML = `<div class="pets"></div>
      <img class="icon" src="../../icons/icon-512.png" alt="">
      <div class="name">Pawtika</div>
      <div class="tag">${o.tag}</div>
      <div class="cta">${o.cta}</div>
      <div class="fine">${o.fine}</div>`;
    const row = $('.pets', end);
    pets.forEach(p => row.appendChild(p));
    end.style.opacity = 1;
    const kids = [...end.children];
    const dur = 420, stagger = 110;
    await tween(dur + stagger * (kids.length - 1), kAll => {
      const t = kAll * (dur + stagger * (kids.length - 1));
      kids.forEach((el, i) => {
        const k = Math.max(0, Math.min(1, (t - i * stagger) / dur)), e = ease.back(k);
        el.style.opacity = Math.min(1, k * 2);
        el.style.transform = `translateY(${(1 - e) * 30}px) scale(${.9 + .1 * e})`;
      });
    });
  }
};

/* the game, at an iPhone's point size, in the language of the film */
game.addEventListener('load', async () => {
  const until = async f => { for (let i = 0; i < 600 && !f(); i++) await new Promise(r => setTimeout(r, 30)); };
  await until(() => K().BL && K().BL.save);
  await document.fonts.ready;
  if (K().document.fonts) await K().document.fonts.ready;
  BL().setLang(LANG);
  AD.setCam({});
  AD.status('#FFFAF2', false);
  if (FILMS[FILM + ':before']) await FILMS[FILM + ':before'](AD, LANG);
  AD.ready = true;
  if (!C) AD.start();
});
game.src = '../../pawtika.html?' + (P.get('seed') ? 'seed=' + P.get('seed') : '');
</script>
