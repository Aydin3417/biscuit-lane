<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pawtika — App Store slides</title>
<!--
  The App Store screenshots, as one page.

    slides.html            every slide, English, in a grid (for looking at)
    slides.html#tr         the same in Turkish
    slides.html#en-3       slide 3 alone at 440 x 956, which render.py
                           photographs at 3x = 1320 x 2868 (iPhone 6.9")
    slides.html#en-3-pad   slide 3 alone at 1032 x 1376, at 2x = 2064 x 2752
                           (iPad 13")

  Every screen inside a frame is a photograph of the game itself, taken by
  capture.js; nothing is redrawn. The type is the game's own (Grandstander
  and Karla, from src/fonts.css), and every colour is one of its tokens.
-->
<link rel="stylesheet" href="../../src/fonts.css">
<script src="raw/meta.js"></script>
<style>
:root{
  --cream:#F6EADA; --surface:#FFFAF2; --text:#2C2118; --dim:#6B5949;
  --accent:#D98A18; --accent-strong:#7E4C0A; --accent-soft:#F7D79B;
  --rose:#A82C44; --rose-soft:#F6CCD3; --sage:#276853; --sage-soft:#C4E4D4;
  --plum:#6E5A8C; --sky:#3C86C4; --navy:#1B2636;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:#15110d; }
body{ font-family:"Karla",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
body.grid{ display:flex; flex-wrap:wrap; gap:18px; padding:18px; }
body.single{ overflow:hidden; }

/* ---------- a slide ---------- */
.slide{ position:relative; width:440px; height:956px; overflow:hidden; flex:0 0 auto; }
.slide .bg{ position:absolute; inset:0; }
.copy{ position:absolute; left:0; right:0; top:62px; text-align:center; padding:0 26px; z-index:3; }
.brand{ display:inline-flex; align-items:center; gap:9px; margin-bottom:11px; margin-top:-14px; }
.brand img{ width:34px; height:34px; border-radius:9px; display:block; }
.brand b{ font:800 21px/1 "Grandstander",system-ui; letter-spacing:.2px; }
.eyebrow{ font:700 12.5px/1 "Karla",system-ui; letter-spacing:2.6px; text-transform:uppercase; margin-bottom:13px; }
h1{ font:800 39px/1.1 "Grandstander",system-ui; letter-spacing:-.3px; }
h1 span{ display:block; white-space:nowrap; width:max-content; margin:0 auto; }
h1 em{ font-style:normal; -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub{ margin:13px auto 0; max-width:350px; font:500 16px/1.38 "Karla",system-ui; }

/* deep slides: white type, a warm highlight */
.deep .brand b, .deep h1{ color:#fff; }
.deep .eyebrow{ color:rgba(255,255,255,.80); }
.deep .sub{ color:rgba(255,255,255,.90); }
.deep h1 em{ background-image:linear-gradient(100deg,#FFE9B4,#FFC658); }
/* light slides: the game's own ink, the accent as highlight */
.light .brand b, .light h1{ color:var(--text); }
.light .eyebrow{ color:var(--accent-strong); }
.light .sub{ color:var(--dim); }
.light h1 em{ background-image:linear-gradient(100deg,#D98A18,#B8431F); }

/* backgrounds: layered radial gradients over one base, so seven slides
   side by side read as one set */
.bg-amber{ background:
  radial-gradient(120% 60% at 12% 0%, rgba(255,214,140,.55), transparent 60%),
  radial-gradient(90% 55% at 100% 38%, rgba(255,160,60,.35), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(110,52,6,.75), transparent 60%),
  linear-gradient(165deg,#D98A18,#A85F0B 55%,#7E4C0A); }
.bg-sage{ background:
  radial-gradient(120% 60% at 90% 0%, rgba(196,228,212,.45), transparent 60%),
  radial-gradient(90% 55% at 0% 40%, rgba(88,170,140,.35), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(12,48,38,.8), transparent 60%),
  linear-gradient(165deg,#3A8A70,#276853 55%,#184536); }
.bg-plum{ background:
  radial-gradient(120% 60% at 10% 0%, rgba(214,196,240,.45), transparent 60%),
  radial-gradient(90% 55% at 100% 42%, rgba(168,44,68,.28), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(38,26,58,.85), transparent 60%),
  linear-gradient(165deg,#8672A8,#6E5A8C 55%,#463861); }
.bg-navy{ background:
  radial-gradient(120% 60% at 88% 0%, rgba(120,150,210,.35), transparent 60%),
  radial-gradient(90% 55% at 0% 40%, rgba(217,138,24,.22), transparent 62%),
  radial-gradient(120% 70% at 50% 110%, rgba(6,10,18,.9), transparent 60%),
  linear-gradient(165deg,#2C3B55,#1B2636 55%,#111827); }
.bg-cream{ background:
  radial-gradient(110% 55% at 95% 0%, rgba(247,215,155,.95), transparent 62%),
  radial-gradient(100% 55% at 0% 46%, rgba(196,228,212,.75), transparent 60%),
  radial-gradient(120% 60% at 60% 108%, rgba(233,216,195,.95), transparent 60%),
  linear-gradient(170deg,#FFFAF2,#F6EADA); }
.bg-blush{ background:
  radial-gradient(110% 55% at 5% 0%, rgba(246,204,211,.95), transparent 62%),
  radial-gradient(100% 55% at 100% 44%, rgba(247,215,155,.8), transparent 60%),
  radial-gradient(120% 60% at 40% 108%, rgba(233,216,195,.95), transparent 60%),
  linear-gradient(170deg,#FFFAF2,#F6EADA); }
.bg-sky{ background:
  radial-gradient(110% 55% at 92% 0%, rgba(176,214,244,.9), transparent 62%),
  radial-gradient(100% 55% at 0% 46%, rgba(247,215,155,.8), transparent 60%),
  radial-gradient(120% 60% at 60% 108%, rgba(233,216,195,.95), transparent 60%),
  linear-gradient(170deg,#FFFAF2,#F6EADA); }

/* ---------- the phone ---------- */
.stage{ position:absolute; left:50%; top:332px; width:415px; height:874px; margin-left:-207.5px;
  transform:scale(.85); transform-origin:top center; z-index:2; }
/* the glow is a gradient, not a blurred shadow: headless Chromium paints
   a large box-shadow blur as a visible square */
.glow{ position:absolute; left:50%; top:242px; width:620px; height:900px; margin-left:-310px; z-index:1;
  background:radial-gradient(closest-side, rgba(0,0,0,.34), rgba(0,0,0,.16) 55%, transparent 78%); }
.light .glow{ background:radial-gradient(closest-side, rgba(92,58,20,.30), rgba(92,58,20,.12) 55%, transparent 78%); }
.phone{ position:absolute; inset:0; padding:11px; border-radius:62px; background:#0d0d10;
  box-shadow:inset 0 0 0 1.5px #3b3b42, inset 0 0 0 4px #17171b; }
.screen{ position:relative; width:393px; height:852px; border-radius:51px; overflow:hidden; background:#000; }
.screen img.shot{ position:absolute; left:0; top:54px; width:393px; height:798px; display:block; }
.status{ position:absolute; left:0; top:0; width:393px; height:54px; display:flex; align-items:center;
  justify-content:space-between; padding:14px 30px 0 44px; font:700 16px/1 "Karla",system-ui; letter-spacing:.2px; }
.status .r{ display:flex; align-items:center; gap:6px; }
.status svg{ display:block; }
.island{ position:absolute; left:50%; top:11px; width:124px; height:36px; margin-left:-62px; border-radius:20px; background:#000; }
.homebar{ position:absolute; left:50%; bottom:8px; width:138px; height:5px; margin-left:-69px; border-radius:3px; background:rgba(0,0,0,.42); }

/* an animal sitting on the top edge of the phone, drawn by the game */
.pet{ position:absolute; z-index:1; bottom:calc(956px - 332px - 8px); width:78px; }
.pet.r{ right:62px; } .pet.l{ left:62px; }
.pet img{ display:block; width:100%; }

/* ---------- the iPad variant ---------- */
.slide.pad{ width:1032px; height:1376px; }
.pad .copy{ top:96px; padding:0 80px; }
.pad .brand img{ width:56px; height:56px; border-radius:14px; }
.pad .brand b{ font-size:34px; }
.pad .brand{ gap:14px; margin-bottom:20px; }
.pad .eyebrow{ font-size:20px; letter-spacing:4.2px; margin-bottom:20px; }
.pad h1{ font-size:70px; }
.pad .sub{ font-size:27px; max-width:720px; margin-top:22px; }
.pad .stage{ top:478px; width:1084px; height:1428px; margin-left:-542px; transform:scale(.74); }
.pad .glow{ top:340px; width:1300px; height:1500px; margin-left:-650px; }
.pad .phone{ padding:26px; border-radius:58px; }
.pad .screen{ width:1032px; height:1376px; border-radius:34px; }
.pad .screen img.shot{ top:40px; width:1032px; height:1336px; }
.pad .status{ width:1032px; height:40px; padding:6px 30px 0 34px; font-size:17px; }
.pad .island{ display:none; }
.pad .homebar{ width:300px; margin-left:-150px; bottom:10px; height:6px; }
.pad .pet{ bottom:calc(1376px - 478px - 14px); width:150px; }
.pad .pet.r{ right:150px; } .pad .pet.l{ left:150px; }
</style>
</head>
<body>
<script>
/* One list, two languages. A headline is two lines; [[...]] marks the
   words that take the gradient. Every claim is something the store build
   does: see the honesty table in store/slides/README.md. */
const SLIDES = [
  { screen: 'board', bg: 'amber', tone: 'deep', pet: 'void', side: 'r', brand: true,
    en: { h: ['Match 3 with', '[[your own pets]]'], sub: 'The cats and dogs on the board are the ones you adopt and raise.' },
    tr: { h: ['[[Kendi hayvanlarınla]]', 'üçlü eşleştirme'], sub: 'Tahtadaki kediler ve köpekler, sahiplenip büyüttüğün dostların.' } },
  { screen: 'room', bg: 'cream', tone: 'light', pet: 'marmalade', side: 'l',
    en: { eyebrow: 'Adopt & raise', h: ['Adopt cats and dogs,', '[[watch them grow]]'], sub: 'Feed them, play, wash and tuck them in. A happy pet brings extra moves.' },
    tr: { eyebrow: 'SAHİPLEN, BÜYÜT', h: ['Kedi, köpek sahiplen,', '[[büyümelerini izle]]'], sub: 'Besle, oyna, yıka, uyut. Mutlu bir dost tahtaya fazladan hamle getirir.' } },
  { screen: 'lane', bg: 'sage', tone: 'deep', pet: 'beagle', side: 'r',
    en: { eyebrow: 'Hundreds of levels', h: ['A puzzle lane that', '[[keeps on going]]'], sub: 'Mud, crates, brambles and baskets to walk home, one garden gate at a time.' },
    tr: { eyebrow: 'YÜZLERCE BÖLÜM', h: ['Hiç bitmeyen bir', '[[bulmaca yolu]]'], sub: 'Çamur, kasalar, böğürtlenler ve eve götürülecek yavru sepetleri.' } },
  { screen: 'breeds', bg: 'blush', tone: 'light', pet: 'siamese', side: 'l',
    en: { eyebrow: 'Six breeds', h: ['Pick who comes', '[[home with you]]'], sub: 'Three cats, three dogs, and each one brings its own special move.' },
    tr: { eyebrow: 'ALTI CİNS', h: ['Eve kim gelecek,', '[[sen seç]]'], sub: 'Üç kedi, üç köpek; her birinin tahtada kendine özgü bir hamlesi var.' } },
  { screen: 'shop', bg: 'plum', tone: 'deep', pet: 'pug', side: 'r',
    en: { eyebrow: 'Make it home', h: ['Decorate a [[cozy]]', 'room for them'], sub: 'Rugs, armchairs, cat towers, hats and collars, all earned by playing.' },
    tr: { eyebrow: 'YUVA YAP', h: ['Onlara [[sıcacık]]', 'bir oda döşe'], sub: 'Halılar, koltuklar, kedi kuleleri, şapkalar ve tasmalar; hepsi oynayarak kazanılır.' } },
  { screen: 'gift', bg: 'sky', tone: 'light', pet: 'retriever', side: 'l',
    en: { eyebrow: 'Every day', h: ['[[A gift on the step,]]', 'a walk to take'], sub: 'A daily basket that grows for seven days, and a fresh level every morning.' },
    tr: { eyebrow: 'HER GÜN', h: ['[[Kapıda bir hediye,]]', 'günün yürüyüşü'], sub: 'Yedi gün boyunca büyüyen bir sepet ve her sabah yeni bir bölüm.' } },
  { screen: 'win', bg: 'navy', tone: 'deep', pet: 'marmalade', side: 'r',
    en: { eyebrow: 'No interruptions', h: ['Three stars and', '[[one happy cat]]'], sub: 'Plays offline. No ad ever breaks into a level: a video only when you ask.' },
    tr: { eyebrow: 'KESİNTİ YOK', h: ['Üç yıldız ve', '[[mutlu bir kedi]]'], sub: 'İnternetsiz oynanır. Hiçbir reklam bölümü bölmez; video sadece sen isteyince.' } }
];

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const mark = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<em>$1</em>');
const ICONS = c => `
  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="${c}"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="${c}"/><rect x="10" y="3" width="3" height="9" rx="1" fill="${c}"/><rect x="15" y="0" width="3" height="12" rx="1" fill="${c}"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.2c2.5 0 4.7 1 6.3 2.6l1.2-1.3C14 1.4 11.400 .2 8.5 .2S3 1.4 1 3.500l1.200 1.300C3.800 3.200 6 2.200 8.500 2.200z" fill="${c}"/><path d="M8.5 6c1.500 0 2.800 .600 3.800 1.500l1.200-1.300C12.200 5 10.400 4.200 8.500 4.200S4.800 5 3.500 6.200l1.200 1.300C5.700 6.600 7 6 8.500 6z" fill="${c}"/><circle cx="8.5" cy="10" r="1.800" fill="${c}"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.500" fill="none" stroke="${c}" stroke-opacity=".45"/><rect x="2" y="2" width="19" height="9" rx="2" fill="${c}"/><rect x="24" y="4.200" width="2" height="4.600" rx="1" fill="${c}" fill-opacity=".5"/></svg>`;

function slide(i, lang, dev) {
  const s = SLIDES[i], t = s[lang];
  const meta = (window.RAW_META || {})[`${dev}-${lang}-${s.screen}`] || { top: '#FFFAF2', dark: false };
  const ink = meta.dark ? '#fff' : '#17120d';
  const el = document.createElement('section');
  el.className = `slide ${s.tone}${dev === 'pad' ? ' pad' : ''}`;
  el.id = `s${i + 1}`;
  el.innerHTML = `
    <div class="bg bg-${s.bg}"></div>
    <div class="copy">
      ${s.brand ? `<div class="brand"><img src="raw/icon.png" alt=""><b>Pawtika</b></div>` : `<div class="eyebrow">${esc(t.eyebrow)}</div>`}
      <h1>${t.h.map(l => `<span>${mark(l)}</span>`).join('')}</h1>
      <p class="sub">${esc(t.sub)}</p>
    </div>
    <div class="glow"></div>
    <div class="pet ${s.side}"><img src="raw/pet-${s.pet}.png" alt=""></div>
    <div class="stage"><div class="phone"><div class="screen">
      <div class="status" style="background:${meta.top};color:${ink}"><span>9:41</span><span class="r">${ICONS(ink)}</span></div>
      <img class="shot" src="raw/${dev}-${lang}-${s.screen}.png" alt="">
      <div class="island"></div>
      <div class="homebar"></div>
    </div></div></div>`;
  return el;
}

/* #en-3 or #tr-3-pad shows one slide alone; anything else is the grid */
const m = /^#?(en|tr)?(?:-(\d+))?(?:-(pad))?$/.exec(location.hash || '#en') || [];
const lang = m[1] || 'en', n = +m[2] || 0, dev = m[3] || (location.hash.indexOf('pad') >= 0 ? 'pad' : 'phone');
document.documentElement.lang = lang;
if (n) { document.body.className = 'single'; document.body.appendChild(slide(n - 1, lang, dev)); }
else { document.body.className = 'grid'; SLIDES.forEach((_, i) => document.body.appendChild(slide(i, lang, dev))); }
/* a headline that is wider than its slide is made smaller until it is
   not: Turkish runs a third longer than English, and a line that leaves
   the frame is worse than one two points smaller */
document.querySelectorAll('.slide').forEach(sl => {
  const h = sl.querySelector('h1'), max = sl.clientWidth - (sl.classList.contains('pad') ? 120 : 36);
  let px = parseFloat(getComputedStyle(h).fontSize);
  const wide = () => Math.max(...[...h.children].map(s => s.scrollWidth));
  while (wide() > max && px > 24) { px -= .5; h.style.fontSize = px + 'px'; }
});
window.SLIDE_COUNT = SLIDES.length;
</script>
</body>
</html>
