/* Beyond the handcrafted run, keep going forever. */
/* How much mud and how many crates a map actually contains.
   'M' is two layers of mud; 'C' is a two-hit crate but still one crate. */
function mapStock(def) {
  let mud = 0, crate = 0, bram = 0;
  (def.map || []).forEach(row => {
    for (const ch of row) {
      if (ch === 'm') mud += 1;
      else if (ch === 'M') mud += 2;
      else if (ch === 'c' || ch === 'C') crate += 1;
      else if (ch === 'v') bram += 1;
    }
  });
  return { mud, crate, bram };
}

/* A mud or crate goal can only ask for what the board holds. Asking for
   more makes the level literally uncompletable, so every definition is
   clamped to its own map on the way out — including generated ones. */
function normaliseGoals(def) {
  if (def._fixed) return def;
  const stock = mapStock(def);
  const goals = [];
  def.goals.forEach(g => {
    const [kind, arg, count] = g;
    if (kind === GK.BRAMBLE) {
      /* A bramble only spreads from another bramble, so once the patch is
         fully cut there is nothing left to grow — asking for more cuts
         than the patch holds can strand the level one short. The goal is
         "clear the patch"; the regrowth is what makes that hard. */
      if (stock.bram <= 0) return;
      goals.push([kind, arg, Math.min(count, stock.bram)]);
      return;
    }
    if (kind === GK.MUD || kind === GK.CRATE) {
      const have = kind === GK.MUD ? stock.mud : stock.crate;
      if (have <= 0) return;                       // nothing to clean: drop it
      goals.push([kind, arg, Math.min(count, have)]);
    } else goals.push(g);
  });
  if (!goals.length) goals.push([GK.SCORE, 0, def.base]);
  def.goals = goals;
  def._fixed = true;
  return def;
}

/* Each kind resolves at its own speed — crates go down about twice as

   board clears about eleven a move, on six about nine. Everything the
   generator asks for is worked back from these instead of guessed, and
   every one of them stops climbing at the top tier — a goal that grows
   without a ceiling is a level that eventually cannot be won. */
/* Targeted tiles a move turns up while you are chasing two colours,
   measured with the solver. The fifth colour is worth far more than its
   share of the board suggests, because a board with one colour fewer
   cascades much further, so these are two measurements rather than one

   for; 30 moves on six delivers about 60. */
const COLLECT_RATE = { 5: 5.4, 6: 2.0 };
function collectPair(moves, types, tier) {
  const rate = COLLECT_RATE[types] || COLLECT_RATE[6];
  const total = Math.round(moves * rate * (.90 + tier * .05));
  return [Math.round(total * .55), Math.round(total * .45)];

/* ---------- shapes for the generated levels ----------

   A generated map used to be a coin flip per cell, which is fair — the
   goals are worked out from whatever it produces — and shapeless. Sixty
   handcrafted levels have arrangements somebody chose, and then level 61
   is static. These are eight arrangements, picked by seed, so a
   generated board has a form you can read at a glance and plan against.

   Each returns the cells to fill. Coverage is kept between roughly a
   third and a half so the stock, and therefore the goal, stays sane. */
function shapeMask(name, w, h, r) {
  const on = new Set();
  const add = (y, x) => { if (y >= 0 && y < h && x >= 0 && x < w) on.add(y + ':' + x); };
  const cx = (w - 1) / 2, cy = (h - 1) / 2;
  if (name === 'bands') {
    const top = 1 + Math.floor(r() * 2);
    for (let y = top; y < h - 1; y += 3) for (let x = 0; x < w; x++) { add(y, x); add(y + 1, x); }
  } else if (name === 'columns') {
    const off = Math.floor(r() * 2);
    for (let x = off; x < w; x += 3) for (let y = 1; y < h - 1; y++) { add(y, x); add(y, x + 1); }
  } else if (name === 'diamond') {
    const rad = Math.min(w, h) * .52;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
      if (Math.abs(x - cx) + Math.abs(y - cy) * 1.05 <= rad) add(y, x);
  } else if (name === 'ring') {
    const m = 1 + Math.floor(r() * 2);
    for (let y = m; y < h - m; y++) for (let x = m; x < w - m; x++)
      if (y === m || y === h - m - 1 || x === m || x === w - m - 1) { add(y, x); }
    for (let x = m; x < w - m; x++) { add(m + 1, x); add(h - m - 2, x); }
  } else if (name === 'corners') {
    const bw = Math.max(2, Math.round(w * .38)), bh = Math.max(2, Math.round(h * .30));
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      add(y + 1, x); add(y + 1, w - 1 - x);
      add(h - 2 - y, x); add(h - 2 - y, w - 1 - x);
    }
  } else if (name === 'checker') {
    for (let y = 1; y < h - 1; y++) for (let x = 0; x < w; x++)
      if (((y >> 1) + (x >> 1)) % 2 === 0) add(y, x);
  } else if (name === 'wedge') {
    const flip = r() < .5;
    for (let y = 1; y < h - 1; y++) {
      const n = Math.round((y / (h - 1)) * w);
      for (let x = 0; x < n; x++) add(y, flip ? x : w - 1 - x);
    }
  } else {                                   /* blob */
    const bx = 2 + r() * (w - 4), by = 2.2 + r() * (h - 4.4);
    const rad = Math.min(w, h) * (.40 + r() * .10);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
      if (Math.hypot(x - bx, (y - by) * .92) <= rad && r() < .93) add(y, x);
  }
  return on;
}
const SHAPES = ['bands', 'columns', 'diamond', 'ring', 'corners', 'checker', 'wedge', 'blob'];

/* `ref` builds the level as it would be with no target at all: the
   generator's own move count, its own goal sizes, nothing solved for.

   That exists to break a circle. The response curves in 12-curve.js are
   measured by playing levels, and the generator reads those curves to
   decide how many moves a level gets — so measuring the generator's own
   output would be measuring the curve against itself, and the numbers
   would describe nothing. Calibration plays reference builds, which
   depend on no measurement, and the curve then says what a budget does
   *relative to that fixed point*. */
function levelDef(n, ref) {
  /* The daily used to be reached through here, which is how the level
     table came to read SAVE.reached. It is its own generator with its
     own seed — call dailyLevel() for it. Said out loud because the
     alternative is LEVELS[-2] and a TypeError three frames away. */
  if (n === DAILY_LEVEL) throw new Error('levelDef: the daily is dailyLevel(reached), not a level number');
  /* An authored level carries no gate flag of its own — the block
     rhythm is not the table's business — so it is stamped on the way
     out. Without this the lane's gates were marked on the map, which
     computes isGate itself, and not on the level card, which reads
     def.gate: the same level was a gate in one place and not in the
     other. */
  if (n <= LEVELS.length) {
    const def = normaliseGoals(LEVELS[n - 1]);
    def.gate = isGate(n);
    return def;
  }
  const r = mulberry(n * 7919);
  /* Molehills arrive part way through the run rather than at the start.

     Three hundred levels of the same six goal kinds is the run's real
     weakness, and a mechanic held back is worth more than a mechanic
     handed over: level seventy-six is a long way into a game, and
     something genuinely new turning up there is the difference between
     a run that continues and a run that repeats. Before that the lane
     has enough to teach. */
  const kinds = [GK.COLLECT, GK.MUD, GK.CRATE, GK.RESCUE, GK.SCORE, GK.BRAMBLE]
    .concat(n >= MOLE_FROM ? [GK.MOLE] : []);

  /* What this level is for comes before what it is made of.

     Measured, the goal kinds cannot all be made to feel the same way. A
     rescue tops out around eighty percent however many moves it is
     given — two baskets have to be walked the length of the board and
     that takes what it takes — and a bramble patch grows back, which
     puts a ceiling near seventy. Meanwhile a mud goal is a share of what
     the map holds, so it stays winnable about half the time even at half
     its budget.

     So the level's target is chosen first, and then a kind that can
     actually reach it. Rolling the kind first and hoping is how a relief
     level ends up being a bramble patch nobody can clear. */
  const want = targetClear(n);
  const keyOf = k => (k === GK.BRAMBLE ? 'bramble' : k);
  const fits = kinds.filter(k => {
    const rng = budgetRange(keyOf(k));
    return want >= rng[0] - .05 && want <= rng[1] + .05;
  });
  const pool = fits.length ? fits : kinds;
  const kind = pool[Math.floor(r() * pool.length)];
  const tier = Math.min(4, Math.floor((n - 40) / 12));
  const h = 9, w = 8;
  /* the early tiers deal one colour fewer, which is how the handcrafted
     lane eases a player in — not by asking for less */
  const types = tier <= 1 ? 5 : 6;
  const key = kind === GK.BRAMBLE ? 'bramble' : kind;

  /* ---- how hard this level is meant to be, and how to get there ----

     The old line was `moves = a constant + (tier % 2)`, which is to say
     no level had an intended difficulty and the run was noise inside a

     be won; budgetFor() reads the measured response curve backwards and
     answers with a move budget.

     Some goals barely answer their budget at all — a mud level at half
     its moves still clears three times in five, because a mud goal is a
     share of what the map holds and the map is the same map. For those,
     whatever the budget could not reach is carried into the work: more
     mud, more crates, a wider patch. */
  const reach = budgetRange(key);
  /* aim below the target by the model's measured error, or every level

       first generated batch ran three to six hills and came out at

       four moves and a player cannot be in six places at once. Three is
       where the mechanic is a race rather than a defeat. */

    base = GEN.rescue.base + tier * 400;
  } else if (kind === GK.MOLE) {

       getting worse, and a goal that lets the player ignore the whole
       mechanic teaches nobody what it is for. */
    goals.push([GK.MOLE, 0, hills.size]);

/* ===== 11-design.js ===== */
/* ============================================================
   THE SHAPE OF THE GAME
   ============================================================

   This file used to describe only the endless run, because only the run
   was designed. The sixty handcrafted levels in front of it were
   authored one at a time and given whatever move budget felt right, and
   then measured once. Measured again, that lane was a bathtub:

     L1-10  84%   L11-20 71%   L21-30 65%
     L31-40 66%   L41-50 65%   L51-60 73%

   Easy at both ends and a flat 65% grind for thirty levels through the
   middle — with seven levels under 45% scattered through it and ten that
   could not be lost. The hardest stretch of the whole game was levels
   21 to 50, and then it got *easier* just as the designed run took over
   at 78%. A player who quit this game quit somewhere in that plateau,
   and the plateau was not a decision anybody made.

   So the lane is designed now, on the same terms as the run, and the two
   are one curve rather than two systems. Three rules cover the whole
   game, and they turned out to be the same rules written twice:

     the gate is every tenth level          n % 10 === 0
     the beat is where you are in the block RHYTHM[(n - 1) % 10]
     the ease descends and never lands

   All figures here are the clear rate of the greedy solver in
   test/ai.js, which plays about as well as an attentive human who is not
   trying very hard. It is a proxy, and it is the one every difficulty
   number in this project has been measured with.

   They describe a player walking a *bare* pet, because that is the floor
   and the basis everything else was measured on. A cared-for one brings
   four more moves and twelve percent more score to the same board.
   ============================================================ */

/* Ten levels to a block. The gate is the last of them; the level after a
   gate is the softest thing in the game. */
const BLOCK = 10;
const RHYTHM = [
  +.13,   /* 1  — relief. You have just come through a gate. */
  +.06,   /* 2  — still gentle, but it asks for something */
  +.02,   /* 3 */
  -.03,   /* 4  — the first one that can go wrong */
  +.05,   /* 5  — a breather in the middle of the block */
  -.04,   /* 6 */
  -.07,   /* 7 */
  -.02,   /* 8  — a small step back before the run-up */
  -.09,   /* 9  — the run-up */
  -.15    /* 10 — the gate */

   levels 1-60, so level 60 is a gate and level 61 is the relief after
   it: the handoff falls on a beat rather than across one. */
const RUN_START = 61;

   levels in it is most of the way down; it never reaches the floor, so
   there is always somewhere left to go. */

   handoff. A bend of 1 would be a straight line and would spend the
   whole of the first twenty levels being nearly as hard as level fifty;
   1.4 puts the give where a new player needs it and flattens out by the
   time they don't. */

   both ends than the run: nobody should fail level one, and nobody
   should meet a 45% wall before they have met every mechanic. */

const LANE_FLOOR = .58, LANE_CEIL = .97;

/* A level that teaches a mechanic for the first time is not a test of
   it. The lift is big enough to be felt and small enough that the level
   still has to be played. */

   softened before that. A -.15 gate at level ten lands on somebody who
   has swapped maybe two hundred tiles; the same gate at level sixty
   lands on somebody who knows what a rocket is. */

  return n >= RUN_START ? 1 : .35 + .65 * ((n - 1) / (RUN_START - 1));

   construction: the lane term vanishes exactly at RUN_START. */

  if (n >= RUN_START) return EASE_TO + (EASE_FROM - EASE_TO) * Math.exp(-(n - RUN_START) / EASE_OVER);

   Measured twice over the run at different sample sizes — +7% across
   levels 61-110 at fourteen games, +11% across 61-100 at ten — so it is
   a systematic offset rather than a coin. It is the residual of the
   model: the response curves know what a move budget does on an average
   map of a kind, and the map in front of the player is not the average
   one. Corrected in one place by aiming low, which is honest about
   there being an error rather than hiding it in the constants.

   are measured one at a time and solved for directly, so there is
   nothing between the intent and the number. */

   fitted to what each of its sixty levels can actually carry rather

/* The lowest and highest clear rate the budget alone can produce for a

   moves — a mud level at half its budget still clears three times in
   five, because a mud goal is a share of what the map holds. */

/* the budget multiplier that lands closest to a wanted clear rate */

  const row = CLEAR_AT[kind];
  if (!row) return 1;
  /* the curve rises with the budget, so walk it until it passes the mark */
  for (let i = 0; i < row.length; i++) {
    if (row[i] >= wantClear) {
      if (i === 0) return MOVE_SCALES[0];
      const lo = row[i - 1], hi = row[i];
      const t = hi === lo ? 0 : (wantClear - lo) / (hi - lo);
      return MOVE_SCALES[i - 1] + (MOVE_SCALES[i] - MOVE_SCALES[i - 1]) * t;

const SAVE_KEY = 'biscuit-lane-v1';

    toys: {},

function loadSave() {

    SAVE.room = Object.assign({ theme: 'oat', placed: [] }, d.room || {});
    SAVE.stats = Object.assign(freshSave().stats, d.stats || {});
    SAVE.badges = Object.assign({}, d.badges || {});

    SAVE.pets = (Array.isArray(d.pets) ? d.pets : []).map(healPet).filter(Boolean);

    if (SAVE.heartAt > now()) SAVE.heartAt = now();

/* ---------- hearts ---------- */
function heartTick() {
  /* the clock can move while the game is open, too */

  const elapsed = now() - SAVE.heartAt;
  if (elapsed >= HEART_REFILL) {
    const before = SAVE.hearts;
    const gained = Math.floor(elapsed / HEART_REFILL);
    SAVE.hearts = Math.min(HEART_MAX, SAVE.hearts + gained);
    SAVE.heartAt = SAVE.hearts >= HEART_MAX ? now() : SAVE.heartAt + gained * HEART_REFILL;

}

}

     of this that is worth a monthly price and the only one that cannot
     quietly get worse later. */
  if (clubActive()) return true;
  heartTick();
  if (SAVE.hearts <= 0) return false;
  heartClockStart();

let petIdSeq = 1;

}
function petBreed(p) { return BREEDS[p.breed]; }

   without losing anything. Adoption was a change of portrait.

   So a level's tile types are slots now, not breeds, and the cast says
   who stands in each. Your own come first, in the order you took them
   in; the rest of the lane fills the slots behind them. A player with
   one pet plays a board with one friend and five strangers on it, and
   the board fills with their own as they go — and the face on the tile

function breedDesc(i) { const b = BREEDS[i]; return LANG === 'tr' ? b.trDesc : b.enDesc; }

/* ---------- traits ----------

function bumpCare(p, kind) {

const STEP = 1;                    // hours per simulated slice

/* Stepped rather than multiplied out, for two reasons. A pet that runs
   out of energy mid-absence has to be able to fall asleep and start
   recovering — one flat multiply can never model a state change. And the
   neglect penalty below has to be charged for the hours the pet was
   actually hungry: applied to the whole gap at the end-state, as it was,
   a pet that dipped under 15 in the last minute of a day away was billed
   for the entire day. */
function simulatePet(p, ms) {
  if (!p) return;
  let h = Math.min(ms, MAX_OFFLINE) / HOUR * traitDecayScale(p);
  if (h <= 0) return;
  while (h > 0) {
    const dt = Math.min(h, STEP);
    h -= dt;
    const d = p.asleep ? DECAY.asleep : DECAY.awake;
    p.food = clamp(p.food - d.food * dt, 0, 100);
    p.clean = clamp(p.clean - d.clean * dt, 0, 100);
    p.joy = clamp(p.joy - d.joy * dt, 0, 100);
    p.energy = clamp(p.energy + d.energy * dt, 0, 100);
    /* neglect nudges joy down a little faster, for these hours only */
    if (p.food < 15) p.joy = clamp(p.joy - 2 * dt, 0, 100);
    if (p.clean < 15) p.joy = clamp(p.joy - 1.5 * dt, 0, 100);
    /* Animals sleep when they are tired, and a pet that has slept its
       fill stays curled up until somebody comes and wakes it. Both
       halves matter. Without the first, a pet left alone stands awake
       for thirty hours burning energy it has no way to recover, and
       arrives flat however well it is looked after. Without the second,
       it wakes the moment it tops up and starts spending again, so how
       rested you find it comes down to what hour you happened to open
       the app — the one stat the player could not influence at all. */
    if (!p.asleep && p.energy <= SLEEPY) p.asleep = true;
  }
}
function catchUpPets() {
  const gap = now() - (SAVE.lastSeen || now());
  if (gap < MIN) return;
  SAVE.pets.forEach(p => {
    simulatePet(p, gap);
    /* You are what wakes it. A pet that has slept its fill gets up when
       somebody comes home, which is both how animals behave and the only
       way the room stays a room: leave it to wake itself and a
       once-a-day player finds a sleeping animal every single time. One
       still short of rested stays down, which is worth seeing. */
    if (p.asleep && p.energy >= 100) p.asleep = false;
  });
  SAVE.lastSeen = now();
  persist();
}

/* ---------- mood ---------- */
function moodOf(p) {
  if (!p) return 'content';
  if (p.asleep) return 'sleeping';
  if (p.food < 26) return 'hungry';
  if (p.clean < 26) return 'dirty';
  if (p.energy < 22) return 'tired';
  if (p.joy < 26) return 'bored';
  const avg = (p.food + p.joy + p.clean + p.energy) / 4;
  if (avg > 78) return 'happy';
  if (p.joy < 45) return 'lonely';
  return 'content';
}
function moodLine(p) { return T('mood_' + moodOf(p)); }

/* ---------- perks: care feeds directly into the board ---------- */
function perksFor(p) {
  const out = [];
  if (!p) return out;
  if (p.food >= 70) out.push({ id: 'moves', en: '+2 moves', tr: '+2 hamle', v: 2 });
  if (p.joy >= 70) out.push({ id: 'charge', en: 'Starts 35% charged', tr: '%35 dolu başlar', v: 35 });
  if (p.clean >= 70) out.push({ id: 'score', en: '+12% score', tr: '+%12 puan', v: .12 });
  if (p.energy >= 70) out.push({ id: 'gift', en: 'A rocket on the board', tr: 'Tahtada bir roket', v: 1 });
  const tidy = traitMoveBonus(p);
  if (tidy) out.push({ id: 'trait', en: '+' + tidy + ' move (' + traitName(p.trait) + ')', tr: '+' + tidy + ' hamle (' + traitName(p.trait) + ')', v: tidy });
  /* the other three do just as much and used to say nothing. These are
     read out, not applied: each one is already applied where it belongs. */
  const nm = traitOf(p) ? traitName(p.trait) : '';
  if (traitOf(p) === 'greedy') {
    out.push({ id: 'traitnote', v: 0,
      en: '+' + Math.round((traitCoinScale(p) - 1) * 100) + '% coins (' + nm + ')',
      tr: '+%' + Math.round((traitCoinScale(p) - 1) * 100) + ' altın (' + nm + ')' });
  }
  if (traitOf(p) === 'playful') {
    out.push({ id: 'traitnote', v: 0,
      en: 'Charges ' + Math.round((traitChargeScale(p) - 1) * 100) + '% faster (' + nm + ')',
      tr: '%' + Math.round((traitChargeScale(p) - 1) * 100) + ' daha hızlı dolar (' + nm + ')' });
  }
  if (traitOf(p) === 'dozy') {
    out.push({ id: 'traitnote', v: 0,
      en: 'Slower to go hungry (' + nm + ')',
      tr: 'Daha geç acıkır (' + nm + ')' });
  }
  /* Tied to the stages, and capped there. Bond itself has no ceiling,
     and an uncapped move bonus quietly retunes every level in the game
     — measured, it took the clear rate from 76% to 88%. */
  const bonusMoves = STAGE_MOVES[clamp(petStageIdx(p), 0, STAGE_MOVES.length - 1)];
  if (bonusMoves > 0) {
    const label = stageName(p).toLowerCase();
    out.push({
      id: 'bondmoves',
      en: '+' + bonusMoves + (bonusMoves === 1 ? ' move' : ' moves') + ' (' + label + ')',
      tr: '+' + bonusMoves + ' hamle (' + label + ')',
      v: bonusMoves
    });
  }
  return out;
}
function perkLabel(perk) { return LANG === 'tr' ? perk.tr : perk.en; }
/* The card used to print every perk end to end, which read as a run-on
   sentence and said "+2 moves" twice — once for a full belly and once
   for the pet's stage — as though they were separate things. Move
   bonuses are one number to the player, so they are added up. */
function perkChips(perks) {
  const moveIds = { moves: 1, bondmoves: 1, trait: 1 };
  let moves = 0;
  const out = [];
  perks.forEach(p => {
    if (moveIds[p.id]) { moves += p.v; return; }
    if (p.id === 'traitnote') return;
    out.push(perkLabel(p));
  });
  if (moves) out.unshift(LANG === 'tr' ? '+' + moves + ' hamle' : '+' + moves + ' move' + (moves > 1 ? 's' : ''));
  return out;
}

/* ---------- the jar, the club ----------
   State, so it lives with the rest of the state. The store that charges
   for any of it is 17-billing, and it knows about these; they do not
   know about it. */
function jarState() {
  if (!SAVE.jar) SAVE.jar = { fill: 0, opened: 0 };
  return SAVE.jar;
}
/* called from the win card, once per cleared level */
function jarAdd(n) {
  const j = jarState();
  if (j.fill >= JAR.cap) return false;
  const before = j.fill;
  j.fill = Math.min(JAR.cap, j.fill + (n || JAR.perLevel));
  return j.fill > before;
}
function jarFull() { return jarState().fill >= JAR.cap; }

/* ---------- granting ----------

   Kept apart from BILLING.buy so there is one function that adds treats
   to a save and it is called from one place, after a receipt. */
function grantPurchase(kind, id) {
  if (kind === 'pack') {
    const p = TREAT_PACKS.find(x => x.id === id);
    if (!p) return 0;
    SAVE.treats += p.treats;
    persist(true);
    return p.treats;
  }
  if (kind === 'jar') {
    const j = jarState();
    const got = j.fill;
    SAVE.treats += got;
    j.fill = 0;
    j.opened = (j.opened || 0) + 1;
    persist(true);
    return got;
  }
  if (kind === 'club') {
    SAVE.club = { since: now(), until: now() + 30 * DAY, lastPaid: 0 };
    persist(true);
    return 1;
  }
  return 0;
}

/* Whether the club is live right now. The date is the store's business
   once this is real; until then this is what the rest of the game asks. */
function clubActive() {
  return !!(SAVE.club && SAVE.club.until > now());
}
/* the club's daily treats, handed over on the first look of each day */
function clubTick() {
  if (!clubActive()) return 0;
  const today = dayStamp(now());
  if (SAVE.club.lastPaid === today) return 0;
  SAVE.club.lastPaid = today;
  SAVE.treats += PET_CLUB.dailyTreats;
  persist(true);
  return PET_CLUB.dailyTreats;
}

/* ---------- the daily walk ---------- */
function dailyState() {
  const today = dayNumber();
  if (SAVE.daily.day !== today) {
    /* a new day: yesterday's result is kept only as a streak */
    const wasYesterday = SAVE.daily.day === today - 1 && SAVE.daily.done;
    SAVE.daily = { day: today, done: false, best: 0, streak: wasYesterday ? SAVE.daily.streak : 0 };
    persist();
  }
  return SAVE.daily;
}
function dailyDone(score) {
  const d = dailyState();
  d.best = Math.max(d.best || 0, score);
  if (!d.done) {
    d.done = true;
    d.streak = (d.streak || 0) + 1;
    /* The walk paid 120 coins and 2 treats a day, forever, for four
       minutes of play. Over a month that alone is 3,600 coins and 60
       treats — most of a treat balance that nothing was asking for.
       It is still the best-paid four minutes in the game; it is no
       longer a salary. */
    SAVE.coins += ECON.dailyWalkCoins;
    SAVE.treats += ECON.dailyWalkTreats;
    persist(true);
    return { coins: ECON.dailyWalkCoins, treats: ECON.dailyWalkTreats, first: true };
  }
  persist(true);
  return { first: false };
}

/* ---------- daily gift ---------- */
function dayStamp(t) { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function giftReady() { return dayStamp(now()) !== dayStamp(SAVE.lastGift || 0); }
/* The ladder, in one place. It used to live inside claimGift, which
   meant the sheet could only report what today held — and the day-7
   basket, five treats and a booster, was a week's worth of reason that
   nothing anywhere mentioned. The interface reads this table now, so
   what is promised and what is paid cannot drift apart. */
function giftFor(day) {
  const r = { coins: 40 + day * 18, treats: ECON.giftTreats[day] || 0, food: null, booster: null };
  if (day === 2 || day === 5) r.food = 'tuna';
  if (day === 4) r.food = 'stew';
  if (day === 3) r.booster = 'hammer';
  if (day === 6) r.booster = 'shuffle';
  if (day === 7) r.booster = 'moves';
  return r;
}
/* which rung the basket on the step is standing on, without taking it */
function giftDay() {
  const yesterday = dayStamp(now() - DAY);
  const last = dayStamp(SAVE.lastGift || 0);
  return (((last === yesterday ? SAVE.streak + 1 : 1) - 1) % 7) + 1;
}
/* and which one tomorrow's would be, which is the number a player who
   has already opened today's needs in order to come back */
function giftDayNext() { return (SAVE.streak % 7) + 1; }
function claimGift() {
  const day = giftDay();
  const yesterday = dayStamp(now() - DAY);
  const last = dayStamp(SAVE.lastGift || 0);
  SAVE.streak = (last === yesterday) ? SAVE.streak + 1 : 1;
  SAVE.lastGift = now();
  const reward = giftFor(day);
  SAVE.coins += reward.coins;
  SAVE.treats += reward.treats;
  if (reward.food) SAVE.food[reward.food] = (SAVE.food[reward.food] || 0) + 1;
  if (reward.booster) SAVE.boosters[reward.booster] = (SAVE.boosters[reward.booster] || 0) + 1;
  persist(true);
  return { reward, day };
}

/* ===== 17-billing.js ===== */
/* ============================================================
   17 — the till
   ============================================================

   Everything above this file is a closed economy: coins and treats come
   from playing and go into the shop, and the two columns balance because
   test/economy.js makes them. This is the one seam where value enters
   from outside, and it is deliberately the only one.

   No advertising. Nothing here interrupts a level, nothing plays a
   video, nothing is sold to a player who is not already asking for it.
   Every surface in this file is opened by the player: the treat chip in
   the header, or the two moments — out of moves near the end, out of
   hearts — where the game has something the player wanted and could not
   have. That is the whole of it.

   Nothing here can take money yet, and it says so rather than pretending
   otherwise. A store needs a merchant account, products declared in the
   Play Console, and a receipt somebody trusts; none of those exist. What
   exists is the shape of it, so that wiring a billing plugin is a change
   to one function rather than to the game.
*/

/* ---------- the seam ----------

   One object, four questions, and exactly one place that would have to
   change to make this real. `ready` is what the interface asks before it
   offers anything: false means the buttons are shown but explain
   themselves instead of lying.

   A Capacitor billing plugin — @capacitor-community/in-app-purchases, or
   RevenueCat's, they present the same three calls — would be picked up
   here by name. Until one is installed this stays honest. */
const BILLING = {
  plugin: null,
  prices: {},              // sku -> localized price string, once a store answers

  /* Whether money can actually change hands in this build. Checked at
     call time rather than cached at load: the plugin arrives with the
     native bridge, which is not up yet when this file is read. */
  ready() {
    if (this.plugin) return true;
    const P = (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.Plugins) || null;
    if (!P) return false;
    this.plugin = P.InAppPurchases || P.Purchases || P.CdvPurchase || null;
    return !!this.plugin;
  },

  /* the price to put on a button: whatever the store said, or the
     fallback label, which is marked as approximate wherever it shows */
  price(sku, fallback) {
    return this.prices[sku] || fallback;
  },

  /* Ask the store what these cost where the player is. Safe to call when
     no store exists — it resolves having done nothing. */
  async refresh() {
    if (!this.ready()) return false;
    try {
      const skus = TREAT_PACKS.map(p => p.sku).concat([PET_CLUB.sku, JAR.sku]);
      const r = await this.plugin.getProducts({ productIdentifiers: skus, productIds: skus });
      const list = (r && (r.products || r.productList)) || [];
      list.forEach(p => {
        const id = p.productId || p.identifier || p.id;
        const shown = p.priceString || p.localizedPrice || p.price;
        if (id && shown) this.prices[id] = String(shown);
      });
      return true;
    } catch (e) { return false; }
  },

  /* The purchase itself.

     Resolves { ok: true } only when a store has said so. Everything else
     — no plugin, a cancelled sheet, a network that went away — comes
     back { ok: false, why } and the caller grants nothing. There is no
     branch in here that credits an account without a receipt, in any
     build, including this one: a stub that pays out is a stub somebody
     ships by accident. */
  async buy(sku) {
    if (!this.ready()) return { ok: false, why: 'nostore' };
    try {
      const r = await this.plugin.purchase({ productIdentifier: sku, productId: sku });
      if (!r || r.cancelled || r.responseCode === 1) return { ok: false, why: 'cancelled' };
      /* A receipt is checked by whoever issued it. Locally that means
         the plugin's own verification and nothing more, which is enough
         for a single-player game with no leaderboard — the only person
         a forged receipt cheats is the person holding the phone. It is
         not enough the day this game keeps anything on a server, and
         that is the day this call grows a second half. */
      return { ok: true, receipt: r };
    } catch (e) {
      return { ok: false, why: 'failed' };
    }
  },

  async restore() {
    if (!this.ready()) return { ok: false, why: 'nostore' };
    try { await this.plugin.restorePurchases(); return { ok: true }; }
    catch (e) { return { ok: false, why: 'failed' }; }
  }
};

/* ===== 20-audio.js ===== */
/* ============================================================
   20 — audio. Everything synthesised; no files, no downloads.

   Signal path
     voice ─┬─► sfxBus ─► sfxComp ─► master ─► out
            └─► verbSend ─► convolver ─► verbGain ─┘
     music ──► musBus  ─► master

   The compressor is what makes a ten-tile cascade sound like one
   happy noise instead of ten fighting ones, and the little room
   reverb is what stops the synth sounding like a test tone.
   ============================================================ */
const AU = {
  ctx: null, master: null, sfxBus: null, musBus: null, verb: null, verbGain: null,
  comp: null, ready: false, noise: null,
  musicOn: false, musicTimer: null, step: 0,
  voices: 0, lastPop: 0, intensity: 0
};

const AU_MAX_VOICES = 26;          // hard ceiling; cascades stop stacking mush
/* How loud the bed sits under everything. Measured against the
   effects: at .3 the music was peaking level with the win fanfare. */
const MUS_BED = .13;

/* Every failure here is survivable: a browser with no Web Audio, a
   device that refuses another context, a policy that blocks it. The game
   plays silently rather than not at all, and never retries in a loop. */
let audioBroken = false;
function audioInit() {
  if (AU.ctx || audioBroken) return;
  try { buildAudioGraph(); }
  catch (e) {
    /* a half-built graph is worse than none: drop it and stay silent */
    audioBroken = true;
    AU.ready = false;
    AU.ctx = null;
  }
}
function buildAudioGraph() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { audioBroken = true; return; }
  AU.ctx = new AC();
  const c = AU.ctx;

  AU.master = c.createGain();
  AU.master.gain.value = .9;
  AU.master.connect(c.destination);

  /* glue compressor: soft, slow-ish, just enough to hold it together */
  AU.comp = c.createDynamicsCompressor();
  AU.comp.threshold.value = -18;
  AU.comp.knee.value = 26;
  AU.comp.ratio.value = 3.2;
  AU.comp.attack.value = .004;
  AU.comp.release.value = .18;
  AU.comp.connect(AU.master);

  /* A ceiling, so a whole-board cascade cannot stack twenty voices
     into the top of the signal.

     Not a second DynamicsCompressor. Measured, chaining two of those in
     Chrome costs about twenty decibels on quiet material even with the
     ratio set to 1:1 — the node is not transparent when it is not
     working, and a tap went from .018 to .007 with one added to the
     path. A wave shaper is what a limiter actually is: a curve. It is
     exactly linear below the knee, so nothing quiet is touched at all,
     and it cannot overshoot however much is thrown at it. */
  AU.limit = c.createWaveShaper();
  AU.limit.oversample = '4x';
  {
    const N = 2048, curve = new Float32Array(N), knee = .72;
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * 2 - 1;
      const a = Math.abs(x);
      curve[i] = a <= knee ? x
        : Math.sign(x) * (knee + (1 - knee) * Math.tanh((a - knee) / (1 - knee)));
    }
    AU.limit.curve = curve;
  }
  AU.comp.disconnect();
  AU.comp.connect(AU.limit);
  AU.limit.connect(AU.master);

  AU.sfxBus = c.createGain(); AU.sfxBus.gain.value = .85; AU.sfxBus.connect(AU.comp);
  AU.musBus = c.createGain(); AU.musBus.gain.value = 0; AU.musBus.connect(AU.master);

  /* a small warm room, generated */
  AU.verb = c.createConvolver();
  AU.verb.buffer = makeRoomIR(c, 1.5, 2.6, 5200);
  /* Pre-delay. With the reverb starting on the same sample as the
     source, the room is smeared over the attack and every sound reads
     as slightly out of focus. Eighteen milliseconds of air between the
     hit and its reflections is most of the difference between a sound
     that was made and a sound that was recorded somewhere. */
  AU.verbIn = c.createDelay(.2);
  AU.verbIn.delayTime.value = .018;
  /* and the room is darker than the source, always */
  AU.verbTone = c.createBiquadFilter();
  AU.verbTone.type = 'lowpass';
  AU.verbTone.frequency.value = 3600;
  AU.verbTone.Q.value = .7;
  AU.verbGain = c.createGain(); AU.verbGain.gain.value = .42;
  AU.verbIn.connect(AU.verb);
  AU.verb.connect(AU.verbTone); AU.verbTone.connect(AU.verbGain);
  AU.verbGain.connect(AU.comp);

  /* one shared noise buffer */
  const len = Math.floor(c.sampleRate * 1.2);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = buf;

  AU.ready = true;
}


/* Exponentially decaying noise, gently darkened by a one-pole
   lowpass, with a couple of early reflections so it reads as a
   room and not as a hiss. */
function makeRoomIR(c, seconds, decay, cutoffHz) {
  const rate = c.sampleRate;
  const n = Math.floor(rate * seconds);
  const buf = c.createBuffer(2, n, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const env = Math.pow(1 - t, decay);
      /* A real room loses its top as it decays — air and soft
         furnishings eat the highs first. A tail filtered at one fixed
         cutoff for its whole length is the sound of a plugin preset. */
      const kk = Math.exp(-2 * Math.PI * (cutoffHz * (1 - t * .72) + 300) / rate);
      lp = (1 - kk) * (Math.random() * 2 - 1) + kk * lp;
      d[i] = lp * env * .7;
    }
    /* early reflections give the room a size */
    [[.011, .5], [.019, .38], [.031, .3], [.047, .22]].forEach(([dt, g], idx) => {
      const at = Math.floor(rate * (dt + ch * .0013 + idx * .0007));
      if (at < n) d[at] += g * (ch ? -1 : 1);
    });
  }
  return buf;
}

function audioResume() {
  audioInit();
  if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
}
function sfxOn() { return SAVE && SAVE.settings.sound && AU.ready; }

/* voice book-keeping so a 40-tile clear cannot melt the mixer */
function claimVoice(dur) {
  if (AU.voices >= AU_MAX_VOICES) return false;
  AU.voices++;
  setTimeout(() => { AU.voices--; }, (dur + .1) * 1000);
  return true;
}

/* build the tail of a voice: optional pan, optional reverb send */
function outputChain(node, o) {
  const c = AU.ctx;
  let last = node;
  if (o.pan !== undefined && c.createStereoPanner) {
    const p = c.createStereoPanner();
    p.pan.value = clamp(o.pan, -1, 1);
    last.connect(p); last = p;
  }
  last.connect(AU.sfxBus);
  if (o.send) {
    const s = c.createGain();
    s.gain.value = o.send;
    last.connect(s); s.connect(AU.verbIn || AU.verb);
  }
}

/* ---------------- primitives ----------------

   Every one-shot is nudged off centre before it plays. Two taps of the
   same button used to be the same sample twice, and a run of them —
   which is what a board of matches is — read as a machine gun rather
   than as a thing being struck repeatedly. A few cents and a few
   percent is all it takes; the ear stops hearing a loop and starts
   hearing an object. Musical sounds get less of it than noises do,
   because a wrong note is worse than a samey one. */
function vary(o, cents, amp) {
  const c2 = o.vary === undefined ? cents : o.vary;
  const a2 = o.varyGain === undefined ? (amp === undefined ? .08 : amp) : o.varyGain;
  return {
    detune: (Math.random() * 2 - 1) * c2,
    gain: 1 + (Math.random() * 2 - 1) * a2
  };
}
function tone(o) {
  if (!sfxOn()) return;
  const dur = o.dur || .2;
  if (!claimVoice(dur)) return;
  const c = AU.ctx, t = c.currentTime + (o.delay || 0);
  const osc = c.createOscillator();
  const g = c.createGain();
  const v = vary(o, 11);
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + dur);
  osc.detune.value = (o.detune || 0) + v.detune;
  const peak = (o.gain === undefined ? .18 : o.gain) * v.gain;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t + (o.atk || .008));
  if (o.hold) g.gain.setValueAtTime(Math.max(.0002, peak), t + (o.atk || .008) + o.hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = osc;
  if (o.filter) {
    const f = c.createBiquadFilter();
    f.type = o.filter; f.frequency.value = o.fc || 1200; f.Q.value = o.q || 1;
    if (o.fc2) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.fc2), t + dur);
    node.connect(f); node = f;
  }
  node.connect(g);
  outputChain(g, o);
  osc.start(t); osc.stop(t + dur + .05);
  return osc;
}

function noiseBurst(o) {
  if (!sfxOn()) return;
  const dur = o.dur || .25;
  if (!claimVoice(dur)) return;
  const c = AU.ctx, t = c.currentTime + (o.delay || 0);
  const v = vary(o, 0, .10);
  const src = c.createBufferSource();
  src.buffer = AU.noise;
  /* and start somewhere else in the buffer, so the same hiss is never
     replayed twice from the same sample */
  src.playbackRate.value = (o.rate || 1) * (1 + (Math.random() * 2 - 1) * .05);
  const f = c.createBiquadFilter();
  f.type = o.filter || 'bandpass';
  f.frequency.setValueAtTime(o.fc || 900, t);
  if (o.fc2) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.fc2), t + dur);
  if (o.fc3) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.fc3), t + dur * 1.6);
  f.Q.value = o.q || 1.4;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, (o.gain === undefined ? .2 : o.gain) * v.gain), t + (o.atk || .006));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g);
  outputChain(g, o);
  const from = (o.offset || 0) + Math.random() * .4;
  src.start(t, from); src.stop(t + dur + .05);
}

/* a struck bar: fundamental plus the inharmonic partials a real
   wooden key has. This is what makes a match sound like an object. */
function mallet(f, o) {
  o = o || {};
  if (!sfxOn()) return;
  const dur = o.dur || .34;
  if (!claimVoice(dur)) return;
  const c = AU.ctx, t = c.currentTime + (o.delay || 0);
  const mv = vary(o, 5, .07);
  const gain = (o.gain === undefined ? .16 : o.gain) * mv.gain;
  const partials = o.partials || [[1, 1, 1], [3.94, .30, .55], [10.6, .10, .28]];
  const bus = c.createGain();
  bus.gain.value = 1;
  partials.forEach(([mult, amp, decay]) => {
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = mult === 1 ? (o.type || 'sine') : 'sine';
    osc.detune.value = mv.detune;
    osc.frequency.setValueAtTime(f * mult, t);
    /* real bars drop a touch in pitch as they ring out */
    osc.frequency.exponentialRampToValueAtTime(f * mult * .995, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain * amp), t + .004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * decay);
    osc.connect(g); g.connect(bus);
    osc.start(t); osc.stop(t + dur + .05);
  });
  /* mallet click */
  const cl = c.createBufferSource();
  cl.buffer = AU.noise;
  const cf = c.createBiquadFilter();
  cf.type = 'bandpass'; cf.frequency.value = f * 4.2; cf.Q.value = 1.2;
  const cg = c.createGain();
  cg.gain.setValueAtTime(gain * .5, t);
  cg.gain.exponentialRampToValueAtTime(0.0001, t + .028);
  cl.connect(cf); cf.connect(cg); cg.connect(bus);
  cl.start(t); cl.stop(t + .06);

  outputChain(bus, { pan: o.pan, send: o.send === undefined ? .16 : o.send });
}

/* The part of an impact you feel rather than hear. Almost everything in
   this game lived above two hundred hertz, which is why it all sounded
   like it was coming out of a phone speaker even when it wasn't: there
   was nothing underneath any of it. A short sine an octave or two below
   the body, gone in a tenth of a second, is the whole trick. */
function thump(f, gain, dur, pan) {
  tone({
    f: f, f2: f * .55, dur: dur || .09, type: 'sine',
    gain: gain === undefined ? .1 : gain, atk: .002, pan: pan, vary: 4, send: 0
  });
}

/* The tick of contact, before any of the tone arrives. Buttons in
   expensive software click before they ring; the click is two
   milliseconds of filtered noise and it is most of what tells you the
   press registered. */
function click(fc, gain, pan) {
  noiseBurst({ fc: fc || 5200, dur: .014, gain: gain === undefined ? .07 : gain,
    q: .8, filter: 'highpass', pan: pan, send: 0 });
}

const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const semi = n => 261.63 * Math.pow(2, n / 12);

/* duck the music for a beat when something big happens */
function musicDuck(amount, time) {
  if (!AU.ready || !AU.musicOn) return;
  const g = AU.musBus.gain, t = AU.ctx.currentTime;
  const target = Math.max(.015, MUS_BED * (1 - amount));
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(target, t + .04);
  g.linearRampToValueAtTime(MUS_BED, t + (time || .5));
}

/* ============================================================
   The sound effects.
   ============================================================ */
const SFX = {

  /* ---- interface ---- */
  /* The interface used to be made of different material from the board.

     Rendered offline and measured, tap was 0.0005 rms against a tile
     pop's 0.003 and a win's 0.029 — six times under the quietest thing
     the game does on purpose — 47ms long against the pop's 387, and
     half again as bright. A click and a blip, which is what a phone
     keypad is made of. And it is not a minor voice: tap is called
     twenty-one times in 60-ui.js and select twice, so almost every
     sound a player hears while moving around the game was that one.

     They are mallets now, the same voice the board clears tiles with,
     and they sit on the same pentatonic PENT that pop and combo use
     rather than on the arbitrary 620 and 520 they had. Moving through
     the game is consonant with playing it, and choosing something
     rises: tap sits on E, select a fifth above it on G. The tick sits
     higher than either, small and quick, because it marks a thumb
     passing rather than answers a decision. */
  tap() {
    mallet(semi(PENT[7]), { gain: .085, dur: .17, send: .10,
      partials: [[1, 1, 1], [3.94, .16, .40]] });
    click(5200, .028);
  },
  select() {
    mallet(semi(PENT[8]), { gain: .105, dur: .24, send: .15 });
    noiseBurst({ fc: 3400, dur: .04, gain: .03, q: 2 });
    thump(150, .04, .07);
  },
  bad() {
    tone({ f: 200, f2: 140, dur: .16, type: 'sawtooth', gain: .09, filter: 'lowpass', fc: 700 });
    tone({ f: 196, f2: 138, dur: .17, type: 'sawtooth', gain: .05, detune: 22, filter: 'lowpass', fc: 620 });
  },
  swap() {
    tone({ f: 380, f2: 560, dur: .12, type: 'sine', gain: .095, send: .12 });
    noiseBurst({ fc: 1200, fc2: 2600, dur: .1, gain: .038, q: .8 });
    thump(120, .05, .08);
  },
  /* The lightest of the three, for a control a thumb runs along rather
     than presses once — the shop's five category tabs, which used to
     fire the full tap each time. It was also dead: nothing called it,
     and at a 0.009 peak it was under the 0.012 the suite calls
     inaudible, so it could not have been heard if anything had. It is
     in the suite's list now. */
  uiTick() {
    mallet(semi(PENT[9]), { gain: .075, dur: .11, send: .05, partials: [[1, 1, 1]] });
  },

  /* ---- the board ----
     `chain` is the cascade depth, `i` the index inside one clear,
     `pan` where it happened across the board (-1..1).            */
  pop(chain, i, pan) {
    const step = Math.min(PENT.length - 1, (chain - 1) * 2 + (i || 0));
    const f = semi(PENT[step] + 12);
    mallet(f, {
      gain: .17 - Math.min(.06, (i || 0) * .012),
      dur: .3, delay: (i || 0) * .028,
      pan: pan === undefined ? 0 : pan * .55,
      send: .18 + Math.min(.2, chain * .04)
    });
    if (chain > 1) {
      /* a fifth above, quietly, so deep cascades brighten */
      mallet(f * 1.5, { gain: .05, dur: .22, delay: (i || 0) * .028 + .01, pan: pan ? pan * .5 : 0, send: .25 });
    }
    /* one piece of low end for the clear, not one per tile: nine tiles
       going at once should land like a handful of something dropped,
       not like nine kick drums */
    if (!i) thump(82 + Math.min(4, chain) * 6, .105, .12, pan === undefined ? 0 : pan * .3);
  },

  /* a rising sweep as the cascade gets deeper */
  combo(chain) {
    const n = Math.min(chain, 8);
    tone({
      f: semi(PENT[Math.min(n, PENT.length - 1)]), f2: semi(PENT[Math.min(n + 2, PENT.length - 1)] + 12),
      /* a bandpass up at 900Hz sat above the note and removed it; the
         chain reward needs to be heard over the pops it crowns */
      dur: .3, type: 'triangle', gain: .20 + n * .022, filter: 'lowpass', fc: 3400, send: .3
    });
    musicDuck(.25, .4);
  },

  /* ---- specials ---- */
  rocket(pan) {
    /* body: a filtered roar that pitches down as it leaves */
    noiseBurst({ fc: 2600, fc2: 400, dur: .38, gain: .27, filter: 'bandpass', q: .9, pan, send: .22 });
    tone({ f: 700, f2: 180, dur: .3, type: 'sawtooth', gain: .12, filter: 'lowpass', fc: 1400, pan });
    tone({ f: 350, f2: 90, dur: .34, type: 'triangle', gain: .07, pan });
    /* the launch click */
    noiseBurst({ fc: 5000, dur: .03, gain: .15, q: 1.5, pan });
  },
  bomb(pan) {
    tone({ f: 150, f2: 44, dur: .48, type: 'sine', gain: .25, pan, send: .3 });
    tone({ f: 92, f2: 34, dur: .55, type: 'triangle', gain: .15, pan });
    noiseBurst({ fc: 1400, fc2: 150, dur: .42, gain: .17, filter: 'lowpass', q: .7, pan, send: .35 });
    noiseBurst({ fc: 6000, fc2: 2000, dur: .09, gain: .12, q: .8, pan });
    musicDuck(.5, .7);
  },
  rainbow() {
    for (let i = 0; i < 7; i++) {
      mallet(semi(PENT[i] + 24), { gain: .1, dur: .5, delay: i * .045, send: .4, pan: -.6 + i * .2 });
    }
    noiseBurst({ fc: 3200, fc2: 2200, dur: .5, gain: .07, filter: 'bandpass', q: 2, send: .5 });
    musicDuck(.4, .8);
  },

  /* ---- blockers, by material ---- */
  crate(hard, pan) {
    /* transient, wooden body, then splinters falling */
    noiseBurst({ fc: 4200, dur: .022, gain: .21, q: .9, filter: 'highpass', pan });
    tone({ f: hard ? 150 : 190, f2: hard ? 96 : 120, dur: .16, type: 'square', gain: .13, filter: 'lowpass', fc: 900, pan });
    tone({ f: hard ? 226 : 288, f2: 180, dur: .13, type: 'triangle', gain: .07, pan });
    noiseBurst({ fc: 900, fc2: 260, dur: .24, gain: .24, filter: 'bandpass', q: 1.1, pan, send: .18 });
    thump(hard ? 62 : 74, .13, .13, pan);
    for (let i = 0; i < 3; i++) {
      noiseBurst({ fc: rnd(1400, 2600), dur: .05, gain: .05, q: 3, delay: .1 + i * .06, pan });
    }
  },
  ice(pan) {
    /* a bright crack, then glassy shards skittering */
    noiseBurst({ fc: 7000, fc2: 4200, dur: .05, gain: .18, q: 1, pan });
    tone({ f: 1900, f2: 2600, dur: .16, type: 'sine', gain: .13, pan, send: .35 });
    tone({ f: 2840, f2: 3600, dur: .12, type: 'sine', gain: .07, pan, send: .4 });
    for (let i = 0; i < 5; i++) {
      noiseBurst({ fc: rnd(4200, 8000), dur: .03, gain: .05, q: 6, delay: .05 + i * .045, pan, send: .3 });
    }
  },
  creak(pan) {
    /* something growing where it should not: a low woody groan */
    tone({ f: 88, f2: 132, dur: .34, type: 'sawtooth', gain: .07, filter: 'lowpass', fc: 420, pan, send: .2 });
    noiseBurst({ fc: 320, fc2: 680, dur: .3, gain: .05, filter: 'bandpass', q: 2.4, pan });
  },
  snip(pan) {
    /* secateurs: a short bright shear, then the cut stem falling away.
       Deliberately drier than the crate so the two never blur together. */
    noiseBurst({ fc: 5200, fc2: 3000, dur: .035, gain: .17, q: 2.2, pan });
    noiseBurst({ fc: 3400, fc2: 1800, dur: .05, gain: .11, q: 2.6, delay: .035, pan });
    tone({ f: 620, f2: 380, dur: .10, type: 'triangle', gain: .08, pan, send: .12 });
    noiseBurst({ fc: 800, fc2: 300, dur: .18, gain: .07, filter: 'bandpass', q: 1.2, delay: .07, pan, send: .2 });
  },
  mud(pan) {
    /* squelch: a resonant filter opening then closing on wet noise */
    noiseBurst({ fc: 200, fc2: 900, fc3: 260, dur: .22, gain: .20, filter: 'lowpass', q: 7, pan });
    tone({ f: 130, f2: 62, dur: .18, type: 'sine', gain: .13, pan });
    noiseBurst({ fc: 500, fc2: 180, dur: .3, gain: .09, filter: 'bandpass', q: .8, delay: .06, pan, send: .12 });
  },

  /* ---- falling ---- */
  drop(pan) { tone({ f: 300, f2: 200, dur: .12, type: 'sine', gain: .09, pan }); },
  land(force, pan) {
    const f = clamp(force, 0, 1);
    if (f < .1) return;
    /* rate-limit: gravity lands a lot of tiles at once */
    const t = now();
    if (t - AU.lastPop < 26) return;
    AU.lastPop = t;
    tone({ f: 108 - f * 26, f2: 62, dur: .06 + f * .05, type: 'sine', gain: .04 + f * .07, pan });
    noiseBurst({ fc: 700, fc2: 250, dur: .05 + f * .04, gain: .03 + f * .05, filter: 'lowpass', q: .7, pan });
  },
  whoosh(pan) {
    /* a narrow band on noise passes a fraction of what the gain says:
       measured, this needs about four times what a tone would */
    noiseBurst({ fc: 400, fc2: 2400, fc3: 300, dur: .3, gain: .9, filter: 'bandpass', q: 1.4, pan, send: .2 });
  },

  /* ---- rewards ---- */
  coin() {
    tone({ f: 1180, dur: .09, type: 'square', gain: .1, send: .2 });
    tone({ f: 1580, dur: .13, type: 'square', gain: .09, delay: .07, send: .25 });
  },
  star(i) {
    const f = semi(PENT[4 + (i || 0) * 2] + 24);
    mallet(f, { gain: .18, dur: .7, send: .45, partials: [[1, 1, 1], [2.76, .3, .6], [5.4, .12, .35]] });
    tone({ f: f * 1.5, dur: .35, type: 'sine', gain: .06, send: .4 });
  },
  chargeReady() {
    [0, 4, 7].forEach((n, i) => mallet(semi(n + 24), { gain: .11, dur: .45, delay: i * .06, send: .35 }));
    noiseBurst({ fc: 2600, fc2: 5200, dur: .3, gain: .04, q: 2, send: .4 });
  },
  win() {
    [0, 4, 7, 12].forEach((n, i) => {
      mallet(semi(n + 12), { gain: .15, dur: .8, delay: i * .1, send: .4 });
      tone({ f: semi(n + 24), dur: .4, type: 'sine', gain: .05, delay: i * .1, send: .5 });
    });
    tone({ f: semi(-12), f2: semi(-12), dur: 1.4, type: 'sine', gain: .12, delay: .3 });
  },
  lose() {
    [7, 4, 2, -1].forEach((n, i) => tone({
      f: semi(n + 12), dur: .34, type: 'triangle', gain: .12, delay: i * .13, send: .3
    }));
    tone({ f: semi(-13), dur: .9, type: 'sine', gain: .1, delay: .45 });
  },
  levelup() {
    [0, 4, 7, 11, 12].forEach((n, i) => mallet(semi(n + 12), { gain: .13, dur: .6, delay: i * .085, send: .4 }));
  },

  /* ---- animals ----
     Two formants over a moving source: the cheapest way to make a
     synth sound like it came out of a throat.                    */
  meow(pitch) {
    if (!sfxOn()) return;
    if (!claimVoice(.55)) return;
    const base = 460 * (pitch || 1);
    const c = AU.ctx, t = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(base * .74, t);
    osc.frequency.linearRampToValueAtTime(base * 1.24, t + .13);
    osc.frequency.linearRampToValueAtTime(base * .70, t + .44);
    /* vibrato */
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 17; lg.gain.value = base * .035;
    lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + .5);
    /* two formants sweeping from "ee" towards "ow" */
    const f1 = c.createBiquadFilter(), f2 = c.createBiquadFilter();
    f1.type = 'bandpass'; f1.Q.value = 6;
    f1.frequency.setValueAtTime(720, t);
    f1.frequency.linearRampToValueAtTime(520, t + .42);
    f2.type = 'bandpass'; f2.Q.value = 8;
    f2.frequency.setValueAtTime(2100, t);
    f2.frequency.linearRampToValueAtTime(1150, t + .42);
    const m1 = c.createGain(), m2 = c.createGain();
    m1.gain.value = 1.6; m2.gain.value = .85;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.30, t + .05);
    g.gain.exponentialRampToValueAtTime(.21, t + .28);
    g.gain.exponentialRampToValueAtTime(0.0001, t + .5);
    osc.connect(f1); osc.connect(f2);
    f1.connect(m1); f2.connect(m2);
    m1.connect(g); m2.connect(g);
    outputChain(g, { send: .3 });
    osc.start(t); osc.stop(t + .52);
  },

  bark(pitch) {
    const p = pitch || 1;
    /* the shape of a bark is a hard consonant then a short vowel */
    noiseBurst({ fc: 900 * p, fc2: 380 * p, dur: .12, gain: .28, filter: 'bandpass', q: 2.2, send: .22 });
    tone({ f: 210 * p, f2: 118 * p, dur: .14, type: 'sawtooth', gain: .20, filter: 'lowpass', fc: 1100, send: .2 });
    tone({ f: 420 * p, f2: 260 * p, dur: .11, type: 'triangle', gain: .09 });
    noiseBurst({ fc: 700 * p, fc2: 320 * p, dur: .1, gain: .13, filter: 'bandpass', q: 2.2, delay: .17, send: .25 });
    tone({ f: 195 * p, f2: 120 * p, dur: .12, type: 'sawtooth', gain: .1, filter: 'lowpass', fc: 1000, delay: .17 });
  },

  purr() {
    if (!sfxOn()) return;
    if (!claimVoice(1.3)) return;
    const c = AU.ctx, t = c.currentTime;
    const src = c.createBufferSource(); src.buffer = AU.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300; f.Q.value = 2;
    /* a purr is amplitude modulation at ~25 Hz, not a tone */
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.13, t + .12);
    g.gain.setValueAtTime(.13, t + .8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
    const trem = c.createOscillator(), tg = c.createGain();
    trem.type = 'triangle'; trem.frequency.value = 25; tg.gain.value = .115;
    trem.connect(tg); tg.connect(g.gain); trem.start(t); trem.stop(t + 1.3);
    /* a body under it */
    const sub = c.createOscillator(), sg = c.createGain();
    sub.type = 'sine'; sub.frequency.value = 62;
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(.055, t + .15);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    const tg2 = c.createGain(); tg2.gain.value = .04;
    trem.connect(tg2); tg2.connect(sg.gain);
    sub.connect(sg);
    src.connect(f); f.connect(g);
    outputChain(g, { send: .14 });
    outputChain(sg, {});
    src.start(t); src.stop(t + 1.3);
    sub.start(t); sub.stop(t + 1.3);
  },

  eat() {
    for (let i = 0; i < 5; i++) {
      noiseBurst({ fc: rnd(700, 1200), fc2: 480, dur: .06, gain: .12, q: 2.4, delay: i * .105 });
      tone({ f: rnd(150, 210), f2: 110, dur: .05, type: 'square', gain: .04, delay: i * .105 });
    }
  },
  splash() {
    noiseBurst({ fc: 2400, fc2: 700, dur: .5, gain: .13, filter: 'bandpass', q: .8, send: .3 });
    for (let i = 0; i < 4; i++) {
      tone({ f: rnd(600, 1400), f2: rnd(1600, 2600), dur: .12, type: 'sine', gain: .05, delay: rnd(.02, .3), send: .35 });
    }
  },
  snore() {
    tone({ f: 92, f2: 66, dur: .8, type: 'sawtooth', gain: .07, filter: 'lowpass', fc: 240 });
    noiseBurst({ fc: 300, fc2: 160, dur: .7, gain: .04, filter: 'lowpass', q: 3 });
    tone({ f: 74, f2: 96, dur: .5, type: 'sine', gain: .05, delay: .85 });
  },
  /* the room tightens when the moves run out */
  tension(level) {
    const k = clamp(level, 0, 1);
    tone({ f: 72, f2: 58, dur: .5, type: 'sine', gain: .05 + k * .05, send: .2 });
    tone({ f: 108, f2: 96, dur: .35, type: 'triangle', gain: .02 + k * .03, delay: .16 });
  },
  /* a short breath of air between screens */
  swish(up) {
    noiseBurst({
      fc: up ? 500 : 2200, fc2: up ? 2400 : 420, dur: .26,
      gain: .38, filter: 'bandpass', q: 1.1, send: .25
    });
  },
  brush() {
    for (let i = 0; i < 3; i++) {
      noiseBurst({ fc: 1800, fc2: 900, dur: .22, gain: .08, filter: 'bandpass', q: 1.2, delay: i * .26, pan: i % 2 ? .3 : -.3 });
    }
  }
};

function petVoice(p, pitch) {
  if (!p) return;
  const st = petStageIdx(p);
  const k = (pitch || 1) * (st === 0 ? 1.28 : st === 1 ? 1.1 : .95);
  if (petBreed(p).species === 'cat') SFX.meow(k); else SFX.bark(k);
}

/* ============================================================
   Music — a slow lamp-lit loop, scheduled against the audio clock
   so it does not drift when the tab is busy drawing.
   ============================================================ */
const CHORDS = [
  [-5, 0, 4, 7], [-7, -2, 2, 5], [-3, 2, 5, 9], [-5, 0, 4, 11]
];
const MUS = { next: 0, look: .12, beat: .52 };

function musicStart() {
  audioInit();
  if (!AU.ready || AU.musicOn) return;
  AU.musicOn = true;
  const g = AU.musBus.gain, t0 = AU.ctx.currentTime;
  g.cancelScheduledValues(t0);
  g.setValueAtTime(g.value, t0);
  g.linearRampToValueAtTime(MUS_BED, t0 + 1.4);
  AU.step = 0;
  MUS.next = AU.ctx.currentTime + .1;
  const tick = () => {
    if (!AU.musicOn) return;
    while (MUS.next < AU.ctx.currentTime + MUS.look) {
      musicBeat(MUS.next);
      MUS.next += MUS.beat;
      AU.step++;
    }
    AU.musicTimer = setTimeout(tick, 25);
  };
  tick();
}

function musicBeat(t) {
  const c = AU.ctx;
  const bar = Math.floor(AU.step / 4) % CHORDS.length;
  const ch = CHORDS[bar];
  const s = AU.step % 4;

  /* bass on 1 and 3 */
  if (s === 0 || s === 2) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = semi(ch[0] - 12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.22, t + .04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + .9);
    o.connect(g); g.connect(AU.musBus);
    o.start(t); o.stop(t + 1);
  }
  /* soft pad, slightly detuned so it breathes */
  if (s === 0) {
    ch.slice(1).forEach((n, i) => {
      [0, 7].forEach(det => {
        const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
        o.type = 'triangle'; o.frequency.value = semi(n); o.detune.value = det;
        f.type = 'lowpass'; f.frequency.value = 1500;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(.03, t + .5);
        /* a bar is 2.08s, so a pad that died at 2.05 left a hole in it */
        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.75);
        o.connect(f); f.connect(g); g.connect(AU.musBus);
        o.start(t + i * .02); o.stop(t + 2.9);
      });
    });
  }
  /* a bell that wanders, more often when the board is busy */
  if (Math.random() < .42 + AU.intensity * .2) {
    const n = ch[1 + Math.floor(Math.random() * 3)] + 12;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = semi(n);
    g.gain.setValueAtTime(0.0001, t + .06);
    g.gain.exponentialRampToValueAtTime(.075, t + .1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(g); g.connect(AU.musBus);
    if (AU.verb) { const sd = c.createGain(); sd.gain.value = .3; g.connect(sd); sd.connect(AU.verbIn || AU.verb); }
    o.start(t); o.stop(t + 1.4);
  }
  AU.intensity *= .92;
}

function musicStop() {
  AU.musicOn = false;
  if (AU.musicTimer) clearTimeout(AU.musicTimer);
  if (AU.ready) {
    const g = AU.musBus.gain, t = AU.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0, t + .6);
  }
}
function musicSync() {
  if (SAVE.settings.music) musicStart(); else musicStop();
}
/* the board tells the music how lively things are, 0..1 */
function musicIntensity(v) { AU.intensity = clamp(v, 0, 1); }

/* ===== 25-art.js ===== */
/* ============================================================
   25 — art. Every animal, hat and biscuit is drawn with paths.
   All drawing happens in a normalised space centred on 0,0.
   ============================================================ */

/* palette read from CSS so canvases follow the Day/Dusk theme */
let PAL = {};
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue('--' + n).trim() || '#888';
  PAL = {
    bg: g('bg'), surface: g('surface'), surface2: g('surface-2'), surface3: g('surface-3'),
    line: g('line'), lineSoft: g('line-soft'), text: g('text'), textDim: g('text-dim'),
    accent: g('accent'), accentSoft: g('accent-soft'), accentInk: g('accent-ink'),
    rose: g('rose'), sage: g('sage'), plum: g('plum'), sky: g('sky'),
    boardBg: g('board-bg'), boardCell: g('board-cell'), boardCell2: g('board-cell-2')
  };
  PAL.dark = hex2rgb(PAL.bg).reduce((a, b) => a + b, 0) < 380;
}

/* ---------------- pips (shape cue for colour-blind mode) ---------------- */
function drawPip(c, kind, x, y, r, col) {
  c.save(); c.translate(x, y); c.fillStyle = col; c.strokeStyle = col;
  c.lineWidth = r * .32; c.lineCap = 'round'; c.lineJoin = 'round';
  switch (kind) {
    case 'fish':
      c.beginPath();
      c.moveTo(-r, 0); c.quadraticCurveTo(0, -r * .8, r * .6, 0); c.quadraticCurveTo(0, r * .8, -r, 0);
      c.fill();
      c.beginPath(); c.moveTo(r * .55, 0); c.lineTo(r, -r * .55); c.lineTo(r, r * .55); c.closePath(); c.fill();
      break;
    case 'bone':
      c.beginPath();
      c.roundRect ? c.roundRect(-r * .8, -r * .22, r * 1.6, r * .44, r * .22) : rr(c, -r * .8, -r * .22, r * 1.6, r * .44, r * .22);
      c.fill();
      [-1, 1].forEach(sx => {
        ellipse(c, sx * r * .78, -r * .3, r * .32, r * .32); c.fill();
        ellipse(c, sx * r * .78, r * .3, r * .32, r * .32); c.fill();
      });
      break;
    case 'moon':
      c.beginPath(); c.arc(0, 0, r, Math.PI * .35, Math.PI * 1.65);
      c.arc(r * .42, 0, r * .86, Math.PI * 1.6, Math.PI * .4, true);
      c.closePath(); c.fill();
      break;
    case 'star': {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r;
        i ? c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2) : c.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
      }
      c.closePath(); c.fill(); break;
    }
    case 'leaf':
      c.beginPath();
      c.moveTo(0, -r); c.quadraticCurveTo(r, -r * .2, 0, r); c.quadraticCurveTo(-r, -r * .2, 0, -r);
      c.fill();
      break;
    case 'heart':
      c.beginPath();
      c.moveTo(0, r * .85);
      c.bezierCurveTo(-r * 1.35, -r * .1, -r * .55, -r * 1.05, 0, -r * .35);
      c.bezierCurveTo(r * .55, -r * 1.05, r * 1.35, -r * .1, 0, r * .85);
      c.fill();
      break;
  }
  c.restore();
}

/* ---------------- ears ---------------- */
/* What the ears are doing.

   An animal's ears are the loudest thing on its face and these were
   welded on: the same angle whether the pet was delighted or asleep.
   The room already knows the mood — it picks idle behaviour and thought
   bubbles from it — so it costs nothing to say it here too.

   `rot` turns the ear about its base, positive being outward and down.
   `droop` shortens it, which is what a tired ear does. `out` slides it
   off the skull a little for the alert poses. */
/* how wide the pupil opens, by mood */
const PUPIL_DILATE = {
  happy: 1.16, content: 1, hungry: 1.12, lonely: .94,
  dirty: .95, bored: .86, tired: .80, sleeping: .78
};

const EAR_POSE = {
  happy:    { rot: -.13, out: .020, droop: -.04 },
  content:  { rot: 0, out: 0, droop: 0 },
  hungry:   { rot: -.08, out: .026, droop: 0 },
  lonely:   { rot: .17, out: -.010, droop: .10 },
  dirty:    { rot: .11, out: 0, droop: .07 },
  bored:    { rot: .21, out: .008, droop: .14 },
  tired:    { rot: .32, out: .018, droop: .22 },
  sleeping: { rot: .36, out: .022, droop: .26 }
};

function drawEars(c, spec, s, back, o) {
  const b = spec.breed, fur = spec.fur, fur2 = spec.fur2, inner = spec.inner || '#E8A0A8';
  const k = b.ear;
  if (back && (k === 'droop' || k === 'flop' || k === 'button')) return;   // drawn in front
  if (!back && !(k === 'droop' || k === 'flop' || k === 'button')) return;

  const pose = EAR_POSE[(o && o.mood) || 'content'] || EAR_POSE.content;
  const ear = (sx) => {
    c.save(); c.scale(sx, 1);
    /* turn about where the ear leaves the skull, not about the face,
       or a tired ear slides off the head instead of folding down */
    if (pose.rot || pose.droop || pose.out) {
      c.translate(.22 * s + pose.out * s, -.26 * s);
      c.rotate(pose.rot);
      c.scale(1, 1 - pose.droop);
      c.translate(-.22 * s, .26 * s);
    }
    if (k === 'triangle') {
      /* Set wide on the skull and leaning out, about a third of the
         head tall. The old pair were small tabs perched on the crown. */
      c.fillStyle = fur;
      c.beginPath();
      c.moveTo(.08 * s, -.28 * s);
      c.quadraticCurveTo(.23 * s, -.82 * s, .49 * s, -.32 * s);
      c.quadraticCurveTo(.33 * s, -.14 * s, .08 * s, -.28 * s);
      c.fill();
      /* the inside of an ear is a cone: dark where it meets the skull,
         catching light toward the tip. Flat colour made it a sticker. */
      const ig1 = c.createLinearGradient(.20 * s, -.24 * s, .34 * s, -.62 * s);
      ig1.addColorStop(0, shade(inner, -.30));
      ig1.addColorStop(.55, inner);
      ig1.addColorStop(1, shade(inner, .22));
      c.fillStyle = ig1;
      c.beginPath();
      c.moveTo(.16 * s, -.30 * s);
      c.quadraticCurveTo(.26 * s, -.66 * s, .41 * s, -.33 * s);
      c.quadraticCurveTo(.29 * s, -.21 * s, .16 * s, -.30 * s);
      c.fill();
    } else if (k === 'tall') {
      c.fillStyle = spec.point || fur2;
      c.beginPath();
      c.moveTo(.12 * s, -.30 * s);
      c.quadraticCurveTo(.30 * s, -.88 * s, .50 * s, -.30 * s);
      c.quadraticCurveTo(.32 * s, -.18 * s, .12 * s, -.30 * s);
      c.fill();
      c.fillStyle = rgba('#000000', .12);
      c.beginPath();
      c.moveTo(.21 * s, -.31 * s);
      c.quadraticCurveTo(.31 * s, -.68 * s, .42 * s, -.31 * s);
      c.quadraticCurveTo(.31 * s, -.24 * s, .21 * s, -.31 * s);
      c.fill();
    } else if (k === 'round') {
      /* Round-eared, still a cat: a broad triangle with a soft tip.
         Two circles on a circle is a bear, which is what this was. */
      c.fillStyle = fur;
      c.beginPath();
      c.moveTo(.09 * s, -.27 * s);
      c.quadraticCurveTo(.20 * s, -.74 * s, .46 * s, -.35 * s);
      c.quadraticCurveTo(.32 * s, -.15 * s, .09 * s, -.27 * s);
      c.fill();
      const ig2 = c.createLinearGradient(.20 * s, -.24 * s, .32 * s, -.58 * s);
      ig2.addColorStop(0, shade(inner, -.30));
      ig2.addColorStop(.55, inner);
      ig2.addColorStop(1, shade(inner, .22));
      c.fillStyle = ig2;
      c.beginPath();
      c.moveTo(.17 * s, -.29 * s);
      c.quadraticCurveTo(.24 * s, -.60 * s, .39 * s, -.35 * s);
      c.quadraticCurveTo(.29 * s, -.21 * s, .17 * s, -.29 * s);
      c.fill();
    } else if (k === 'droop') {
      c.fillStyle = fur2;
      c.beginPath();
      c.moveTo(.28 * s, -.26 * s);
      c.quadraticCurveTo(.62 * s, -.20 * s, .58 * s, .22 * s);
      c.quadraticCurveTo(.52 * s, .48 * s, .34 * s, .38 * s);
      c.quadraticCurveTo(.30 * s, .08 * s, .28 * s, -.26 * s);
      c.fill();
      c.fillStyle = rgba('#000000', .13);
      c.beginPath();
      c.moveTo(.30 * s, -.20 * s);
      c.quadraticCurveTo(.50 * s, -.10 * s, .47 * s, .18 * s);
      c.quadraticCurveTo(.43 * s, .34 * s, .35 * s, .30 * s);
      c.fill();
    } else if (k === 'flop') {
      c.fillStyle = fur2;
      c.beginPath();
      c.moveTo(.24 * s, -.30 * s);
      c.quadraticCurveTo(.58 * s, -.34 * s, .54 * s, .06 * s);
      c.quadraticCurveTo(.50 * s, .30 * s, .30 * s, .24 * s);
      c.quadraticCurveTo(.26 * s, -.02 * s, .24 * s, -.30 * s);
      c.fill();
      c.fillStyle = rgba('#FFFFFF', .12);
      c.beginPath();
      c.moveTo(.30 * s, -.24 * s);
      c.quadraticCurveTo(.48 * s, -.22 * s, .45 * s, .04 * s);
      c.quadraticCurveTo(.42 * s, .18 * s, .34 * s, .14 * s);
      c.fill();
    } else if (k === 'button') {
      c.fillStyle = fur2;
      c.beginPath();
      c.moveTo(.16 * s, -.36 * s);
      c.quadraticCurveTo(.46 * s, -.48 * s, .44 * s, -.16 * s);
      c.quadraticCurveTo(.32 * s, -.06 * s, .18 * s, -.20 * s);
      c.closePath();
      c.fill();
      c.fillStyle = rgba('#000000', .16);
      c.beginPath();
      c.moveTo(.21 * s, -.31 * s);
      c.quadraticCurveTo(.39 * s, -.36 * s, .38 * s, -.18 * s);
      c.quadraticCurveTo(.29 * s, -.13 * s, .22 * s, -.21 * s);
      c.fill();
    }
    c.restore();
  };
  ear(1); ear(-1);
}

/* ---------------- head ---------------- */
function headPath(c, spec, s) {
  const f = spec.breed.face;
  c.beginPath();
  if (f === 'flat') {
    c.moveTo(-.44 * s, -.06 * s);
    c.bezierCurveTo(-.46 * s, -.36 * s, -.26 * s, -.46 * s, 0, -.46 * s);
    c.bezierCurveTo(.26 * s, -.46 * s, .46 * s, -.36 * s, .44 * s, -.06 * s);
    c.bezierCurveTo(.43 * s, .26 * s, .26 * s, .42 * s, 0, .42 * s);
    c.bezierCurveTo(-.26 * s, .42 * s, -.43 * s, .26 * s, -.44 * s, -.06 * s);
  } else if (f === 'dog') {
    c.moveTo(-.40 * s, -.04 * s);
    c.bezierCurveTo(-.42 * s, -.34 * s, -.24 * s, -.44 * s, 0, -.44 * s);
    c.bezierCurveTo(.24 * s, -.44 * s, .42 * s, -.34 * s, .40 * s, -.04 * s);
    c.bezierCurveTo(.39 * s, .20 * s, .24 * s, .44 * s, 0, .44 * s);
    c.bezierCurveTo(-.24 * s, .44 * s, -.39 * s, .20 * s, -.40 * s, -.04 * s);
  } else {
    /* A cat's head is a wedge, not a ball: the skull is moderate, the
       cheeks are the widest part, and it tapers to a small chin. Drawn
       as a circle with ears on top — which is what this was — it reads
       as a bear, and the Sable read as one most of all. */
    c.moveTo(-.43 * s, .02 * s);
    c.bezierCurveTo(-.44 * s, -.26 * s, -.24 * s, -.42 * s, 0, -.42 * s);
    c.bezierCurveTo(.24 * s, -.42 * s, .44 * s, -.26 * s, .43 * s, .02 * s);
    c.bezierCurveTo(.42 * s, .22 * s, .26 * s, .36 * s, .11 * s, .42 * s);
    c.bezierCurveTo(.04 * s, .45 * s, -.04 * s, .45 * s, -.11 * s, .42 * s);
    c.bezierCurveTo(-.26 * s, .36 * s, -.42 * s, .22 * s, -.43 * s, .02 * s);
  }
  c.closePath();
}

/* A tabby mark is thick where it leaves the spine and thin where it
   ends, and it follows the curve of the skull. Stroked with a round cap
   it is a bar with two dome ends, which is what these were: at .045 of
   the head wide and .75 opaque they read as painted-on stripes rather
   than fur.

   This walks a quadratic spine and offsets it by a width that falls
   from w0 to w1, so the mark tapers along its length. */
function taperMark(c, x0, y0, cx, cy, x1, y1, w0, w1) {
  const N = 14, L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    const px = u * u * x0 + 2 * u * t * cx + t * t * x1;
    const py = u * u * y0 + 2 * u * t * cy + t * t * y1;
    const tx = 2 * u * (cx - x0) + 2 * t * (x1 - cx);
    const ty = 2 * u * (cy - y0) + 2 * t * (y1 - cy);
    const len = Math.hypot(tx, ty) || 1;
    const nx = -ty / len, ny = tx / len;
    const w = (w0 + (w1 - w0) * t) * .5;
    L.push([px + nx * w, py + ny * w]);
    R.push([px - nx * w, py - ny * w]);
  }
  c.beginPath();
  c.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < L.length; i++) c.lineTo(L[i][0], L[i][1]);
  for (let i = R.length - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath();
}

function drawMarkings(c, spec, s) {
  const b = spec.breed;
  c.save();
  headPath(c, spec, s); c.clip();
  if (b.mark === 'tabby') {
    c.fillStyle = rgba(spec.fur2, .58);
    /* the forehead's M, fanning out from the brow rather than three
       parallel scratches */
    taperMark(c, -.05 * s, -.22 * s, -.13 * s, -.34 * s, -.17 * s, -.44 * s, s * .052, s * .012);
    c.fill();
    taperMark(c, 0, -.24 * s, 0, -.36 * s, 0, -.47 * s, s * .050, s * .011);
    c.fill();
    taperMark(c, .05 * s, -.22 * s, .13 * s, -.34 * s, .17 * s, -.44 * s, s * .052, s * .012);
    c.fill();
    /* cheek bars, curving back with the cheek */
    c.fillStyle = rgba(spec.fur2, .46);
    [-1, 1].forEach(sx => {
      taperMark(c, sx * .25 * s, -.13 * s, sx * .36 * s, -.14 * s, sx * .44 * s, -.09 * s, s * .046, s * .014);
      c.fill();
      taperMark(c, sx * .27 * s, .01 * s, sx * .37 * s, .02 * s, sx * .44 * s, .06 * s, s * .042, s * .013);
      c.fill();
    });
  } else if (b.mark === 'patch') {
    c.fillStyle = rgba(spec.fur2, .9);
    ellipse(c, -.20 * s, -.16 * s, .19 * s, .16 * s, -.2); c.fill();
    c.fillStyle = rgba(spec.belly, .95);
    c.beginPath();
    c.moveTo(0, -.46 * s); c.quadraticCurveTo(.07 * s, -.14 * s, 0, .14 * s);
    c.quadraticCurveTo(-.07 * s, -.14 * s, 0, -.46 * s); c.fill();
  } else if (b.mark === 'points') {
    /* the points sit on the muzzle, which moved down with the features;
       left where it was the mask covered the eyes instead of the nose */
    const gr = c.createRadialGradient(0, .32 * s, .05 * s, 0, .32 * s, .34 * s);
    gr.addColorStop(0, rgba(spec.fur2, .92));
    gr.addColorStop(.62, rgba(spec.fur2, .42));
    gr.addColorStop(1, rgba(spec.fur2, 0));
    c.fillStyle = gr;
    ellipse(c, 0, .30 * s, .34 * s, .28 * s); c.fill();
  } else if (b.mark === 'mask') {
    const gr = c.createRadialGradient(0, .26 * s, .04 * s, 0, .26 * s, .36 * s);
    gr.addColorStop(0, rgba(spec.fur2, .95));
    gr.addColorStop(.55, rgba(spec.fur2, .78));
    gr.addColorStop(1, rgba(spec.fur2, 0));
    c.fillStyle = gr;
    ellipse(c, 0, .24 * s, .32 * s, .28 * s); c.fill();
    c.strokeStyle = rgba(spec.fur2, .5); c.lineWidth = s * .035; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-.17 * s, -.24 * s); c.quadraticCurveTo(0, -.34 * s, .17 * s, -.24 * s);
    c.moveTo(-.13 * s, -.15 * s); c.quadraticCurveTo(0, -.24 * s, .13 * s, -.15 * s);
    c.stroke();
  }
  c.restore();
}

/* ---------- legibility on dark coats ---------- */
/* Relative luminance, 0..1. Features drawn in near-black vanish on a
   coat that is itself near-black, so below the threshold the ink flips. */
function coatLum(hexc) {
  const [r, g, b] = hex2rgb(hexc);
  return (r * .2126 + g * .7152 + b * .0722) / 255;
}
function darkCoat(spec) { return coatLum(spec.fur) < .30; }
/* A treat, drawn small enough to sit on a map node. Same shape as the
   icon in the top bar so the two read as the same thing. */
function drawTreatPip(c, x, y, r) {
  c.save();
  c.translate(x, y);
  c.rotate(-.5);
  c.fillStyle = '#F3E2C4';
  c.strokeStyle = rgba('#6B4A22', .75);
  c.lineWidth = r * .30;
  c.lineJoin = 'round';
  const w = r * 1.5, h = r * .62, k = r * .52;
  c.beginPath();
  ellipse(c, -w / 2, -h / 2, k, k);
  c.fill(); c.stroke();
  c.beginPath();
  ellipse(c, -w / 2, h / 2, k, k);
  c.fill(); c.stroke();
  c.beginPath();
  ellipse(c, w / 2, -h / 2, k, k);
  c.fill(); c.stroke();
  c.beginPath();
  ellipse(c, w / 2, h / 2, k, k);
  c.fill(); c.stroke();
  rr(c, -w / 2, -h / 2, w, h, h * .5);
  c.fill(); c.stroke();
  c.restore();
}

/* whichever of dark or cream reads better on a given fill */
function inkOn(hex) { return coatLum(hex) > .45 ? '#22271C' : '#FFFFFF'; }
/* the colour a line or a nose is drawn in so that it always reads */
function featureInk(spec) { return darkCoat(spec) ? '#E4D8C8' : '#2A2118'; }

/* ---------------- eyes ----------------
   Six breeds sharing one pair of round eyes is six recolours of the
   same animal. The eye is the first thing anyone reads, so each breed
   gets its own: size, slant, lid, and whether it has brows at all. */
const FACE_LOOK = {
  /* Baby schema, which is the whole of what makes a drawn animal read
     as cute and is not a matter of taste: a large cranium, eyes that
     are big and sit at or below the middle of the face, and a nose and
     mouth clustered low and small. These eyes were .09 to .12 of the
     head and sat above the midline — the proportions of an adult
     animal, which is why the faces were merely tidy.

     Doubling them is most of the difference. `x` has to open up with
     `r` or they meet in the middle, and `y` goes positive: below
     centre, with forehead above. */
  marmalade: { r: .156, x: .190, y: .045, tilt: -.09, almond: true, lid: .34, brow: 0 },
  beagle: { r: .158, x: .186, y: .030, tilt: .06, almond: false, lid: .20, brow: .8 },
  void: { r: .164, x: .194, y: .040, tilt: 0, almond: false, lid: .10, brow: 0 },
  retriever: { r: .154, x: .182, y: .022, tilt: .05, almond: false, lid: .34, brow: 0 },
  siamese: { r: .154, x: .188, y: .046, tilt: -.16, almond: true, lid: .28, brow: 0 },
