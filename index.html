  if (walker && walker.asleep) walker.asleep = false;
  G.spending = false;      /* nothing is mid-ability on a fresh board */
  G.n = n;
  G.epoch++;                          /* anything still running belongs to the old board */
  /* the daily is a second generator with its own seed and its own
     sizing, not a level number, so the caller picks rather than the
     level table reaching into the save to find out how far you got */

  G.B.pupQueue = 0;
  const pet = activePet();
  const perks = opts.perks || [];
  let moves = G.def.moves;
  G.scoreMul = 1;
  G.charge = 0;
  perks.forEach(p => {
    if (p.id === 'moves' || p.id === 'bondmoves' || p.id === 'trait') moves += p.v;
    if (p.id === 'charge') G.charge = p.v;
    if (p.id === 'score') G.scoreMul += p.v;

  G.over = false; G.busy = true;
  G.sel = null; G.armed = null; G.armedFirst = null;
  G.particles = []; G.floats = []; G.beams = []; G.rings = [];
  G.rescued = 0; G.usedExtra = false; G.creepTick = 0; G.lastPraise = 0;
  G.starTargets = starTargets(G.def);
  G.starsEarned = 0;

     lane once — a level that starts with a goal already partly met

    const onBoard = Math.min(PUPS_IN_PLAY, G.pupsWanted + 2);
    for (let i = 0; i < onBoard; i++) placePup(G.B);
  }

  if (perks.some(p => p.id === 'gift')) {
    const spots = [];
    eachCell(G.B, (cell, r, c) => { if (cell.tile && cell.tile.type >= 0 && cell.ice === 0) spots.push([r, c]); });
    if (spots.length) {
      const [r, c] = pick(spots);
      G.B.cell[r][c].tile.sp = Math.random() < .5 ? SP.ROW : SP.COL;
    }

  /* Built here rather than by the caller. Four separate places started a
     level and each had to remember to build the star track afterwards;

  buildStarTrack();
  buildBoosterBar();

  layoutBoard();

     last, and falls under the same gravity, so it lands as a run */
  const dealBase = G.B.h + 1.2;
  eachCell(G.B, (cell, r, c) => {

/* Baskets start in the upper middle rather than the very top row: from

function placePup(B) {
  const spots = [];

  /* every candidate cell, not the first per column — taking the first
     lined all the baskets up along one row. Columns that already hold a
     basket are skipped so they arrive spread out rather than stacked. */
  const taken = new Set();
  for (let r = 0; r < B.h; r++) {
    for (let c = 0; c < B.w; c++) {
      const cell = B.cell[r][c];

  for (let c = 0; c < B.w; c++) {
    if (taken.has(c)) continue;
    for (let r = from; r < to; r++) {
      const cell = openCell(B, r, c);
      if (cell && cell.tile && cell.tile.type >= 0 && cell.tile.sp === SP.NONE && cell.ice === 0) spots.push(cell);
    }
  }
  /* every column already busy: fall back to any free cell */
  if (!spots.length) {
    for (let c = 0; c < B.w; c++) for (let r = from; r < to; r++) {
      const cell = openCell(B, r, c);
      if (cell && cell.tile && cell.tile.type >= 0 && cell.tile.sp === SP.NONE && cell.ice === 0) spots.push(cell);
    }
  }
  if (!spots.length) return false;
  const cell = pick(spots);
  cell.tile.type = PUP;
  cell.tile.sp = SP.NONE;
  return true;
}

/* The lane behind the board shows the walk as a line of paw prints, and

function paintWalk() {

}

/* ---------------- boosters ---------------- */
function armBooster(id) {
  if (G.busy || G.over) return;
  audioResume();
  if (G.armed === id) { G.armed = null; G.armedFirst = null; syncBoosterBar(); return; }
  if (!(SAVE.boosters[id] > 0)) return;
  if (id === 'shuffle') {
    SAVE.boosters[id]--; persist();
    syncBoosterBar();
    SFX.select();
    doShuffle();
    return;
  }
  G.armed = id; G.armedFirst = null;
  SFX.select();

}
async function useHammer(r, c) {

  SAVE.boosters.hammer--; persist();
  G.armed = null; syncBoosterBar();
  G.busy = true;

}
async function useFreeSwap(a, b) {

  G.armed = null; G.armedFirst = null; syncBoosterBar();

async function doShuffle() {
  const _ep = levelEpoch();
  G.busy = true;
  eachCell(G.B, cell => { if (cell.tile) cell.tile.jiggle = 1; });
  await wait(180);
  if (stale(_ep)) return;
  let guard = 0;
  do { shuffleTypes(G.B); } while (!hasMove(G.B) && guard++ < 40);
  eachCell(G.B, (cell, r, c) => {

      cell.tile.x = c + rnd(-.4, .4); cell.tile.y = r + rnd(-.4, .4);

  if (stale(_ep)) return;

  checkEnd();
}

/* ---------------- clearing ---------------- */
function hitCell(B, r, c, ctx, direct) {
  const cell = B.cell[r] && B.cell[r][c];
  if (!cell || cell.hole) return;
  const key = r + ':' + c;
  if (ctx.touched.has(key)) return;
  ctx.touched.add(key);

  if (cell.crate > 0) {
    cell.crate--;
    ctx.crate += (cell.crate === 0 ? 1 : 0);
    const [cx, cy, pan] = cellFX(r, c);
    SFX.crate(cell.crate > 0, pan);
    buzzOften(HAP.crack, 110);
    FX.splinters(cx, cy, G.cell, cell.crate === 0);
    if (cell.crate === 0) ring(r, c, '#C79A62');
    return;
  }
  if (cell.ice > 0) {
    cell.ice--;
    ctx.ice++;
    const [cx, cy, pan] = cellFX(r, c);
    SFX.ice(pan);
    buzzOften(HAP.crack, 110);
    FX.shards(cx, cy, G.cell);
    return;
  }
  const t = cell.tile;
  if (!t) return;
  if (t.type === PUP) return;                     // pups only leave by the door
  if (t.dying) return;

  if (t.sp !== SP.NONE) ctx.chain.push({ r, c, sp: t.sp, type: t.type });
  t.dying = .01;
  t.dieDelay = ctx.delay;
  ctx.removed.push({ r, c, t });
  ctx.count++;
  if (t.type >= 0) ctx.collect[t.type] = (ctx.collect[t.type] || 0) + 1;
  if (cell.mud > 0) {
    cell.mud--; ctx.mud++;
    const [mx, my, mpan] = cellFX(r, c);
    SFX.mud(mpan);
    FX.splat(mx, my, G.cell, boardFloor());
  }
  if (cell.bram > 0) {
    cell.bram--; ctx.bram++;
    const [bx, by, bpan] = cellFX(r, c);
    SFX.snip(bpan);
    FX.splinters(bx, by, G.cell, false);
    burst(r, c, '#4E7A42', 8, 1);
  }
  if (direct !== 'noCrate') {
    [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([r2, c2]) => {
      const n = B.cell[r2] && B.cell[r2][c2];
      if (n && n.crate > 0) {
        n.crate--;
        if (n.crate === 0) { ctx.crate++; ring(r2, c2, '#C79A62'); }
        const [nx, ny, npan] = cellFX(r2, c2);
        SFX.crate(n.crate > 0, npan);
        FX.splinters(nx, ny, G.cell, n.crate === 0);
      }
      /* A molehill is filled in from beside it, exactly as a crate is
         broken from beside it. Same verb, so there is nothing new to
         learn about how to deal with it — only about when. */
      if (n && n.mole > 0 && moleHit(B, n)) {
        if (n.mole === 0) { ctx.mole++; ring(r2, c2, '#8A6A44'); }
        const [nx, ny, npan] = cellFX(r2, c2);
        SFX.mud(npan);
        buzzOften(HAP.crack, 110);
        burst(r2, c2, '#6B4A2C', n.mole === 0 ? 12 : 6, 1);
      }
    });
  }
}

function specialKeys(B, r, c, sp, type) {
  const keys = [];
  const [sx, sy, span] = cellFX(r, c);
  const gem = slotGem(type);
  if (sp === SP.ROW) {
    for (let i = 0; i < B.w; i++) keys.push(r + ':' + i);
    beam(r, c, 'h'); SFX.rocket(span);
    for (let i = 0; i < B.w; i++) {
      const dir = i < c ? -1 : 1;
      FX.rocketTrail(cellX(i) + G.cell / 2, sy, gem, G.cell, dir, 0);
    }
    FX.shake(.12);
  } else if (sp === SP.COL) {
    for (let i = 0; i < B.h; i++) keys.push(i + ':' + c);
    beam(r, c, 'v'); SFX.rocket(span);
    for (let i = 0; i < B.h; i++) {
      const dir = i < r ? -1 : 1;
      FX.rocketTrail(sx, cellY(i) + G.cell / 2, gem, G.cell, 0, dir);
    }
    FX.shake(.12);
  } else if (sp === SP.BOMB) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) keys.push((r + dr) + ':' + (c + dc));
    ring(r, c, PAL.accent);
    SFX.bomb(span);
    FX.blast(sx, sy, G.cell, gem);
    FX.wave(c, r, { amp: .26, speed: 10, ttl: .5, width: 1.6 });
  } else if (sp === SP.RAIN) {
    const tt = type === undefined || type < 0 ? commonType(B) : type;
    tilesOfType(B, tt).forEach(([rr2, cc]) => keys.push(rr2 + ':' + cc));
    SFX.rainbow(); G.flash = .5;
  }
  return keys;
}

/* Runs a blast and every special it sets off, wave by wave. */
async function blastWaves(startKeys, chain, silent) {
  const _ep = levelEpoch();
  let wave = Array.from(startKeys);
  let guard = 0;
  let totalTiles = 0;
  while (wave.length && guard++ < 24) {
    const ctx = { touched: new Set(), removed: [], chain: [], collect: {}, mud: 0, crate: 0, ice: 0, bram: 0, count: 0, delay: 0 };
    wave.forEach(k => {
      const [r, c] = k.split(':').map(Number);
      hitCell(G.B, r, c, ctx);
    });
    /* score + goals */
    let gained = 0;
    ctx.removed.forEach((it, i) => {
      gained += 62 * Math.min(8, chain || 1);
      burst(it.r, it.c, it.t.type >= 0 ? slotGem(it.t.type) : PAL.accent, 7, 1);
      if (!silent && i < 5) SFX.pop(chain || 1, i, cellFX(it.r, it.c)[2]);
      /* the tiles around it flinch. A board where only the matched
         cells react is a spreadsheet clearing rows; one where the
         neighbours move is a thing made of objects */
      if (!silent) [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(d2 => {
        const cell = openCell(G.B, it.r + d2[0], it.c + d2[1]);
        const nt = cell && cell.tile;
        if (nt && !nt.dying && !nt.tw) nt.jiggle = Math.max(nt.jiggle || 0, .34);
      });
    });
    /* and the whole board takes a knock, sized to how much went. Shake
       used to need a chain of two, so a plain three — the move a player
       makes more than any other — landed with nothing behind it. */
    if (!silent && ctx.removed.length) {
      G.shake = Math.max(G.shake, Math.min(5, 1.1 + ctx.removed.length * .32));
      /* and so does the hand. Rate limited, because a long cascade calls
         this every hundred and forty milliseconds and a motor held on
         for the whole of it is a buzz, not a series of taps. */
      buzzOften((chain || 1) > 1 ? HAP.chain(chain) : HAP.clear(ctx.removed.length), 90);
    }
    totalTiles += ctx.count;
    if (!silent && ctx.removed.length) {
      musicIntensity(Math.min(1, (chain || 1) / 5));
      if ((chain || 1) >= 3) {
        SFX.combo(chain);
        FX.pulse(G.ox, G.oy, G.boardW, G.boardH,
          { col: PAL.accent, a: .10 + Math.min(.16, chain * .03), ttl: .5 });
      }
    }
    addScore(gained);
    applyCounts(ctx);
    if (ctx.removed.length) await wait(reduceMotion() ? 40 : 145);
    if (stale(_ep)) return;
    ctx.removed.forEach(it => {
      const cell = G.B.cell[it.r][it.c];
      if (cell.tile === it.t) cell.tile = null;
    });
    /* next wave from specials we just consumed */
    const next = [];
    ctx.chain.forEach(s => { specialKeys(G.B, s.r, s.c, s.sp, s.type).forEach(k => next.push(k)); });
    wave = next;
    if (next.length) await wait(reduceMotion() ? 30 : 90);
    if (stale(_ep)) return;
  }
  SAVE.stats.tilesPopped += totalTiles;
  SAVE.stats.biggestClear = Math.max(SAVE.stats.biggestClear || 0, totalTiles);
  return totalTiles;
}

function applyCounts(ctx) {
  let bumped = -1;
  G.goals.forEach((g, i) => {
    if (g.kind === GK.COLLECT && ctx.collect[g.arg]) { g.have += ctx.collect[g.arg]; bumped = i; }
    if (g.kind === GK.MUD && ctx.mud) { g.have += ctx.mud; bumped = i; }
    if (g.kind === GK.CRATE && ctx.crate) { g.have += ctx.crate; bumped = i; }
    if (g.kind === GK.MOLE && ctx.mole) { g.have += ctx.mole; bumped = i; }
    if (g.kind === GK.BRAMBLE) {
      const left = brambleCount(G.B);
      const was = g.have;
      g.have = clamp(g.need - left, 0, g.need);
      if (g.have !== was) bumped = i;
    }
  });
  /* charge the pet on its own breed — but never off its own ability */
  const pet = activePet();
  if (pet && !G.over && !G.spending) {
    const fav = favType();
    let add = 0;
    for (const k in ctx.collect) add += (+k === fav ? CHARGE_FAV : CHARGE_OTHER) * ctx.collect[k];
    add *= traitChargeScale(pet);
    if (add) {
      const was = G.charge;
      G.charge = clamp(G.charge + add, 0, 100);
      if (was < 100 && G.charge >= 100) {
        petVoice(pet, 1.1); G.petMood = 'ready'; G.petMoodT = 1.4;
        /* a bark and a full bar say nothing to a screen reader, and the
           ability is the one thing on this board you have to choose to use */
        say(T('a11y_ready', { name: pet.name }), true);
      }
    }
  }
  syncGoals(bumped);
  syncHud();
}
function addScore(n) {
  if (n <= 0) return;
  G.score += Math.round(n * G.scoreMul);
  syncHud();
  syncStars();
}

/* ---------------- cascades ---------------- */
async function clearGroups(groups, swapCells) {
  const _ep = levelEpoch();
  const keys = new Set();
  const makeSpecials = [];
  groups.forEach(g => {
    const sp = specialFor(g);
    let at = null;
    if (sp !== SP.NONE) {
      if (swapCells) {
        for (const sc of swapCells) {
          if (g.cells.some(([r, c]) => r === sc[0] && c === sc[1])) { at = sc; break; }
        }
      }
      if (!at) at = g.cells[Math.floor(g.cells.length / 2)];
      makeSpecials.push({ r: at[0], c: at[1], sp, type: g.type });
    }
    g.cells.forEach(([r, c]) => {
      if (at && r === at[0] && c === at[1]) return;      // survives, becomes the special
      keys.add(r + ':' + c);
    });
  });
  if (G.chain >= 2) {
    G.bestChain = Math.max(G.bestChain, G.chain);
    /* the lifetime figure is written back only once the move has fully
       resolved, so while the chain is running it is still the old one */
    if (G.chain >= 4 && !G.bestShown && G.chain > (SAVE.stats.bestCombo || 0)) {
      G.bestShown = true;
      toast(T('g_new_best', { n: G.chain }), 'star');
      SFX.star();
      buzz(HAP.chain(G.chain));
    }
    /* One praise word at a time. A long cascade fires these a few frames
       apart and they used to stack into an unreadable pile, so a new one
       only appears once the last has had time to rise clear. */
    const t = performance.now();
    if (t - (G.lastPraise || 0) > 420) {
      G.lastPraise = t;
      const first = groups[0].cells[0];
      const words = ['g_sweet', 'g_tasty', 'g_lovely', 'g_amazing', 'g_unreal'];
      cellFloat(first[0], first[1], T(words[Math.min(words.length - 1, G.chain - 2)]), PAL.accent, 17);
    }
  }
  await blastWaves(keys, G.chain);
  if (stale(_ep)) return;
  /* now stamp the new specials */
  makeSpecials.forEach(s => {
    const cell = G.B.cell[s.r][s.c];
    if (cell && cell.tile) {
      cell.tile.sp = s.sp;
      cell.tile.scale = .4;
      cell.tile.jiggle = 1;
      ring(s.r, s.c, s.type >= 0 ? slotGem(s.type) : PAL.accent);
      addScore(210);
      SFX.select();
    }
  });
  if (makeSpecials.length) await wait(reduceMotion() ? 30 : 110);
  if (stale(_ep)) return;
}

/* Settles the board, then walks any pup that reached the door home.
   Collecting one empties its exit cell, so we settle again until the
   board comes to rest with every open cell filled. */
async function settleBoard(depth) {
  const _ep = levelEpoch();
  const moves = settle(G.B);
  if (!moves.length) {
    if (collectPups() && (depth || 0) < 12) await settleBoard((depth || 0) + 1);
    if (stale(_ep)) return;
    return;
  }
  let maxDur = 0;
  moves.forEach(m => {

    if (m.materialise) { t.x = m.toC; t.y = m.toR; t.scale = 0; return; }
    if (m.spawn) { t.x = m.fromC; t.y = m.fromR; }
    const dist = Math.max(Math.abs(m.toR - t.y), Math.abs(m.toC - t.x));
    const dur = clamp(.10 + dist * .050, .12, .46);
    maxDur = Math.max(maxDur, dur);

    t.tw.land = true;
    t.tw.force = clamp(dist / 4, .15, 1);

  await wait(reduceMotion() ? 40 : maxDur * 1000 + 40);
  if (stale(_ep)) return;
  if (collectPups() && (depth || 0) < 12) await settleBoard((depth || 0) + 1);
  if (stale(_ep)) return;
}
function collectPups() {

    const r = G.B.exits[c];
    if (r < 0) continue;
    const cell = G.B.cell[r][c];
    if (cell.tile && cell.tile.type === PUP && !cell.tile.dying) {
      cell.tile = null;
      got++;
      ring(r, c, PAL.sage);
      burst(r, c, PAL.sage, 14, 1.3);
      cellFloat(r, c, '♥', PAL.rose, 20);
      SFX.coin();
      const pet = activePet();
      if (pet) petVoice(pet, 1.2);
    }
  }
  if (got) {
    G.rescued += got;
    SAVE.stats.rescued = (SAVE.stats.rescued || 0) + got;
    const g = G.goals.find(x => x.kind === GK.RESCUE);
    if (g) {
      g.have += got;
      const stillNeeded = g.need - g.have;
      let onBoard = 0;
      eachCell(G.B, cell => { if (cell.tile && cell.tile.type === PUP) onBoard++; });
      const want = Math.min(PUPS_IN_PLAY, stillNeeded + 1) - onBoard;

/* ---------------- swapping ---------------- */
function comboOf(a, b) {

  if (A === SP.NONE && Bp === SP.NONE) return null;
  if (A === SP.RAIN && Bp === SP.RAIN) return 'rainrain';
  if (A === SP.RAIN || Bp === SP.RAIN) {
    const other = A === SP.RAIN ? b : a;
    if (other.sp === SP.NONE) return 'raincolor';
    return 'rainspecial';
  }
  if ((A === SP.ROW || A === SP.COL) && (Bp === SP.ROW || Bp === SP.COL)) return 'cross';
  if (A === SP.BOMB && Bp === SP.BOMB) return 'bigbomb';
  if (A === SP.BOMB || Bp === SP.BOMB) return 'rowbomb';
  return null;
}
async function runCombo(kind, a, b) {
  const _ep = levelEpoch();
  const B = G.B;

  const ta = ca.tile, tb = cb.tile;
  const keys = new Set();
  const at = b;                              // the destination cell is the epicentre
  G.shake = Math.max(G.shake, 9);
  if (kind === 'rainrain') {
    eachCell(B, (cell, r, c) => { if (cell.tile) keys.add(r + ':' + c); });
    SFX.rainbow(); G.flash = .9;
  } else if (kind === 'raincolor') {
    const other = ta.sp === SP.RAIN ? tb : ta;
    const type = other.type >= 0 ? other.type : commonType(B);
    tilesOfType(B, type).forEach(([r, c]) => keys.add(r + ':' + c));
    keys.add(a[0] + ':' + a[1]); keys.add(b[0] + ':' + b[1]);
    SFX.rainbow(); G.flash = .6;
  } else if (kind === 'rainspecial') {
    const other = ta.sp === SP.RAIN ? tb : ta;
    const type = commonType(B);
    tilesOfType(B, type).forEach(([r, c]) => {
      const t = B.cell[r][c].tile;
      if (t) { t.sp = other.sp === SP.BOMB ? SP.BOMB : (Math.random() < .5 ? SP.ROW : SP.COL); t.jiggle = 1; }
    });
    SFX.rainbow(); G.flash = .8;
    await wait(280);
    if (stale(_ep)) return;
    keys.add(a[0] + ':' + a[1]); keys.add(b[0] + ':' + b[1]);
    tilesOfType(B, type).forEach(([r, c]) => keys.add(r + ':' + c));
  } else if (kind === 'cross') {
    for (let i = 0; i < B.w; i++) keys.add(at[0] + ':' + i);
    for (let i = 0; i < B.h; i++) keys.add(i + ':' + at[1]);

    SFX.rocket();

    for (let d = -1; d <= 1; d++) {
      for (let i = 0; i < B.w; i++) keys.add((at[0] + d) + ':' + i);
      for (let i = 0; i < B.h; i++) keys.add(i + ':' + (at[1] + d));

    SFX.bomb();

    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) keys.add((at[0] + dr) + ':' + (at[1] + dc));

    SFX.bomb();

  if (tb) tb.sp = SP.NONE;

/* "Sniffs out tiles and turns them into what you actually need."

   It used to paint n random tiles the wanted colour and hope three of
   them landed in a line. On a quiet board they did not, and a grown

   ability in the game that could visibly do nothing at all.

   It lays a run of three first, chosen where it costs the fewest
   conversions, so the move always clears something; then it spends what
   is left of its budget beside tiles of that colour, which is where the
   next match is. Convertible means an open cell holding an ordinary

  eachCell(B, (cell, r, c) => {

function primaryGoalType() {

  if (g) return g.arg;

}

   pounced once for a card that said three. It fills up from the tiles
   that are actually there now, and only runs short when the board is. */
function pickSpots(type, n) {

  shuffleArr(list);

  if (out.length >= n) return out;
  const rest = [];
  eachCell(G.B, (cell, r, c) => {
    if (cell.hole || cell.crate > 0 || cell.ice > 0) return;
    if (!cell.tile || cell.tile.type < 0) return;
    if (cell.tile.type === type) return;              // already taken above

/* ---------------- win / lose ---------------- */
const isDaily = () => G.n === DAILY_LEVEL;

    if (g.kind === GK.BRAMBLE) return brambleCount(G.B) === 0;
    return (g.kind === GK.SCORE ? G.score : g.have) >= g.need;

/* A level whose only goal is a score is the one case where the goal and

function checkEnd() {

    G.over = true; finishWin(); return;

  FX.confetti(G.ox + G.boardW / 2, G.oy - 10, G.boardW, G.oy + G.boardH - G.cell * .2, 70);
  FX.punchZoom(1.2);

    eachCell(G.B, (cell, r, c) => { if (cell.tile && cell.tile.type >= 0 && cell.tile.sp === SP.NONE) spots.push([r, c]); });
    if (!spots.length) break;
    const take = Math.min(left, 3);
    for (let i = 0; i < take && spots.length; i++) {
      const [r, c] = spots.splice(Math.floor(Math.random() * spots.length), 1)[0];
      const t = G.B.cell[r][c].tile;
      t.sp = Math.random() < .35 ? SP.BOMB : (Math.random() < .5 ? SP.ROW : SP.COL);
      t.jiggle = 1;
    }

    G.moves = left;
    syncHud();
    await wait(140);
    if (stale(_ep)) return;
    const keys = new Set();
    eachCell(G.B, (cell, r, c) => { if (cell.tile && cell.tile.sp !== SP.NONE) keys.add(r + ':' + c); });
    await blastWaves(keys, 3, false);
    if (stale(_ep)) return;
    await settleBoard();
    if (stale(_ep)) return;
    await resolveBoard(null);
    if (stale(_ep)) return;
  }
  await wait(360);
  if (stale(_ep)) return;
  /* the board says the level was won. What that looks like is not
     the board's business, and used to be: this called straight into
     the results sheet in 60-ui.js. */
  EV.emit('won');
}
async function finishLose() {
  const _ep = levelEpoch();
  G.busy = true;
  SFX.lose();
  buzz(HAP.lose);
  const pet = activePet();
  if (pet) { G.petMood = 'sad'; G.petMoodT = 3; }
  await wait(600);
  if (stale(_ep)) return;
  EV.emit('lost');
}

/* ---------------- render ---------------- */
function gameLoopStart() {
  if (G.running) return;
  G.running = true;
  G.lastT = performance.now();
  const loop = t => {
    if (!G.running) return;
    const raw = (t - G.lastT) / 1000;
    const dt = Math.min(.05, raw);
    G.lastT = t;
    /* the real gap, before the clamp hides it: the effects layer scales
       itself down on a device that is not keeping up */
    FX.load(raw);
    renderGame(dt);
    G.raf = requestAnimationFrame(loop);
  };
  G.raf = requestAnimationFrame(loop);
}
function gameLoopStop() {
  G.running = false;
  if (G.raf) cancelAnimationFrame(G.raf);
  G.raf = null;
}

function renderGame(dt) {
  /* same guard as the room: a board sized against a zero-height layout
     would stay at the minimum cell size until something forced a resize */
  const wrap = $('#boardWrap');
  if (wrap && G.B) {
    const want = boardCellFor(wrap, G.B);
    if (want > 0 && want !== G.cell) layoutBoard();
  }
  const c = G.ctx;
  if (!c || !G.B) return;
  const B = G.B;
  FX.step(dt);
  c.save();
  c.clearRect(0, 0, G.cw, G.ch);
  /* the old shake counter feeds the trauma camera */
  if (G.shake > 0) { FX.shake(Math.min(.55, G.shake * .05)); G.shake = 0; }
  c.translate(G.cw / 2, G.ch / 2);
  camApply(c);
  c.translate(-G.cw / 2, -G.ch / 2);

  /* the tray the board sits in */
  drawTray(c, G.ox, G.oy, G.boardW, G.boardH, BOARD_PAD);

  /* cells */
  eachCell(B, (cell, r, c2) => {
    const x = cellX(c2) + G.cell / 2, y = cellY(r) + G.cell / 2;
    if (cell.hole) { drawHole(c, x, y, G.cell); return; }
    drawCellBed(c, x, y, G.cell - 3, cell, (r + c2) % 2 === 0);
    if (cell.mud > 0) {
      /* full cell, so it shows around the tile's rounded corners */
      drawBlocker(c, 'mud', x, y, G.cell, cell.mud);
    }
    if (cell.bram > 0) {
      drawBlocker(c, 'bram', x, y, G.cell, cell.bram);
    }
  });

  /* clip tiles to the board */
  c.save();
  rr(c, G.ox - 4, G.oy - 4, G.boardW + 8, G.boardH + 8, 16);
  c.clip();

  /* tiles */
  const drawT = [];
  eachCell(B, (cell, r, c2) => {
    if (cell.tile) { stepTile(cell.tile, dt); drawT.push({ t: cell.tile, cell, r, c: c2 }); }
  });
  drawT.sort((a, b2) => (a.t.dying ? 1 : 0) - (b2.t.dying ? 1 : 0));
  const tsec = performance.now() / 1000;
  const selKey = G.sel ? G.sel[0] + ':' + G.sel[1] : null;
  drawT.forEach(({ t, cell, r, c: cc }) => {
    /* an explosion nearby shoves the tile off its cell for a beat */
    const d = displace(t.x, t.y);
    const picked = selKey === r + ':' + cc;
    /* a resting board still breathes, a hair, out of phase per tile */
    const bob = (t.tw || t.dying) ? 0 : idleBob(t, tsec);
    const lift = picked ? .10 : 0;
    const px = G.ox + (t.x + d[0]) * G.cell + G.cell / 2;
    let py = G.oy + (t.y + d[1] + bob - lift) * G.cell + G.cell / 2;
    let sc = t.scale * (1 + d[2] * .25) * (picked ? 1.07 : 1);
    let sx = 1, sy = 1, rot = 0;
    let alpha = 1;
    if (t.dying > 0) {
      const k = clamp((t.dying - (t.dieDelay || 0)), 0, 1);
      sc = t.scale * popScale(k);
      alpha = popAlpha(k);
      /* it jumps. popScale() alone swells the tile in place, which is a
         balloon inflating; a hop off the floor with a tilt in it is a
         small animal being pleased with itself. Sine over the first
         two thirds, so it is back down before it fades out. */
      const hop = Math.sin(Math.min(1, k / .66) * Math.PI);
      py -= hop * G.cell * .22;
      rot = Math.sin(k * 9.2) * .10 * (1 - k);
    }
    if (t.jiggle > 0) {
      /* squash on impact, then wobble out — volume stays put, so it
         widens as it flattens instead of just getting smaller */
      const q = Math.sin(t.jiggle * 13) * .17 * t.jiggle;
      sx = 1 + q; sy = 1 - q;
    }
    if (sc <= .01 || alpha <= .01) return;
    /* the shadow it drops into its own cell, and further when lifted */
    if (!t.dying) {
      drawTileShadow(c, G.ox + (t.x + d[0]) * G.cell + G.cell / 2,
        G.oy + (t.y + d[1]) * G.cell + G.cell / 2, G.cell, picked ? 1 : 0);
    }
    c.save();
    c.globalAlpha = alpha;
    c.translate(px, py);
    if (rot) c.rotate(rot);
    c.scale(sc * sx, sc * sy);
    if (t.type === PUP) {
      /* a slot, not a breed: paintPup resolves through the cast now, so
         handing it a breed index shows whoever happens to stand in the
         slot with that number — the basket held a Siamese for a player
         walking a Pug */
      paintPup(c, G.cell * .94, activePet() ? castSlot(activePet().breed) : 0);
    } else {
      /* A tile that has just been matched grins and jumps before it
         goes. The board was a grid of identical polite smiles clearing
         in silence; this is the half-second where the thing you did
         lands, and it costs one more cached sprite per breed. */
      const sp = tileSprite(t.type, t.sp, G.cell * .90, SAVE.settings.marks,
        t.blinkT > 0 && !t.dying, t.dying > 0);
      const w = sp._w;
      c.drawImage(sp, -w / 2, -w / 2, w, w);
      if (t.dying > 0) {
        const dk = clamp(t.dying - (t.dieDelay || 0), 0, 1);
        if (dk < .4) {
          c.save();
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = (1 - dk / .4) * .75;
          c.drawImage(sp, -w / 2, -w / 2, w, w);
          c.restore();
        }
      } else if (t.sp !== SP.NONE) {
        drawTileFx(c, t.type, t.sp, G.cell * .90, tsec, t.id);
      }
    }
    c.restore();
    /* ice on top */
    if (cell.ice > 0) {
      drawBlocker(c, 'ice', cellX(cc) + G.cell / 2, cellY(r) + G.cell / 2, G.cell * .96);
    }
  });

  /* thorns lie over the tile they have grown across */
  eachCell(B, (cell, r, c2) => {
    if (cell.bram > 0 && cell.tile) {
      drawBlocker(c, 'bramOver', cellX(c2) + G.cell / 2, cellY(r) + G.cell / 2, G.cell * .96);
    }
  });

  /* muddy cells say so over the tile as well, or the layer is invisible */
  eachCell(B, (cell, r, c2) => {
    if (cell.mud > 0 && cell.tile) {
      drawBlocker(c, 'mudOver', cellX(c2) + G.cell / 2, cellY(r) + G.cell / 2, G.cell * .96, cell.mud);
    }
  });

  /* crates sit above everything in their cell */
  eachCell(B, (cell, r, c2) => {
    if (cell.crate > 0) {
      drawBlocker(c, 'crate', cellX(c2) + G.cell / 2, cellY(r) + G.cell / 2, G.cell * .96, cell.crate);
    }
    /* Molehills, and the number that makes them worth caring about.

       The mound is a cached sprite; the count is not, because it changes
       every move and is the entire point. It sits in a pale disc so it
       reads against turned earth, and it goes warm on the last move
       before something is pushed up — the one frame where a player
       should feel like doing something about it. */
    if (cell.mole > 0) {
      const x = cellX(c2) + G.cell / 2, y = cellY(r) + G.cell / 2;
      drawBlocker(c, 'mole', x, y, G.cell * .96, cell.mole);
      const left = cell.moleT;
      const soon = left <= 1;
      const rr = G.cell * .17;
      c.save();
      c.beginPath(); c.arc(x, y + G.cell * .22, rr, 0, Math.PI * 2);
      c.fillStyle = soon ? PAL.accent : rgba('#F6EADA', .92);
      c.fill();
      c.lineWidth = Math.max(1, G.cell * .022);
      c.strokeStyle = rgba('#3A2A18', soon ? .5 : .3); c.stroke();
      c.fillStyle = soon ? inkOn(PAL.accent) : '#3A2A18';
      c.font = '800 ' + Math.round(G.cell * .24) + 'px Grandstander, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(left), x, y + G.cell * .235);
      c.restore();
    }
  });

  /* selection + hint */
  if (G.sel) {
    const [r, c2] = G.sel;
    drawSelectRing(c, cellX(c2) + G.cell / 2, cellY(r) + G.cell / 2, G.cell, tsec, PAL.accent);
  }
  /* keyboard cursor: a dashed square that is clearly not the selection */
  if (G.keyMode && G.cursor) {
    const [r, c2] = G.cursor;
    c.save();
    c.strokeStyle = PAL.text;
    c.globalAlpha = .55 + Math.sin(tsec * 4) * .2;
    c.lineWidth = Math.max(2, G.cell * .05);
    c.setLineDash([G.cell * .18, G.cell * .12]);
    rr(c, cellX(c2) + 3, cellY(r) + 3, G.cell - 6, G.cell - 6, G.cell * .26);
    c.stroke();
    c.restore();
  }
  if (G.hint && !G.busy && !G.over) {
    G.hint.forEach(([r, c2]) => {
      drawHintRing(c, cellX(c2) + G.cell / 2, cellY(r) + G.cell / 2, G.cell, tsec, PAL.sage);
    });
  }
  if (G.armedFirst) {
    const [r, c2] = G.armedFirst;
    drawSelectRing(c, cellX(c2) + G.cell / 2, cellY(r) + G.cell / 2, G.cell, tsec, PAL.rose);
  }

  /* beams */
  G.beams = G.beams.filter(b => {
    b.life += dt;
    const k = b.life / b.max;
    if (k >= 1) return false;
    const a = Math.sin(k * Math.PI);
    c.save();
    c.globalAlpha = a * .8;
    const grad = b.dir === 'h'
      ? c.createLinearGradient(G.ox, 0, G.ox + G.boardW, 0)
      : c.createLinearGradient(0, G.oy, 0, G.oy + G.boardH);
    grad.addColorStop(0, rgba(PAL.accent, 0));
    grad.addColorStop(.5, '#FFFFFF');
    grad.addColorStop(1, rgba(PAL.accent, 0));
    c.fillStyle = grad;
    const thick = G.cell * (.2 + a * .5);
    if (b.dir === 'h') c.fillRect(G.ox, cellY(b.r) + G.cell / 2 - thick / 2, G.boardW, thick);
    else c.fillRect(cellX(b.c) + G.cell / 2 - thick / 2, G.oy, thick, G.boardH);
    c.restore();
    return true;
  });
  c.restore(); /* end clip */

  /* rings */
  G.rings = G.rings.filter(rg => {
    rg.life += dt;
    const k = rg.life / rg.max;
    if (k >= 1) return false;
    c.save();
    c.globalAlpha = (1 - k) * .8;
    c.strokeStyle = rg.col; c.lineWidth = G.cell * .12 * (1 - k) + 1.5;
    c.beginPath();
    c.arc(rg.x, rg.y, G.cell * (.25 + k * 1.1), 0, Math.PI * 2);
    c.stroke();
    c.restore();
    return true;
  });
  /* particles */
  G.particles = G.particles.filter(p => {
    p.life += dt;
    const k = p.life / p.max;
    if (k >= 1) return false;
    p.x += p.vx; p.y += p.vy;
    p.vy += G.cell * .012;
    p.vx *= .985;
    c.save();
    c.globalAlpha = 1 - k * k;
    c.fillStyle = p.col;
    if (p.shape === 'star') {
      c.translate(p.x, p.y); c.rotate(p.life * 7);
      c.fillRect(-p.size / 2, -p.size / 6, p.size, p.size / 3);
      c.fillRect(-p.size / 6, -p.size / 2, p.size / 3, p.size);
    } else {
      c.beginPath(); c.arc(p.x, p.y, p.size * (1 - k * .55), 0, Math.PI * 2); c.fill();
    }
    c.restore();
    return true;
  });
  /* the physics layer draws last: debris, sparks, floating numbers.
     One pass, not one per blend mode — the pool is scanned once and
     the composite flips per particle. */
  FX.draw(c);
  FX.drawBands(c);
  FX.drawText(c);

  /* the last few moves get warmer and start to breathe */
  if (!G.over && G.moves <= 3 && G.moves > 0) {
    const beat = (performance.now() / 1000) % 1.1;
    c.save();
    c.globalAlpha = .10 + .10 * Math.max(0, Math.sin(beat / 1.1 * Math.PI));
    const vg = c.createRadialGradient(G.cw / 2, G.ch / 2, Math.min(G.cw, G.ch) * .3,
      G.cw / 2, G.ch / 2, Math.max(G.cw, G.ch) * .7);
    vg.addColorStop(0, rgba(PAL.rose, 0));
    vg.addColorStop(1, rgba(PAL.rose, 1));
    c.fillStyle = vg;
    c.fillRect(0, 0, G.cw, G.ch);
    c.restore();
  }

  /* white flash on the big ones */
  if (G.flash > 0) {
    c.save();
    c.globalAlpha = G.flash * .5;
    c.fillStyle = '#FFFFFF';
    c.fillRect(0, 0, G.cw, G.ch);
    c.restore();
    G.flash = Math.max(0, G.flash - dt * 2.2);
  }
  c.restore();

  /* idle hint */
  if (!G.busy && !G.over) {
    G.hintT += dt;
    if (G.hintT > 5 && !G.hint) G.hint = bestHint();
  } else { G.hint = null; }

  drawCompanion(dt);
}

/* The best move on the board, not a move on the board.

   A player who has stopped for five seconds has stopped because they
   cannot see anything. Pointing them at a plain three while a five sits
   two rows down is worse than useless: it is the game telling them that
   what they could not find is all there was.

   Every legal swap is tried on the real board and put straight back —
   findMatches() does not mutate, and the swap is undone before anything
   else can see it. Scored by how much it clears, with a special worth
   more than its size and anything touching a goal worth more again.
   Sixty-odd swaps once, five seconds after the player went quiet. */
function hintScore(a, b) {
  const ca = G.B.cell[a[0]][a[1]], cb = G.B.cell[b[0]][b[1]];
  if (!ca || !cb || !ca.tile || !cb.tile) return -1;
  /* two specials together, or anything with a rainbow, beats any match */
  if (ca.tile.sp === SP.RAIN || cb.tile.sp === SP.RAIN) return 200;
  if (ca.tile.sp !== SP.NONE && cb.tile.sp !== SP.NONE) return 180;
  let best = 0, wanted = 0;
  const collect = G.goals.filter(g => g.kind === GK.COLLECT && g.have < g.need).map(g => g.arg);
  /* The swap happens on the live board, so putting it back is not
     optional and not conditional. Anything thrown in between would
     otherwise leave two tiles transposed with no move having been made. */
  swapTiles(G.B, a, b);
  try {
    findMatches(G.B).forEach(run => {
      if (run.len > best) best = run.len;
      run.cells.forEach(([r2, c2]) => {
        const cell = openCell(G.B, r2, c2);
        if (!cell) return;
        if (cell.mud) wanted += 3;
        if (cell.tile && collect.indexOf(cell.tile.type) >= 0) wanted += 1;
        /* a match beside a crate is what breaks the crate */
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(d => {
          const nb = openCell(G.B, r2 + d[0], c2 + d[1]);
          if (nb && nb.crate) wanted += 2;
        });
      });
    });
  } finally {
    swapTiles(G.B, a, b);
  }
  /* four and five in a row make specials, which are worth more than the
     one extra tile they clear */
  const shape = best >= 5 ? 40 : best >= 4 ? 18 : best;
  return shape + wanted;
}
function bestHint() {
  const moves = allMoves(G.B);
  if (!moves.length) return null;
  let best = null, bestScore = -1;
  moves.forEach(m => {
    const v = hintScore(m[0], m[1]);
    if (v > bestScore) { bestScore = v; best = m; }
  });
  return best;
}

/* the pet on the rail, watching */
function drawCompanion(dt) {
  const c = G.compCtx;
  const pet = activePet();
  if (!c || !pet) return;
  c.clearRect(0, 0, 50, 50);
  G.blinkT -= dt;
  if (G.blinkT < 0) { G.blink = 1; G.blinkT = rnd(2.2, 5.4); }
  if (G.blink > 0) G.blink = Math.max(0, G.blink - dt * 7);
  if (G.petMoodT > 0) G.petMoodT -= dt; else G.petMood = 'idle';
  const t = performance.now() / 1000;
  const spec = specOfPet(pet);
  const ready = G.charge >= 100;
  let bob = Math.sin(t * 2.1) * 1.1;
  let tilt = Math.sin(t * .7) * .045;
  let mouth = 'smile';
  if (G.petMood === 'happy' || ready) { bob = Math.abs(Math.sin(t * 7)) * -3.4; mouth = 'open'; }
  if (G.petMood === 'act') { bob = -4; mouth = 'open'; tilt = Math.sin(t * 22) * .18; }
  if (G.petMood === 'sad') { bob = 2; tilt = .16; }
  c.save();
  c.translate(25, 30 + bob);
  c.rotate(tilt);
  drawFace(c, spec, 28, {
    blink: G.petMood === 'sad' ? .55 : (1 - G.blink < .12 ? 1 : 0),
    mouth,
    eyeDir: [clamp(Math.sin(t * .9) * 1.4, -1, 1), G.petMood === 'sad' ? .6 : .25]
  });
  c.restore();
}

/* ---------------- input ---------------- */
function boardPos(ev) {
  const cv = $('#board');
  const rect = cv.getBoundingClientRect();
  const x = (ev.clientX - rect.left) - G.ox;
  const y = (ev.clientY - rect.top) - G.oy;
  const c = Math.floor(x / G.cell), r = Math.floor(y / G.cell);
  if (r < 0 || c < 0 || r >= G.B.h || c >= G.B.w) return null;
  return [r, c, x, y];
}
/* ============================================================
   Keyboard play

   The board is a canvas, so none of it is reachable by tab or readable
   by a screen reader on its own. This gives it a cursor, a spoken
   description of whatever the cursor is on, and a running commentary of
   moves left, score and goals.

   Arrows move · Enter/Space picks up · arrow then swaps · Escape drops
   H hint · P pet ability · S read the state out
   ============================================================ */

let sayTimer = null;
function say(text, assertive) {
  const el = $(assertive ? '#liveAssertive' : '#live');
  if (!el) return;
  /* the same string twice running is not re-announced unless it changes,
     so a space is toggled on the end to force it */
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => {
    el.textContent = (el.textContent === text) ? text + ' ' : text;
  }, 30);
}

/* what is in a cell, in words */
function describeCell(r, c) {
  const B = G.B;
  if (!B || r < 0 || c < 0 || r >= B.h || c >= B.w) return T('a11y_hole');
  const cell = B.cell[r][c];
  if (cell.hole) return T('a11y_hole');
  if (cell.crate > 0) return T('a11y_crate', { n: cell.crate });
  const t = cell.tile;
  let what;
  if (!t) what = T('a11y_empty');
  else if (t.type === PUP) what = T('a11y_basket');
  else if (t.sp === SP.RAIN) what = T('a11y_rainbow');
  else {
    what = breedName(t.type);
    if (t.sp === SP.ROW) what = T('a11y_rocket_h', { what });
    else if (t.sp === SP.COL) what = T('a11y_rocket_v', { what });
    else if (t.sp === SP.BOMB) what = T('a11y_bomb', { what });
  }
  const extra = [];
  if (cell.ice > 0) extra.push(T('a11y_ice'));
  if (cell.mud > 0) extra.push(T('a11y_mud', { n: cell.mud }));
  if (cell.bram > 0) extra.push(T('a11y_bramble'));
  if (cell.mole > 0) extra.push(T('a11y_mole', { n: cell.moleT }));
  return what + (extra.length ? ', ' + extra.join(', ') : '');
}
function sayCell(r, c) {
  if (!G.B) return;
  say(T('a11y_cell', {
    what: describeCell(r, c),
    r: r + 1, rows: G.B.h, c: c + 1, cols: G.B.w
  }));
}
function goalWords() {
  return G.goals.map(g => {
    let label;
    if (g.kind === GK.SCORE) label = T('g_score');
    else if (g.kind === GK.COLLECT) label = breedName(g.arg);
    else if (g.kind === GK.CRATE) label = T('goal_crate', { n: g.need });
    else if (g.kind === GK.MUD) label = T('goal_mud', { n: g.need });
    else if (g.kind === GK.BRAMBLE) label = T('goal_bramble', { n: g.need });
    else label = T('goal_rescue', { n: g.need });
    const have = g.kind === GK.SCORE ? G.score : g.have;
    return T('a11y_goal_line', { label, have: fmt(Math.min(have, g.need)), need: fmt(g.need) });
  }).join('. ');
}
function sayState(assertive) {
  say(T('a11y_state', { moves: G.moves, score: fmt(G.score), goals: goalWords() }), assertive);
}

/* the first open cell at or after a position, walking in one direction */
function nextOpen(r, c, dr, dc) {
  const B = G.B;
  for (let i = 0; i < Math.max(B.w, B.h); i++) {
    r += dr; c += dc;
    if (r < 0 || c < 0 || r >= B.h || c >= B.w) return null;
    if (openCell(B, r, c)) return [r, c];
  }
  return null;
}
function firstOpen() {
  const B = G.B;
  for (let r = 0; r < B.h; r++) for (let c = 0; c < B.w; c++) if (openCell(B, r, c)) return [r, c];
  return null;
}

function onBoardKey(ev) {
  if (!G.B || G.over) return;
  /* a sheet is over the board: the keys belong to it, not to us */
  if (sheetIsOpen()) return;
  const k = ev.key;
  const dirs = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
    w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1],
    W: [-1, 0], S: [1, 0], A: [0, -1], D: [0, 1]
  };

  /* keys that work whether or not a cursor is up */
  if (k === 'h' || k === 'H') {
    ev.preventDefault();
    const moves = allMoves(G.B);
    if (!moves.length) { say(T('g_shuffle')); return; }
    G.hint = pick(moves);
    G.hintT = 0;
    const [a] = G.hint;
    G.cursor = [a[0], a[1]];
    G.keyMode = true;
    sayCell(a[0], a[1]);
    return;
  }
  if (k === 'p' || k === 'P') {
    ev.preventDefault();
    if (G.charge >= 100) firePetAbility();
    else say(chargeHint(activePet()).replace(/<[^>]*>/g, ''));
    return;
  }
  if (k === 'S' && ev.shiftKey) { ev.preventDefault(); sayState(true); return; }
  if (k === '?' || (k === '/' && ev.shiftKey)) { ev.preventDefault(); keyboardHelp(); return; }

  if (!dirs[k] && k !== 'Enter' && k !== ' ' && k !== 'Escape' && k !== 'Spacebar') return;
  ev.preventDefault();
  if (G.busy) return;

  /* first keypress puts the cursor on the board */
  if (!G.cursor) {
    G.cursor = firstOpen();
    G.keyMode = true;
    if (G.cursor) sayCell(G.cursor[0], G.cursor[1]);
    return;
  }
  G.keyMode = true;
  const [cr, cc] = G.cursor;

  if (k === 'Escape') {
    if (G.sel) { G.sel = null; say(T('a11y_dropped')); SFX.tap(); }
    return;
  }
  if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
    const cell = openCell(G.B, cr, cc);
    if (!cell || !cell.tile) { SFX.bad(); return; }
    if (G.sel && G.sel[0] === cr && G.sel[1] === cc) {
      G.sel = null; say(T('a11y_dropped')); SFX.tap(); return;
    }
    if (G.sel) {                       /* second pick: swap if adjacent */
      const d = Math.abs(G.sel[0] - cr) + Math.abs(G.sel[1] - cc);
      if (d === 1) { attemptKeySwap(G.sel, [cr, cc]); return; }
    }
    if (cell.ice > 0 || cell.tile.type === PUP) { SFX.bad(); say(T('a11y_nomatch')); return; }
    G.sel = [cr, cc];
    SFX.select();
    say(T('a11y_picked', { what: describeCell(cr, cc) }));
    return;
  }

  const [dr, dc] = dirs[k];
  /* with a tile in hand an arrow means "swap that way" */
  if (G.sel && G.sel[0] === cr && G.sel[1] === cc) {
    const target = [cr + dr, cc + dc];
    if (!openCell(G.B, target[0], target[1])) { SFX.bad(); say(T('a11y_edge')); return; }
    attemptKeySwap([cr, cc], target);
    return;
  }
  const nxt = nextOpen(cr, cc, dr, dc);
  if (!nxt) { SFX.bad(); say(T('a11y_edge')); return; }
  G.cursor = nxt;
  SFX.tap();
  sayCell(nxt[0], nxt[1]);
}

async function attemptKeySwap(a, b) {
  const _ep = levelEpoch();
  const before = G.moves;
  G.cursor = [b[0], b[1]];
  await tryMove(a, b);
  if (stale(_ep)) return;
  G.sel = null;
  if (G.moves === before && !G.over) say(T('a11y_nomatch'));
  else if (!G.over) sayState();
}

function keyboardHelp() {
  const m = modal(
    '<h2>' + T('a11y_help_t') + '</h2>' +
    '<p style="text-align:left">' + T('a11y_help') + '</p>' +
    '<button class="btn primary wide" id="khOk">' + T('ok') + '</button>'
  );
  $('#khOk', m.el).addEventListener('click', m.close);
}

function bindBoard() {
  const cv = $('#board');
  let start = null, moved = false;

  const down = ev => {
    if (G.busy || G.over || !G.B) return;
    audioResume();
    const p = boardPos(ev);
    if (!p) return;
    /* capture keeps a drag alive if the finger leaves the canvas, but it
       throws if the pointer has already been released — and this is the
       first line of the handler, so an exception here would swallow the
       whole interaction */
    try { cv.setPointerCapture && cv.setPointerCapture(ev.pointerId); } catch (e) { /* no live pointer */ }
    start = { r: p[0], c: p[1], x: ev.clientX, y: ev.clientY };
    moved = false;
    G.hintT = 0; G.hint = null;

    if (G.armed === 'hammer') { useHammer(p[0], p[1]); start = null; return; }
    if (G.armed === 'swap') {
      if (!G.armedFirst) {
        if (openCell(G.B, p[0], p[1]) && G.B.cell[p[0]][p[1]].tile) { G.armedFirst = [p[0], p[1]]; SFX.select(); }
      } else {
        const a = G.armedFirst, b = [p[0], p[1]];
        if (a[0] === b[0] && a[1] === b[1]) { G.armedFirst = null; }
        else if (canSwap(G.B, a, b)) useFreeSwap(a, b);
        else SFX.bad();
      }
      start = null; return;
    }
    const cell = openCell(G.B, p[0], p[1]);
    if (!cell || !cell.tile) return;
    if (G.sel && (Math.abs(G.sel[0] - p[0]) + Math.abs(G.sel[1] - p[1])) === 1) {
      tryMove(G.sel, [p[0], p[1]]);
      start = null;
      return;
    }
    G.sel = [p[0], p[1]];
    SFX.tap();
  };
  const move = ev => {
    if (!start || G.busy || G.over) return;
    const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
    const th = Math.max(12, G.cell * .34);
    if (!moved && (Math.abs(dx) > th || Math.abs(dy) > th)) {
      moved = true;
      let b;
      if (Math.abs(dx) > Math.abs(dy)) b = [start.r, start.c + (dx > 0 ? 1 : -1)];
      else b = [start.r + (dy > 0 ? 1 : -1), start.c];
      if (openCell(G.B, b[0], b[1])) tryMove([start.r, start.c], b);
      else SFX.bad();
      start = null;
    }
  };
  const up = () => { start = null; };
  cv.addEventListener('keydown', onBoardKey);
  /* a pointer press hides the keyboard cursor again */
  cv.addEventListener('pointerdown', () => { G.keyMode = false; });
  cv.addEventListener('pointerdown', down);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  $('#companion').addEventListener('click', () => {
    audioResume();
    if (G.charge >= 100) firePetAbility();
    else { const p = activePet(); if (p) { petVoice(p, .95); toast(chargeHint(p), 'paw'); } }
  });
}

/* ===== 50-room.js ===== */
/* ============================================================
   50 — the room upstairs, and the lane outside
   ============================================================ */
const ROOM = {
  ctx: null, w: 0, h: 0, running: false, raf: null, lastT: 0,
  t: 0, state: 'idle', stateT: 0,
  px: .5, targetX: .5, walk: 0, facing: 1,
  bits: [], bubbleT: 0, snoreT: 0,
  idleT: 6, idleKind: null, idleLeft: 0, noticed: 0,
  /* where the finger is over the room, in the pet's own -1..1 frame,
     and how long it stays interesting after the finger lifts */
  look: null, lookT: 0, bound: false, heartT: 3
};

function roomLayout() {
  const cv = $('#room');
  const w = cv.parentElement.clientWidth;
  if (!w) return;
  const h = Math.round(clamp(w * .62, 180, 270));
  ROOM.w = w; ROOM.h = h;
  ROOM.ctx = fitCanvas(cv, w, h);
}
/* The pet follows your finger.

   This is the cheapest thing in the whole game per unit of alive. A
   drawn animal that tracks the pointer stops being a picture of an
   animal; the rig already had a gaze channel for it and nothing had
   ever fed it. Coordinates come in as a fraction of the canvas and
   leave in the -1..1 the eyes are drawn in, so the pet can look at a
   corner without its pupils leaving its head. */
function bindRoomLook() {
  if (ROOM.bound) return;
  const cv = $('#room');
  if (!cv) return;
  ROOM.bound = true;
  const at = ev => {
    const rect = cv.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const fx = (ev.clientX - rect.left) / rect.width;
    const fy = (ev.clientY - rect.top) / rect.height;
    /* the pet stands mid-floor; look is measured from there */
    ROOM.look = [clamp((fx - ROOM.px) * 2.4, -1, 1), clamp((fy - .62) * 2.2, -1, 1)];
    ROOM.lookT = 1.1;
  };
  cv.addEventListener('pointermove', at, { passive: true });
  cv.addEventListener('pointerdown', at, { passive: true });
  cv.addEventListener('pointerleave', () => { ROOM.lookT = .25; }, { passive: true });
}

function roomStart() {
  /* looking up when you walk in costs nothing and reads as alive */
  const pet = activePet();
  if (pet && !pet.asleep) ROOM.noticed = .7;
  bindRoomLook();
  if (ROOM.running) return;
  roomLayout();
  ROOM.running = true;
  ROOM.lastT = performance.now();
  const loop = t => {
    if (!ROOM.running) return;
    const dt = Math.min(.05, (t - ROOM.lastT) / 1000);
    ROOM.lastT = t;
    renderRoom(dt);
    ROOM.raf = requestAnimationFrame(loop);
  };
  ROOM.raf = requestAnimationFrame(loop);
}
function roomStop() {
  ROOM.running = false;
  if (ROOM.raf) cancelAnimationFrame(ROOM.raf);
  ROOM.raf = null;
}
function roomAct(state, dur) {
  ROOM.state = state;
  ROOM.idleKind = null; ROOM.idleLeft = 0; ROOM.idleT = rnd(4, 9);
  ROOM.stateT = dur || 2.6;
  ROOM.bits = [];
}
function roomBit(x, y, kind, col) {
  ROOM.bits.push({ x, y, vx: rnd(-14, 14), vy: rnd(-40, -18), life: 0, max: rnd(1, 1.7), kind, col, rot: rnd(-.4, .4) });
}

function renderRoom(dt) {
  /* If the canvas was measured while the page had no layout — a hidden
     tab, a pane that had not opened yet — it would stay blank forever.
     Re-measure whenever the parent's width no longer matches. */
  const cv = $('#room');
  if (cv && cv.parentElement) {
    const want = cv.parentElement.clientWidth;
    if (want > 0 && (!ROOM.ctx || Math.abs(want - ROOM.w) > 1)) roomLayout();
  }
  const c = ROOM.ctx, W = ROOM.w, H = ROOM.h;
  if (!c || W <= 0 || H <= 0) return;
  const pet = activePet();
  /* A NaN here would spread into every sine below, and canvas ignores a
     NaN transform without complaining, so the room would keep drawing —
     just with the pet stuck in the corner. Clamp the step, heal a clock
     that has already been spoiled. */
  dt = (typeof dt === 'number' && isFinite(dt)) ? clamp(dt, 0, .05) : 1 / 60;
  if (!isFinite(ROOM.t)) ROOM.t = 0;
  ROOM.t += dt;
  const floorY = H * .70;

  /* wall, window, floor, furniture and the light in the room all
     come from the scene layer, so the art stays in one place */
  c.clearRect(0, 0, W, H);
  drawRoom(c, W, H, {
    t: ROOM.t,
    theme: SAVE.room.theme,
    placed: SAVE.room.placed,
    floorRatio: .70
  });

  /* the bowl */
  const bowlX = W * .18, bowlY = floorY + (H - floorY) * .48;
  drawBowl(c, bowlX, bowlY, W * .075, ROOM.state === 'eat');

  /* the pet */
  if (pet) {
    /* One mood, read once, used by everything below. It used to be read
       inside the idle branch only, which is why the pet's face never
       knew how it felt: the mood decided which idle behaviour to pick
       and then went out of scope. */
    const mood = moodOf(pet);

    /* The rig carries the slow, involuntary things — breath, a blink
       that actually closes, a tail that swings on its own weight, eyes
       that go where they are looking. It has existed in the scene layer
       since the room was written and was never once stepped: drawRoom
       draws a live pet only when handed one, and the room draws its own,
       so petRig, rigStep and every mood ornament sat unreachable. The
       room kept its own single-frame blink and two sine waves instead.
       The state machine below is the room's and stays the room's; what
       the animal does without deciding to comes from here. */
    if (ROOM.lookT > 0) ROOM.lookT -= dt;
    const rig = rigStep(petRig(pet), dt, {
      mood,
      look: (ROOM.lookT > 0 && ROOM.look) ? ROOM.look : null
    });

    /* wander */
    /* something to do between wanders: which options depend on the
       animal and on how it is feeling */
    if (ROOM.state === 'idle' && !pet.asleep) {
      if (ROOM.idleLeft > 0) {
        ROOM.idleLeft -= dt;
        if (ROOM.idleLeft <= 0) ROOM.idleKind = null;
      } else {
        ROOM.idleT -= dt;
        if (ROOM.idleT <= 0) {
          ROOM.idleT = rnd(5, 11);
          const cat = petBreed(pet).species === 'cat';
          const mood = moodOf(pet);
          const options = cat ? ['groom', 'stretch', 'stare'] : ['stretch', 'shake', 'stare'];
          if (pet.clean < 55 && cat) options.push('groom', 'groom');
          if (pet.energy < 40) options.push('stretch');
          if (mood === 'bored' || mood === 'lonely') options.push('stare', 'stare');
          ROOM.idleKind = pick(options);
          ROOM.idleLeft = ROOM.idleKind === 'stare' ? rnd(1.6, 3) : rnd(1.4, 2.2);
          if (ROOM.idleKind === 'shake' && Math.random() < .4) petVoice(pet, 1.05);
        }
      }
    } else { ROOM.idleKind = null; ROOM.idleLeft = 0; }

    if (ROOM.state === 'idle' && !pet.asleep && !ROOM.idleKind) {
      ROOM.walk -= dt;
      if (ROOM.walk <= 0) { ROOM.targetX = rnd(.24, .76); ROOM.walk = rnd(3.5, 8); }
      const d = ROOM.targetX - ROOM.px;
      if (Math.abs(d) > .006) { ROOM.px += Math.sign(d) * Math.min(Math.abs(d), dt * .13); ROOM.facing = Math.sign(d) || 1; }
    }
    if (ROOM.state === 'eat') ROOM.px += (0.24 - ROOM.px) * dt * 3;
    /* drawBody builds the animal to its stage, so hand over full size */
    const scale = H * .30;
    const gx = W * ROOM.px;
    /* drawBody hangs about .92 of its scale below the origin, so
       put the feet on the floor and work the origin back up */
    const gy = floorY + (H - floorY) * .58 - scale * .92;

    let bob = Math.sin(ROOM.t * 2) * .012;
    /* the eyes are drawn from a 0..1 lid, not a flag: a blink that
       snaps between open and shut is the difference between a drawing
       and a face */
    let tilt = 0, mouth = 'smile', blink = rig.blink;
    const moving = ROOM.state === 'idle' && Math.abs(ROOM.targetX - ROOM.px) > .006 && !pet.asleep;
    if (moving) bob = Math.abs(Math.sin(ROOM.t * 9)) * .04;

    if (pet.asleep) {
      blink = 1; bob = Math.sin(ROOM.t * 1.1) * .022; tilt = .2;
      ROOM.snoreT -= dt;
      if (ROOM.snoreT <= 0) { ROOM.snoreT = 2.6; roomBit(gx + scale * .3, gy - scale * .5, 'z', PAL.textDim); if (Math.random() < .5) SFX.snore(); }
    } else if (ROOM.state === 'eat') {
      mouth = Math.sin(ROOM.t * 16) > 0 ? 'open' : 'smile';
      bob = Math.sin(ROOM.t * 16) * .03; tilt = .12;
      /* per second, not per frame: a probability rolled once a frame is
         a different animal on a 120Hz phone than on a 60Hz one, and
         these were written against sixty. Same rate on any display. */
      if (Math.random() < 10.8 * dt) roomBit(bowlX + rnd(-8, 8), bowlY - 6, 'crumb', '#B5763F');
    } else if (ROOM.state === 'play') {
      bob = -Math.abs(Math.sin(ROOM.t * 11)) * .1;
      mouth = 'open';
      tilt = Math.sin(ROOM.t * 11) * .12;
    } else if (ROOM.state === 'wash') {
      bob = Math.sin(ROOM.t * 5) * .02;
      blink = 1;
      ROOM.bubbleT -= dt;
      if (ROOM.bubbleT <= 0) { ROOM.bubbleT = .09; roomBit(gx + rnd(-scale * .4, scale * .4), gy - rnd(0, scale * .6), 'bubble', '#BFE4F5'); }
    } else if (ROOM.state === 'pet') {
      mouth = 'smile'; blink = 1; tilt = Math.sin(ROOM.t * 3) * .1;
      if (Math.random() < 7.2 * dt) roomBit(gx + rnd(-18, 18), gy - scale * .7, 'heart', PAL.rose);
    } else if (ROOM.state === 'happy') {
      bob = -Math.abs(Math.sin(ROOM.t * 10)) * .12; mouth = 'open';
    } else if (ROOM.idleKind === 'groom') {
      /* a paw comes up and the head follows it round */
      const k = ROOM.t * 7;
      tilt = .34 + Math.sin(k) * .16;
      bob = Math.sin(k) * .014;
      blink = 1;
    } else if (ROOM.idleKind === 'stretch') {
      /* front end down, back end up, then back to normal */
      const k = clamp(1 - ROOM.idleLeft / 1.8, 0, 1);
      const arc = Math.sin(k * Math.PI);
      bob = arc * .05;
      tilt = arc * -.22;
      mouth = arc > .55 ? 'open' : 'smile';
      blink = arc > .5 ? 1 : blink;
    } else if (ROOM.idleKind === 'shake') {
      const k = ROOM.t * 26;
      tilt = Math.sin(k) * .13;
      bob = Math.abs(Math.sin(k * .5)) * .02;
      mouth = 'open';
    } else if (ROOM.idleKind === 'stare') {
      /* looks straight out of the screen at you */
      bob = Math.sin(ROOM.t * 1.6) * .008;
      tilt = Math.sin(ROOM.t * .5) * .05;
    }

    /* a beat of attention when you come back to the room */
    if (ROOM.noticed > 0) {
      ROOM.noticed -= dt;
      const k = clamp(ROOM.noticed / .7, 0, 1);
      bob -= Math.sin(k * Math.PI) * .05;
      tilt += Math.sin(k * Math.PI) * .1 * ROOM.facing;
      mouth = 'open';
    }

    c.save();
    c.translate(gx, gy + bob * scale);
    c.scale(ROOM.facing, 1);
    const spec = specOfPet(pet);
    /* the shape of the animal itself, for the one behaviour that needs
       more than a head tilt to read */
    if (ROOM.idleKind === 'stretch') {
      const base = STAGE_BUILD[clamp(petStageIdx(pet), 0, STAGE_BUILD.length - 1)];
      const arc = Math.sin(clamp(1 - ROOM.idleLeft / 1.8, 0, 1) * Math.PI);
      spec.build = {
        k: base.k,
        sx: base.sx * (1 + arc * .10),
        sy: base.sy * (1 - arc * .13),
        head: base.head
      };
    }
    /* Where the eyes go, in order of who has the strongest claim:
       something the room is deliberately doing, then your finger, then
       the rig's own wandering. Walking still pulls the gaze along the
       direction of travel, because an animal looks where it is going. */
    let eyeDir;
    if (ROOM.idleKind === 'stare' || ROOM.noticed > 0) eyeDir = [0, -.15];
    else if (pet.asleep) eyeDir = [0, .4];
    else if (ROOM.lookT > 0 && ROOM.look) eyeDir = [rig.gaze[0] * ROOM.facing, rig.gaze[1]];
    else if (moving) eyeDir = [clamp((ROOM.targetX - ROOM.px) * 6, -1, 1) * ROOM.facing, 0];
    else eyeDir = [rig.gaze[0] * ROOM.facing, rig.gaze[1]];

    drawBody(c, spec, scale, {
      blink, mouth, headTilt: tilt * ROOM.facing,
      /* the ears already know how it feels; so does everything else on
         this screen, and they were the last part still deadpan */
      mood,
      /* a moving animal breathes with its steps, a still one with the
         rig; asleep the rig already deepens it */
      breath: moving ? Math.sin(ROOM.t * 4.5) : rig.breath,
      tail: (moving || ROOM.state === 'play')
        ? Math.sin(ROOM.t * 9)
        : rig.tail,
      eyeDir
    });
    c.restore();

    /* How it feels, without reading anything.

       The mood line under the care buttons was the only place the pet's
       state was ever stated, which made the animal itself decorative:
       starving and content looked identical. These are the scene
       layer's own ornaments, drawn at last. */
    if (!pet.asleep) {
      const ox = gx + scale * .52 * ROOM.facing, oy = gy - scale * .12;
      if (mood === 'hungry') drawThought(c, ox, oy, scale * .26, 'bowl');
      else if (mood === 'bored') drawThought(c, ox, oy, scale * .26, 'ball');
      else if (mood === 'lonely') drawThought(c, ox, oy, scale * .26, 'heart');
      else if (mood === 'dirty') { c.save(); c.translate(gx, gy); drawGrime(c, scale, ROOM.t, spec); c.restore(); }
      else if (mood === 'happy') {
        /* A timer, not a threshold on a sine.

           `Math.sin(t * .8) > .985` reads like "every so often" and is
           not: the sine stays above that line for about four tenths of
           a second, which at sixty frames is twenty-six hearts at once,
           every eight seconds. It rendered as a red smear over the
           pet's head. The scene layer's own copy of this line has the
           same fault. A contented animal gives off one heart at a time.

           An ambient heart is also not the burst you get for stroking
           the animal: it stays near the pet and goes, rather than
           climbing the wall and reading as wallpaper. */
        ROOM.heartT -= dt;
        if (ROOM.heartT <= 0) {
          ROOM.heartT = rnd(2.4, 4.6);
          ROOM.bits.push({
            x: gx + rnd(-10, 10), y: gy - scale * .35, vx: rnd(-6, 6), vy: rnd(-20, -11),
            life: 0, max: rnd(.8, 1.1), kind: 'heart', col: PAL.rose, rot: rnd(-.3, .3)
          });
        }
      }
    }

    /* the bouncing toy */
    if (ROOM.state === 'play') {
      const bestToy = bestOwnedToy();
      const bx = gx + Math.sin(ROOM.t * 5) * scale * .8;
      const by = gy - Math.abs(Math.sin(ROOM.t * 11)) * scale * .8;
      c.save(); c.translate(bx, by); c.rotate(ROOM.t * 4);
      paintGood(c, bestToy ? bestToy.art : 'tennis', scale * .55);
      c.restore();
    }
  }

  /* floating bits */
  ROOM.bits = ROOM.bits.filter(b => {
    b.life += dt;
    const k = b.life / b.max;
    if (k >= 1) return false;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.kind === 'crumb') b.vy += 120 * dt; else b.vy += 6 * dt;
    c.save();
    c.globalAlpha = 1 - k * k;
    c.translate(b.x, b.y);
    if (b.kind === 'heart') { c.rotate(b.rot); drawPip(c, 'heart', 0, 0, 7, b.col); }
    else if (b.kind === 'z') {
      c.fillStyle = b.col; c.font = '800 15px Grandstander, sans-serif';
      c.fillText('z', 0, 0);
    } else if (b.kind === 'bubble') {
      c.strokeStyle = rgba('#BFE4F5', .9); c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, 0, 4 + k * 5, 0, Math.PI * 2); c.stroke();
      c.fillStyle = rgba('#FFFFFF', .3); c.fill();
    } else {
      c.fillStyle = b.col; c.beginPath(); c.arc(0, 0, 2.4, 0, Math.PI * 2); c.fill();
    }
    c.restore();
    return true;
  });

  if (ROOM.stateT > 0) {
    ROOM.stateT -= dt;
    if (ROOM.stateT <= 0) ROOM.state = 'idle';
  }
}

function drawBowl(c, x, y, r, active) {
  c.save();
  c.fillStyle = rgba('#2A1E12', PAL.dark ? .3 : .15);
  ellipse(c, x, y + r * .5, r * 1.1, r * .22); c.fill();
  c.fillStyle = '#D2536A';
  c.beginPath();
  c.moveTo(x - r, y - r * .3);
  c.quadraticCurveTo(x - r * .95, y + r * .5, x, y + r * .5);
  c.quadraticCurveTo(x + r * .95, y + r * .5, x + r, y - r * .3);
  c.closePath(); c.fill();
  c.fillStyle = '#B04256';
  ellipse(c, x, y - r * .3, r, r * .3); c.fill();
  const pet = activePet();
  const fed = pet && pet.food > 45;
  if (fed || active) {
    c.fillStyle = '#B5763F';
    ellipse(c, x, y - r * .3, r * .72, r * .2); c.fill();
    c.fillStyle = '#8C5A2E';
    for (let i = 0; i < 4; i++) ellipse(c, x - r * .4 + i * r * .27, y - r * .34, r * .11, r * .07), c.fill();
  }
  c.fillStyle = rgba('#FFFFFF', .3);
  ellipse(c, x - r * .5, y, r * .16, r * .1, -.5); c.fill();
  c.restore();
}

function bestOwnedToy() {
  let best = null;
  TOYS.forEach(t => { if (SAVE.toys[t.id] && (!best || t.joy > best.joy)) best = t; });
  return best;
}

/* ============================================================
   The lane — a level map you scroll
   ============================================================ */
const MAP = { ctx: null, w: 0, h: 0, nodes: [], scrolled: false };

function mapLayout() {
  const cv = $('#mapCanvas');
  const wrap = $('#mapWrap');
  const spacer = $('#mapSpacer');
  const w = wrap.clientWidth;
  if (!w) return;
  const top = Math.max(SAVE.reached + 5, 12);
  const rowH = 94;
  const total = top * rowH + 120;
  MAP.w = w;
  MAP.total = total;                      /* the whole lane, in css px */
  MAP.view = Math.max(1, wrap.clientHeight);
  MAP.h = MAP.view;                       /* the canvas is only this tall */
  spacer.style.height = total + 'px';
  MAP.ctx = fitCanvas(cv, w, MAP.view);
  MAP.nodes = [];
  for (let i = 1; i <= top; i++) {
    const idx = top - i;                   /* level 1 at the bottom */
    const y = 70 + idx * rowH;
    const x = w / 2 + Math.sin(i * .82) * (w * .26);
    MAP.nodes.push({ n: i, x, y });
  }
  drawMap();
}

function drawMap() {
  const c = MAP.ctx, W = MAP.w, H = MAP.h;
  if (!c) return;
  const wrap = $('#mapWrap');
  const off = wrap ? wrap.scrollTop : 0;
  MAP.off = off;
  c.save();
  c.clearRect(0, 0, W, H);
  c.translate(0, -off);
  /* ---- the ground the lane runs over ---- */
  const ph = roomPhase(PAL.dark);
  const sky = skyColours(ph);
  const total = MAP.total || H;
  const grad = c.createLinearGradient(0, 0, 0, total);
  grad.addColorStop(0, PAL.dark ? '#1A2430' : mix(sky[2], '#C7D8A8', .5));
  grad.addColorStop(.14, PAL.dark ? '#20301F' : '#B7CE95');
  grad.addColorStop(1, PAL.dark ? '#1B2A1B' : '#A8C489');
  c.fillStyle = grad;
  c.fillRect(0, 0, W, total);

  /* grass, seeded so it never crawls between frames */
  c.save();
  c.globalAlpha = PAL.dark ? .18 : .26;
  c.strokeStyle = PAL.dark ? '#4A6B48' : '#8FAE6E';
  c.lineWidth = 1.6; c.lineCap = 'round';
  const rr2 = mulberry(99);
  for (let i = 0; i < 420; i++) {
    const x = rr2() * W, y = rr2() * total, len = 4 + rr2() * 7;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + (rr2() - .5) * 4, y - len);
    c.stroke();
  }
  c.restore();

  /* Patches, so the field is a field. A single flat green with a few
     tick marks on it is a texture, not a place, and it left the whole
     side of the screen the lane does not use reading as blank paper. */
  c.save();
  const pr = mulberry(3301);
  for (let i = 0; i < Math.ceil(total / 90) + 6; i++) {
    const x = pr() * W, y = pr() * total;
    const rx = 46 + pr() * 78, ry = 26 + pr() * 40;
    c.globalAlpha = .07 + pr() * .07;
    c.fillStyle = pr() > .45
      ? (PAL.dark ? '#2C4430' : '#8FB673')
      : (PAL.dark ? '#16241A' : '#CBDDA9');
    ellipse(c, x, y, rx, ry); c.fill();
  }
  c.globalAlpha = 1;
  /* clover and daisies, in clumps because that is how they grow */
  c.globalAlpha = .72;
  for (let i = 0; i < Math.ceil(total / 260) + 2; i++) {
    const cx2 = pr() * W, cy2 = pr() * total;
    const petal = pr() > .5 ? (PAL.dark ? '#9BA9C0' : '#EFE4C4') : (PAL.dark ? '#8F82AA' : '#E5CB84');
    for (let k = 0; k < 3 + (pr() * 3 | 0); k++) {
      const x = cx2 + (pr() - .5) * 46, y = cy2 + (pr() - .5) * 34;
      c.fillStyle = PAL.dark ? '#3E5C3C' : '#84A867';
      c.fillRect(x - .4, y, 1, 3.2);
      c.fillStyle = petal;
      ellipse(c, x, y - .8, 1.4, 1.4); c.fill();
    }
  }
  c.globalAlpha = 1;
  c.restore();

  /* ---- the road ---- */
  const laneOrder = MAP.nodes.slice().reverse();
  const lanePath = () => {
    c.beginPath();
    laneOrder.forEach((n, i) => {
      if (!i) { c.moveTo(n.x, n.y + 90); c.lineTo(n.x, n.y); return; }
      const prev = laneOrder[i - 1];
      const my = lerp(prev.y, n.y, .5);
      c.bezierCurveTo(prev.x, my, n.x, my, n.x, n.y);
    });
    const last = laneOrder[laneOrder.length - 1];
    if (last) c.lineTo(last.x, last.y - 70);
    c.stroke();
  };
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = PAL.dark ? '#2F3F2C' : '#C7D8A8';
  c.lineWidth = 46; lanePath();
  c.strokeStyle = PAL.dark ? '#5C5142' : '#E8D8B6';
  c.lineWidth = 32; lanePath();
  c.strokeStyle = rgba(PAL.dark ? '#3E362B' : '#CBB68F', .75);
  c.lineWidth = 2.4; c.setLineDash([7, 13]); lanePath();
  c.setLineDash([]);
  c.restore();

  /* ---- what stands beside the road ---- */
  const warmth = lampStrength(ph);
  /* Things stand at a distance that says what they are. A lamppost
     lights the road, so it stands at the kerb; a hedge follows it; a
     cottage is set back off it. Dropped at one arbitrary distance they
     all read as clip art floating in a field. */
  const KERB = 23;
  /* An honest random picks the same thing three times in a row often
     enough to notice, and three lampposts in a row is the one thing a
     lane is never going to have. Each node takes the next kind that is
     not one of the last two. */
  let lastKinds = [];
  MAP.nodes.forEach(n => {
    const r = mulberry(n.n * 7717);
    const side = (n.n % 2) ? 1 : -1;
    let kind = Math.floor(r() * 5);
    for (let g = 0; g < 5 && lastKinds.indexOf(kind) >= 0; g++) kind = (kind + 1) % 5;
    lastKinds.push(kind); if (lastKinds.length > 2) lastKinds.shift();
    /* clamped by the prop's own half width, or a cottage set near the
       edge hangs half of itself off the screen */
    const at = (d, half) => clamp(n.x + side * d, (half || 20) + 6, W - (half || 20) - 6);
    const y = n.y + 16;
    /* The end of a block gets a gate on the verge instead of whatever
       the roll said. It is the one place on this lane where something
       happens, and the map used to mark it with a ring around the node
       and nothing in the world. It stands open once the level behind it
       is cleared. */
    if (typeof isGate === 'function' && isGate(n.n)) {
      drawGateway(c, at(KERB + 52, 34), y + 8, 64, SAVE.stars[n.n] > 0);
      if (r() > .45) drawBush(c, clamp(n.x - side * (KERB + 20 + r() * 40), 24, W - 24), y + 22, 9 + r() * 6);
      return;
    }
    if (kind === 0) drawTree(c, at(KERB + 34 + r() * 30, 26), y + 6, 28 + r() * 18, n.n * .7);
    else if (kind === 1) drawCottage(c, at(KERB + 62 + r() * 34, 30), y, 38 + r() * 14, n.n);
    else if (kind === 2) {
      /* a run of fence along the verge, not one panel in the middle of nowhere */
      const fx = at(KERB + 12, 20);
      for (let k = -1; k <= 1; k++) drawFence(c, fx, y + k * 30, 34);
    } else if (kind === 3) drawLampPost(c, at(KERB + 6, 12), y, 46, warmth, n.n * .9);
    else {
      /* bushes come in threes, tucked into the verge */
      const bx = at(KERB + 16 + r() * 18, 26);
      drawBush(c, bx, y, 17 + r() * 8);
      drawBush(c, bx + side * 17, y + 9, 12 + r() * 6);
      drawBush(c, bx - side * 13, y + 12, 10 + r() * 5);
    }
    /* whatever is on one side, put something small on the other, so the
       lane is not bare down one flank for a whole screen at a time */
    if (r() > .45) drawBush(c, clamp(n.x - side * (KERB + 20 + r() * 40), 24, W - 24), y + 22, 9 + r() * 6);
  });

  /* paw prints between nodes */
  c.save();
  c.globalAlpha = .3;
  const rev = MAP.nodes.slice().reverse();
  for (let i = 0; i < rev.length - 1; i++) {
    const a = rev[i], b = rev[i + 1];
    for (let k = 1; k < 4; k++) {
      const t = k / 4;
      const x = lerp(a.x, b.x, t) + (k % 2 ? 9 : -9);
      const y = lerp(a.y, b.y, t);
      c.save(); c.translate(x, y); c.rotate(Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2);
      c.fillStyle = PAL.textDim;
      ellipse(c, 0, 2.5, 3.4, 4.4); c.fill();
      [-1, 1].forEach(s2 => { ellipse(c, s2 * 3.2, -2.6, 1.5, 2); c.fill(); });
      [-1, 1].forEach(s2 => { ellipse(c, s2 * 1.1, -4.4, 1.5, 2); c.fill(); });
      c.restore();
    }
  }
  c.restore();

  MAP.nodes.forEach(n => {
    if (n.y < off - 90 || n.y > off + H + 90) return;   /* off screen */
    drawMapNode(c, n);
  });

  /* header at the top of the scroll */
  c.save();
  c.textAlign = 'center';
  c.fillStyle = PAL.textDim;
  c.font = '700 12px Karla, sans-serif';
  c.fillText(LANG === 'tr' ? 'YUKARISI HENÜZ İNŞA EDİLMEDİ' : 'THE LANE KEEPS GOING', W / 2, 34);
  c.restore();
  c.restore();                            /* undo the scroll translate */
}
function drawMapNode(c, n) {
  const gate = typeof isGate === 'function' && isGate(n.n);
  const cleared = SAVE.stars[n.n] > 0;
  const unlocked = n.n <= SAVE.reached;
  const current = n.n === SAVE.reached;
  const R = current ? 29 : 24;
  c.save();
  /* shadow */
  c.fillStyle = rgba('#2A1E12', PAL.dark ? .45 : .18);
  ellipse(c, n.x, n.y + R * .5, R * .9, R * .3); c.fill();
  /* body */
  let fill1, fill2, txt;
  if (!unlocked) { fill1 = PAL.surface3; fill2 = shade(PAL.surface3, -.14); txt = PAL.textDim; }
  else if (cleared) { fill1 = mix(PAL.sage, '#FFFFFF', .25); fill2 = PAL.sage; txt = inkOn(PAL.sage); }
  else { fill1 = mix(PAL.accent, '#FFFFFF', .3); fill2 = PAL.accent; txt = inkOn(PAL.accent); }
  const g = c.createLinearGradient(0, n.y - R, 0, n.y + R);
  g.addColorStop(0, fill1); g.addColorStop(1, fill2);
  c.fillStyle = g;
  ellipse(c, n.x, n.y, R, R); c.fill();
  c.strokeStyle = rgba('#FFFFFF', .5); c.lineWidth = 2.4;
  ellipse(c, n.x, n.y - 1, R - 2, R - 2); c.stroke();
  /* The gate at the end of a block wears a ring of its own, so it can be
     seen coming from four levels away — which is the whole point of
     putting one there. */
  if (gate && unlocked && !cleared) {
    c.save();
    c.strokeStyle = PAL.rose; c.lineWidth = 2.6;
    c.setLineDash([5, 4]);
    ellipse(c, n.x, n.y, R + 4, R + 4); c.stroke();
    c.restore();
  } else if (gate && cleared) {
    c.save();
    c.strokeStyle = rgba(PAL.rose, .5); c.lineWidth = 2;
    ellipse(c, n.x, n.y, R + 4, R + 4); c.stroke();
    c.restore();
  }
  if (current) {
    c.strokeStyle = PAL.accent; c.lineWidth = 3;
    c.globalAlpha = .35 + (Math.sin(performance.now() / 380) + 1) / 2 * .5;
    ellipse(c, n.x, n.y, R + 7, R + 7); c.stroke();
    c.globalAlpha = 1;
  }
  /* label */
  if (!unlocked) {
    c.save();
    c.translate(n.x - 9, n.y - 9);
    c.scale(.75, .75);
    c.fillStyle = txt;
    c.fillRect(2, 12, 20, 13);
    c.strokeStyle = txt; c.lineWidth = 2.6;
    c.beginPath(); c.arc(12, 12, 6, Math.PI, 0); c.stroke();
    c.restore();
  } else {
    c.fillStyle = txt;
    c.font = '800 ' + (current ? 19 : 16) + 'px Grandstander, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(n.n, n.x, n.y + 1);
  }
  /* Every fifth level pays two treats the first time it is cleared, and
     nothing said so. Shown until it has been paid. */
  if (unlocked && !cleared && n.n % 5 === 0) {
    const bx = n.x + R * .78, by = n.y - R * .78, br = R * .46;
    c.fillStyle = rgba('#2A1E12', PAL.dark ? .5 : .25);
    ellipse(c, bx, by + R * .07, br, br); c.fill();
    c.fillStyle = PAL.surface;
    ellipse(c, bx, by, br, br); c.fill();
    c.strokeStyle = rgba(PAL.accent, .9); c.lineWidth = R * .075;
    ellipse(c, bx, by, br, br); c.stroke();
    drawTreatPip(c, bx, by, R * .24);
  }

  /* stars */
  if (cleared) {
    const s = SAVE.stars[n.n];
    const PIP = new Path2D('m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5-4.7-4.6 6.5-.9z');
    for (let i = 0; i < 3; i++) {
      /* a shallow crown across the top of the node, not a wide scatter */
      const a = -Math.PI * .66 + i * Math.PI * .16;
      const won = i < s;
      const rad = R + 7 + (i === 1 ? 1.5 : 0);          /* middle one rides higher */
      const sx = n.x + Math.cos(a) * rad, sy = n.y + Math.sin(a) * rad;
      c.save();
      c.translate(sx, sy);
      c.scale(won ? .42 : .38, won ? .42 : .38);
      c.translate(-12, -12);
      /* a dark seat under every pip so it reads on grass or on path */
      c.fillStyle = rgba('#1B2416', .45);
      c.save(); c.translate(0, 1.6); c.fill(PIP); c.restore();
      c.fillStyle = won ? PAL.accent : rgba(PAL.textDim, .62);
      c.fill(PIP);
      c.restore();
    }
  }
  c.restore();
}
/* Whether the lane is the screen being looked at. It used to read
   SCREEN, which lives in 60-ui.js — the map asking the interface where
   the player is. It is told instead. */
let mapShown = false;
EV.on('screen', name => { mapShown = name === 'map'; });

function bindMap() {
  const cv = $('#mapCanvas');
  const wrap = $('#mapWrap');
  let queued = false;
  wrap.addEventListener('scroll', () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; if (mapShown) drawMap(); });
  }, { passive: true });
  cv.addEventListener('click', ev => {
    const rect = cv.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top + ($('#mapWrap') ? $('#mapWrap').scrollTop : 0);
    for (const n of MAP.nodes) {
      if (Math.hypot(n.x - x, n.y - y) < 32) {
        audioResume();
        if (n.n > SAVE.reached) { SFX.bad(); toast(T('map_locked', { n: SAVE.reached }), 'lock'); return; }
        SFX.select();
        EV.emit('lane', n.n);
        return;
      }
    }
  });
}
function scrollMapToCurrent(instant) {
  const wrap = $('#mapWrap');
  const node = MAP.nodes.find(n => n.n === SAVE.reached);
  if (!node) return;
  const target = clamp(node.y - wrap.clientHeight * .62, 0, Math.max(0, (MAP.total || 0) - wrap.clientHeight));
  wrap.scrollTo({ top: target, behavior: instant ? 'auto' : 'smooth' });
}

let SCREEN = 'home';
const TABS = [
  { id: 'home', icon: 'home', key: 'tab_home' },
  { id: 'map', icon: 'play', key: 'tab_play' },
  { id: 'shop', icon: 'shop', key: 'tab_shop' },
  { id: 'family', icon: 'paw', key: 'tab_family' }
];

function buildTabs() {
  const bar = $('#tabbar');
  bar.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.id = t.id;
    b.innerHTML = IC[t.icon] + '<span>' + T(t.key) + '</span>';
    b.addEventListener('click', () => { audioResume(); SFX.tap(); setScreen(t.id); });
    bar.appendChild(b);
  });
  syncTabs();
}
function syncTabs() {
  $$('#tabbar .tab').forEach(b => b.classList.toggle('on', b.dataset.id === SCREEN));
  const home = $('#tabbar .tab[data-id="home"]');
  if (home) {
    const old = $('.badge', home);
    if (old) old.remove();
    if (giftReady()) {
      const s = document.createElement('span');
      s.className = 'badge';
      s.textContent = '1';
      home.appendChild(s);
    }
  }
}
function setScreen(name) {
  if (name === SCREEN) return;
  /* a breath of air between rooms; into the board is a rise, out of
     it is a fall, so the ear knows which way you went */
  if (SCREEN) SFX.swish(name === 'game');
  SCREEN = name;
  EV.emit('screen', name);
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === 'scr-' + name));
  const inGame = name === 'game';
  $('#topbar').style.display = inGame ? 'none' : '';
  $('#tabbar').style.display = inGame ? 'none' : '';
  if (name === 'home') { renderHome(); roomLayout(); roomStart(); } else roomStop();
  if (name === 'game') {
    layoutBoard(); gameLoopStart();
    /* so the arrow keys reach the board straight away */
    setTimeout(() => { const b = $('#board'); if (b) b.focus({ preventScroll: true }); }, 60);
  } else gameLoopStop();
  if (name === 'map') { mapLayout(); scrollMapToCurrent(true); }
  if (name === 'shop') renderShop();
  if (name === 'family') renderFamily();
  syncTabs();
  syncPurse();
}

function carePlay() {
  const pet = activePet();
  /* say why, rather than ignoring the tap */
  if (pet.asleep) { SFX.bad(); toast(T('home_asleep', { name: pet.name }), 'paw'); return; }
  const toy = bestOwnedToy();
  if (!toy && !Object.keys(SAVE.toys || {}).length) { SFX.bad(); toast(T('home_no_toys'), 'ball'); return; }
  /* A tired pet plays anyway, just not for long. Refusing outright was a
     dead end: joy can only be raised by playing, playing was gated on
     energy, and energy has no in-session remedy at all — so a pet that
     ran down stayed miserable for good however hard the player tried. */
  const tired = pet.energy < 25;
  const joy = Math.round((toy ? toy.joy : 10) * (tired ? .45 : 1));
  pet.joy = clamp(pet.joy + joy, 0, 100);
  pet.energy = clamp(pet.energy - (tired ? 3 : 8), 0, 100);
  pet.clean = clamp(pet.clean - 6, 0, 100);
  pet.food = clamp(pet.food - 3, 0, 100);
  roomAct('play', 3);
  petVoice(pet, tired ? .95 : 1.15);
  afterCare(pet, tired ? 'mood_tired_play' : 'mood_played', tired ? 1 : 2, 'play');
}
