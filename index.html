<meta charset="utf-8">
<title>Biscuit Lane</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<!-- A game you keep on your phone, not a page you visit.

     The manifest and the service worker are sibling files, so they only
     exist where the game is served rather than opened as one file. Both
     are referenced defensively: a 404 on either costs nothing, and the
     single-file build still runs exactly as before. -->
<meta name="description" content="A match-3 puzzle where the cats and dogs on the board are the pets you adopt, feed and raise in the room upstairs.">
<meta name="theme-color" content="#F6EADA">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS installs from the meta tags, not the manifest -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biscuit Lane">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

<!-- a phone browser offering to dial a level number helps nobody -->
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;700;800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap">

<style>
/* ============================================================
   BISCUIT LANE — design tokens
   Two worlds: Day (morning shop) and Dusk (lamp-lit evening).
   Bare :root = Day. Dark preference and explicit stamps swap it.
   ============================================================ */
:root{
  --bg:            #F6EADA;
  --bg-deep:       #E9D8C3;
  --surface:       #FFFAF2;
  --surface-2:     #F3E6D6;
  --surface-3:     #E7D6C1;
  --line:          #DCC7AC;
  --line-soft:     #EADCC9;
  --text:          #2C2118;
  --text-dim:      #6B5949;
  --text-faint:    #6D5C49;
  --accent:        #D98A18;
  /* the accent as text: the fill colour carries 2.7:1 on cream and
     3.6:1 on its own soft tint, so text uses a darker one */
  --accent-strong: #7E4C0A;
  --accent-soft:   #F7D79B;
  --accent-ink:    #3A2503;
  --rose:          #A82C44;
  --rose-soft:     #F6CCD3;
  --sage:          #276853;
  --sage-soft:     #C4E4D4;
  --plum:          #6E5A8C;
  --sky:           #3C86C4;
  /* One radius scale, so nothing is 16px next to 18px next to 20px for
     no reason anybody could name. */
  /* Seven type sizes, because there were eighteen — thirteen of them
     inside a six-pixel range, which is not a scale, it is a series of
     separate decisions that happened to be near each other. The scale
     held; where it sat did not.

     Measured on a phone, thirty-one of the forty-three strings on the
     home screen were under 12px and twenty-seven of them were 11px — so
     11 was not the caption size, it was the size of most of the game.
     iOS asks for 11pt as a floor and Material for about 12sp as a body
     size, and the old nano at 9.5px was under both. Everything is one
     step up.

     And in rem, not px. The old scale ignored the phone's own text-size
     setting completely: 535 lengths in px and not one rem, so a player
     who had turned their system font up got the same 11px as everybody
     else. Type is relative now; spacing and radii stay in px on
     purpose, so turning the text up grows the words inside the boxes
     rather than pushing the layout apart. */
  --t-nano:        0.6875rem;   /* 11.0px at the default root */
  --t-micro:       0.78125rem;  /* 12.5px */
  --t-small:       0.875rem;    /* 14.0px */
  --t-body:        1rem;        /* 16.0px */
  --t-title:       1.125rem;    /* 18.0px */
  --t-h2:          1.4375rem;   /* 23.0px */
  --t-hero:        1.75rem;     /* 28.0px */

  --r-xs:          9px;
  --r-sm:          13px;
  --r-md:          17px;
  --r-lg:          22px;
  --r-full:        999px;

  /* Elevation, as a ladder rather than one shadow used for everything.
     Each step is a tight contact shadow plus a wide soft one: real
     light does both, and a single blurred drop reads as a sticker. */
  --shadow-0:      0 1px 1px rgba(70,45,20,.05);
  --shadow-1:      0 1px 2px rgba(70,45,20,.09), 0 3px 10px rgba(70,45,20,.06);
  --shadow-2:      0 2px 4px rgba(70,45,20,.08), 0 12px 32px rgba(70,45,20,.14);
  --shadow-pop:    0 4px 8px rgba(70,45,20,.12), 0 22px 56px rgba(70,45,20,.26);

  /* The hairline where a surface catches the light. It is one pixel and
     it is most of the difference between a panel and a rectangle. */
  --edge-hi:       inset 0 1px 0 rgba(255,255,255,.72);
  --edge-lo:       inset 0 -1px 0 rgba(70,45,20,.06);
  --surface-lit:   linear-gradient(180deg, #FFFDF8 0%, var(--surface) 34%, #FBF3E7 100%);
  --glow:          radial-gradient(120% 90% at 50% 8%, rgba(255,225,170,.85), rgba(255,225,170,0) 62%);
  --board-bg:      #6B563A;
  --board-cell:    rgba(255,244,225,.085);
  --board-cell-2:  rgba(255,244,225,.035);
  --scrim:         rgba(44,33,24,.44);
  --stage:         radial-gradient(140% 100% at 50% -10%, #FFF6E6 0%, #F0DCC1 42%, #DCC3A2 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:          #131A26;
    --bg-deep:     #0C121B;
    --surface:     #1E2937;
    --surface-2:   #26323F;
    --surface-3:   #2F3C4C;
    --line:        #3A4859;
    --line-soft:   #2B3745;
    --text:        #F6EDE0;
    --text-dim:    #A7B4C4;
    --text-faint:  #8E9BAC;
    --accent:      #F5B851;
    --accent-strong: #F8C86F;
    --accent-soft: #6A4E22;
    --accent-ink:  #2A1C05;
    --rose:        #F08D9C;
    --rose-soft:   #5C2C36;
    --sage:        #7FBFA3;
    --sage-soft:   #23453A;
    --plum:        #A98BD4;
    --sky:         #6FB0EE;
    --shadow-0:    0 1px 1px rgba(0,0,0,.20);
    --shadow-1:    0 1px 2px rgba(0,0,0,.30), 0 3px 10px rgba(0,0,0,.24);
    --shadow-2:    0 2px 4px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.40);
    --shadow-pop:  0 4px 8px rgba(0,0,0,.34), 0 22px 56px rgba(0,0,0,.52);
    --edge-hi:     inset 0 1px 0 rgba(255,255,255,.07);
    --edge-lo:     inset 0 -1px 0 rgba(0,0,0,.22);
    --surface-lit: linear-gradient(180deg, #24303F 0%, var(--surface) 40%, #1B2532 100%);
    --shadow-1:    0 1px 2px rgba(0,0,0,.34), 0 3px 12px rgba(0,0,0,.30);
    --shadow-2:    0 12px 38px rgba(0,0,0,.46);
    --shadow-pop:  0 20px 56px rgba(0,0,0,.60);
    --glow:        radial-gradient(120% 90% at 50% 6%, rgba(245,184,81,.24), rgba(245,184,81,0) 60%);
    --board-bg:    #182231;
    --board-cell:  rgba(255,255,255,.055);
    --board-cell-2:rgba(255,255,255,.024);
    --scrim:       rgba(6,10,16,.62);
    --stage:       radial-gradient(140% 100% at 50% -8%, #24334A 0%, #141D2B 45%, #080D14 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#131A26; --bg-deep:#0C121B; --surface:#1E2937; --surface-2:#26323F; --surface-3:#2F3C4C;
  --line:#3A4859; --line-soft:#2B3745; --text:#F6EDE0; --text-dim:#A7B4C4; --text-faint:#8E9BAC;
  --accent:#F5B851; --accent-strong:#F8C86F; --accent-soft:#6A4E22; --accent-ink:#2A1C05;
  --rose:#F08D9C; --rose-soft:#5C2C36;
  --sage:#7FBFA3; --sage-soft:#23453A; --plum:#A98BD4; --sky:#6FB0EE;
  --shadow-0:0 1px 1px rgba(0,0,0,.20);
  --shadow-1:0 1px 2px rgba(0,0,0,.30), 0 3px 10px rgba(0,0,0,.24);
  --shadow-2:0 2px 4px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.40);
  --shadow-pop:0 4px 8px rgba(0,0,0,.34), 0 22px 56px rgba(0,0,0,.52);
  --edge-hi:inset 0 1px 0 rgba(255,255,255,.07);
  --edge-lo:inset 0 -1px 0 rgba(0,0,0,.22);
  --surface-lit:linear-gradient(180deg, #24303F 0%, var(--surface) 40%, #1B2532 100%);
  --shadow-pop:0 20px 56px rgba(0,0,0,.60);
  --glow:radial-gradient(120% 90% at 50% 6%, rgba(245,184,81,.24), rgba(245,184,81,0) 60%);
  --board-bg:#182231; --board-cell:rgba(255,255,255,.055); --board-cell-2:rgba(255,255,255,.024);
  --scrim:rgba(6,10,16,.62);
  --stage:radial-gradient(140% 100% at 50% -8%, #24334A 0%, #141D2B 45%, #080D14 100%);
}
:root[data-theme="light"]{
  --bg:#F6EADA; --bg-deep:#E9D8C3; --surface:#FFFAF2; --surface-2:#F3E6D6; --surface-3:#E7D6C1;
  --line:#DCC7AC; --line-soft:#EADCC9; --text:#2C2118; --text-dim:#6B5949; --text-faint:#6D5C49;
  --accent:#D98A18; --accent-strong:#7E4C0A; --accent-soft:#F7D79B; --accent-ink:#3A2503;
  --rose:#A82C44; --rose-soft:#F6CCD3;
  --sage:#276853; --sage-soft:#C4E4D4; --plum:#6E5A8C; --sky:#2C6A9E;
  --shadow-1:0 1px 2px rgba(70,45,20,.10), 0 3px 10px rgba(70,45,20,.07);
  --shadow-2:0 10px 34px rgba(70,45,20,.16);
  --shadow-pop:0 18px 50px rgba(70,45,20,.26);
  --glow:radial-gradient(120% 90% at 50% 8%, rgba(255,225,170,.85), rgba(255,225,170,0) 62%);
  --board-bg:#6B563A; --board-cell:rgba(255,244,225,.085); --board-cell-2:rgba(255,244,225,.035);
  --scrim:rgba(44,33,24,.44);
  --stage:radial-gradient(140% 100% at 50% -10%, #FFF6E6 0%, #F0DCC1 42%, #DCC3A2 100%);
}

/* ---------- base ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg-deep);
  color:var(--text);
  font-family:"Karla","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:var(--t-body); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
h1,h2,h3,h4{ font-family:"Grandstander","Trebuchet MS",system-ui,sans-serif; font-weight:800; margin:0; letter-spacing:-.01em; text-wrap:balance; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
.num{ font-variant-numeric:tabular-nums; }

/* ---------- stage & frame ---------- */
.stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--stage);
  overflow:hidden;
}
#motes{ position:absolute; inset:0; pointer-events:none; opacity:.9; }
.frame{
  position:relative; z-index:2;
  width:min(468px, 100vw);
  height:min(936px, 100dvh);
  display:flex; flex-direction:column;
  background:var(--bg);
  border-radius:30px;
  box-shadow:var(--shadow-pop);
  overflow:hidden;
  isolation:isolate;
}
@media (max-width:540px), (max-height:900px){
  .frame{ width:100vw; height:100dvh; border-radius:0; }
}
.frame::before{
  content:""; position:absolute; inset:0; background:var(--glow);
  pointer-events:none; z-index:0;
}

/* ---------- top bar ---------- */
.topbar{
  position:relative; z-index:3;
  display:flex; align-items:center; gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 13px 10px;
  background:var(--surface);
  border-bottom:1px solid var(--line-soft);
  box-shadow:0 6px 18px -10px rgba(70,45,20,.4);
  flex:0 0 auto;
}
.brandmark{ display:flex; align-items:center; gap:8px; margin-right:auto; min-width:0; }
/* A canvas is sized in pixels by fitCanvas, and a window that has just
   been resized has canvases still carrying their old width. The resize
   handler is debounced by 140ms so that dragging a desktop window does
   not re-lay out the whole game on every pixel — which means that for
   about eight frames after a phone rotates, a canvas is wider than the
   thing it sits in and hangs off the side of the screen.

   Clamping it costs nothing and cannot fail. The canvas is briefly
   drawn at a resolution slightly wider than it is displayed, which is
   invisible, instead of overflowing, which is not. */
canvas{ max-width:100%; }

.brandmark canvas{ width:30px; height:30px; flex:0 0 auto; }
/* The wordmark gives way to the purse, rather than sliding under it.

   `.brandmark` could already shrink — it carries min-width:0 — but the
   name inside it was nowrap with nothing to clip it, so it simply drew
   over the chips: 53px of overlap on a 375px screen with the hearts
   chip showing its refill clock, and 11px even with hearts full. The
   purse and the settings button are fixed; the name is the part that
   can afford to lose a letter. */
.brandmark .bn{ font-family:"Grandstander",sans-serif; font-weight:800; font-size:var(--t-body); letter-spacing:-.02em; white-space:nowrap; line-height:1.1;
  min-width:0; overflow:hidden; text-overflow:ellipsis; }
.brandmark .bn small{ display:block; font-family:"Karla",sans-serif; font-weight:500; font-size:var(--t-nano); letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; }
.purse{ display:flex; align-items:center; gap:6px; }
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 10px 5px 6px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line-soft);
  font-weight:700; font-size:var(--t-small); font-variant-numeric:tabular-nums;
  box-shadow:var(--shadow-1); white-space:nowrap;
  position:relative;
}
/* hearts and treats open a sheet; the tap reaches 48 without the chip
   growing to meet it. Vertical only — three of these sit side by side
   and a wider target would take its neighbour's taps. */
.chip::after{
  content:""; position:absolute; left:0; right:0; top:50%;
  transform:translateY(-50%); height:48px;
}
.chip svg{ width:17px; height:17px; display:block; flex:0 0 auto; }
.chip.hearts{ color:var(--rose); }
.chip.coins{ color:var(--accent-strong); }
.chip.treats{ color:var(--plum); }
.chip .sub{ font-size:var(--t-nano); color:var(--text-faint); font-weight:600; margin-left:1px; }
.chip.bump{ animation:chipbump .5s cubic-bezier(.2,1.5,.4,1); }
@keyframes chipbump{ 40%{ transform:scale(1.16) } }
/* The thumb is bigger than the button.

   Measured on a phone: the settings gear was 34x34 and the purse chips
   32 tall, against the 48dp both platforms ask for. Growing them to 48
   would have made a top bar of four fat lozenges, so the drawn size
   stays and the *target* grows underneath — a transparent box centred
   on the control, reaching out to 48 in both directions. Nothing moves
   and nothing looks different; the thing simply catches the tap that
   used to land beside it. */
.iconbtn{
  width:34px; height:34px; border-radius:12px; display:grid; place-items:center;
  background:var(--surface-2); border:1px solid var(--line-soft); box-shadow:var(--shadow-1);
  transition:transform .12s ease, background .15s ease; flex:0 0 auto;
  position:relative;
}
.iconbtn::after{
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:48px; height:48px;
}
.iconbtn:active{ transform:scale(.92); }
.iconbtn svg{ width:18px; height:18px; }

/* ---------- screens ---------- */
.screens{ position:relative; z-index:1; flex:1 1 auto; min-height:0; }
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; transform:translateY(10px) scale(.994);
  transition:opacity .26s ease, transform .26s cubic-bezier(.22,1,.36,1), visibility .26s;
  overflow:hidden;
}
.screen.on{ opacity:1; visibility:visible; transform:none; }
.scroller{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.pad{ padding:14px 14px 22px; display:flex; flex-direction:column; gap:13px; }

/* ---------- tab bar ---------- */
.tabbar{
  position:relative; z-index:3; flex:0 0 auto;
  display:grid; grid-template-columns:repeat(4,1fr); gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--line-soft);
  box-shadow:0 -6px 18px -10px rgba(70,45,20,.4);
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 2px 5px; border-radius:14px; color:var(--text-faint);
  font-size:var(--t-micro); font-weight:700; letter-spacing:.02em;
  transition:color .16s ease, background .16s ease, transform .12s ease;
  position:relative;
}
.tab svg{ width:22px; height:22px; }
.tab.on{ color:var(--accent-strong); background:color-mix(in srgb, var(--accent) 13%, transparent); }
.tab:active{ transform:scale(.93); }
.tab .badge{
  position:absolute; top:2px; right:calc(50% - 21px);
  min-width:16px; height:16px; padding:0 4px; border-radius:999px;
  background:var(--rose); color:#fff; font-size:var(--t-nano); line-height:16px; font-weight:800;
  box-shadow:0 0 0 2px var(--surface);
}

/* ---------- cards & generic ---------- */
/* A panel, not a rectangle: a hairline of light along its top edge, a
   ghost of a gradient down its face, and a contact shadow under it. */
.card{
  background:var(--surface-lit); border:1px solid var(--line-soft); border-radius:var(--r-lg);
  box-shadow:var(--edge-hi), var(--shadow-1); overflow:hidden;
}
.card.pad16{ padding:15px; }
.sectitle{ display:flex; align-items:baseline; gap:8px; padding:0 3px; }
.sectitle h3{ font-size:var(--t-title); }
.sectitle .hint{ font-size:var(--t-micro); color:var(--text-faint); margin-left:auto; font-weight:600; }
.eyebrow{ font-size:var(--t-micro); font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:var(--r-md); font-family:"Grandstander",sans-serif;
  font-weight:700; font-size:var(--t-body); letter-spacing:-.01em;
  background:var(--surface-2); color:var(--text); border:1px solid var(--line);
  box-shadow:var(--edge-hi), var(--shadow-1);
  transition:transform .11s cubic-bezier(.2,.8,.3,1), filter .15s ease, box-shadow .11s ease;
  user-select:none;
}
.btn svg{ width:18px; height:18px; }
.btn:active{ transform:translateY(1px) scale(.985); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
/* The lip under a primary button is what makes it look pressable. It
   wants a highlight along its own top edge too, or it reads as a flat
   shape with a bar under it. */
.btn.primary{
  background:linear-gradient(to bottom,
    color-mix(in srgb, var(--accent) 78%, #fff) 0%,
    var(--accent) 52%,
    color-mix(in srgb, var(--accent) 88%, #000) 100%);
  color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 66%, #000);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),
             0 3px 0 color-mix(in srgb, var(--accent) 58%, #000),
             var(--shadow-1);
}
.btn.primary:active{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 color-mix(in srgb, var(--accent) 58%, #000);
  transform:translateY(2px);
}
.btn.rose{
  background:linear-gradient(to bottom,
    color-mix(in srgb, var(--rose) 76%, #fff) 0%, var(--rose) 52%,
    color-mix(in srgb, var(--rose) 88%, #000) 100%);
  color:#fff; border-color:color-mix(in srgb, var(--rose) 66%, #000);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),
             0 3px 0 color-mix(in srgb, var(--rose) 56%, #000), var(--shadow-1);
}
.btn.rose:active{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 1px 0 color-mix(in srgb, var(--rose) 56%, #000);
  transform:translateY(2px);
}
/* A ghost button still has to look like a button. Fully transparent, it
   read as bare text on the onboarding's cream stage — the only thing
   telling you "Back" was tappable was that it happened to be next to
   something that was. */
.btn.ghost{
  background:color-mix(in srgb, var(--surface) 62%, transparent);
  box-shadow:var(--shadow-0); border-color:var(--line);
}
.btn.ghost:active{ background:color-mix(in srgb,var(--text) 6%, transparent); transform:translateY(1px); }
.btn.wide{ width:100%; }
.btn.sm{ padding:8px 13px; font-size:var(--t-small); border-radius:var(--r-sm); }
.btn.sm svg{ width:15px; height:15px; }

.bar{ height:9px; border-radius:999px; background:var(--surface-3); overflow:hidden; position:relative; }
.bar > i{ display:block; height:100%; border-radius:999px; transition:width .45s cubic-bezier(.22,1,.36,1); }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:var(--t-micro); font-weight:700; }
/* An IC.* string is a bare <svg> with a viewBox and no width or height,
   so it has whatever size CSS gives it and nothing else. Every other
   place that holds one says so — .chip svg, .tab svg, .btn svg, and
   .statPills .pill svg — but the plain .pill never did, so the three
   that carry an icon rendered it at zero: the paw marking an inactive
   pet, the padlock on a breed not yet unlocked, and the tick on a perk
   chip. Each one drew an empty lozenge where a symbol belonged. */
.pill svg{ width:13px; height:13px; flex:0 0 auto; }
.pill.ok{ background:var(--sage-soft); color:var(--sage); }
.pill.warn{ background:var(--accent-soft); color:var(--accent-strong); }
.pill.bad{ background:var(--rose-soft); color:var(--rose); }
.pill.info{ background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line-soft); }

/* ---------- pet home ---------- */
.roomwrap{ position:relative; flex:0 0 auto; }
#room{ display:block; width:100%; touch-action:manipulation; }
.roomtop{ position:absolute; left:13px; right:13px; top:11px; display:flex; align-items:flex-start; gap:10px; pointer-events:none; }
.namecard{
  pointer-events:auto;
  background:color-mix(in srgb, var(--surface) 84%, transparent);
  backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  border:1px solid var(--line-soft); border-radius:16px; padding:7px 12px; box-shadow:var(--shadow-1);
}
.namecard .nm{ font-family:"Grandstander",sans-serif; font-weight:800; font-size:var(--t-title); line-height:1.15; }
.namecard .mt{ font-size:var(--t-micro); color:var(--text-dim); font-weight:600; }
.stagechip{ margin-left:auto; pointer-events:auto; }
.moodbubble{
  position:absolute; pointer-events:none; z-index:4;
  background:var(--surface); border:1px solid var(--line-soft); border-radius:14px;
  padding:7px 11px; font-size:var(--t-small); font-weight:600; box-shadow:var(--shadow-2);
  max-width:200px; opacity:0; transform:translateY(6px) scale(.95);
  transition:opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1);
}
.moodbubble.on{ opacity:1; transform:none; }
.moodbubble::after{
  content:""; position:absolute; left:24px; bottom:-6px; width:11px; height:11px;
  background:var(--surface); border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  transform:rotate(45deg);
}
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px 13px; }
.stat{ display:flex; flex-direction:column; gap:4px; }
.stat .lb{ display:flex; align-items:center; gap:5px; font-size:var(--t-micro); font-weight:700; color:var(--text-dim); }
.stat .lb .v{ margin-left:auto; font-variant-numeric:tabular-nums; color:var(--text-faint); font-weight:600; }
.stat svg{ width:13px; height:13px; flex:0 0 auto; color:var(--tint,var(--text-dim)); }
.stat .bar > i{ background:linear-gradient(90deg,
  color-mix(in srgb,var(--tint) 72%, var(--surface)), var(--tint)); }
.careRow{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
/* each care button wears the colour of the bar it fills, so the row is
   four different jobs rather than four grey squares */
.care{
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 3px 8px;
  border-radius:16px; font-size:var(--t-micro); font-weight:700; box-shadow:var(--shadow-1);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--tint,var(--accent)) 13%, var(--surface)),
    color-mix(in srgb,var(--tint,var(--accent)) 5%, var(--surface)));
  border:1px solid color-mix(in srgb,var(--tint,var(--accent)) 26%, var(--line-soft));
  transition:transform .12s ease, background .16s;
}
.care:active{ transform:scale(.94); }
.care svg{ width:25px; height:25px; color:var(--tint,var(--accent-strong)); }
.care.hot{
  border-color:var(--tint,var(--accent-strong));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--tint,var(--accent)) 28%, transparent), var(--shadow-1);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--tint,var(--accent)) 26%, var(--surface)),
    color-mix(in srgb,var(--tint,var(--accent)) 11%, var(--surface)));
}
.care .cost{ font-size:var(--t-nano); color:var(--text-faint); font-weight:600; }
.care[disabled]{ opacity:.4; }
/* looks unavailable, still takes the tap so it can say why */
.care.dim{ opacity:.45; }

/* ---------- level map ---------- */
.mapwrap{ position:relative; flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
#mapCanvas{ display:block; width:100%; }

/* ---------- game screen ---------- */
/* The head of the game screen is one panel, not two bars stacked with a
   rule between them. Moves, goals and the score you are working toward
   are one piece of information — where you are in this level — and
   splitting them across two surfaces made the screen read as three
   separate zones before the board even started. */
.gtop{
  display:flex; align-items:center; gap:9px; padding:calc(8px + env(safe-area-inset-top)) 12px 6px;
  background:var(--surface); flex:0 0 auto;
}
.moves{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:58px; height:50px; border-radius:15px; background:var(--surface-2);
  border:1px solid var(--line-soft); box-shadow:var(--shadow-1); flex:0 0 auto;
}
.moves b{ font-family:"Grandstander",sans-serif; font-size:var(--t-h2); line-height:1; font-variant-numeric:tabular-nums; }
.moves span{ font-size:var(--t-nano); letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint); font-weight:700; margin-top:1px; }
.moves.low b{ color:var(--rose); }
.moves.tick{ animation:chipbump .4s cubic-bezier(.2,1.5,.4,1); }
.goals{ display:flex; gap:6px; flex:1 1 auto; justify-content:center; flex-wrap:wrap; }
.goal{
  display:flex; align-items:center; gap:5px; padding:4px 9px 4px 4px; border-radius:14px;
  background:var(--surface-2); border:1px solid var(--line-soft); box-shadow:var(--shadow-1);
  font-weight:800; font-size:var(--t-small); font-variant-numeric:tabular-nums;
}
.goal canvas{ width:26px; height:26px; display:block; }
.goal.done{ background:var(--sage-soft); border-color:var(--sage); color:var(--sage); }
.goal.done .n{ opacity:.55; }
.goal.tick{ animation:chipbump .4s cubic-bezier(.2,1.5,.4,1); }
.scorebar{
  padding:2px 13px 9px; background:var(--surface); flex:0 0 auto;
  border-bottom:1px solid var(--line-soft);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 6px 16px -8px rgba(70,45,20,.35);
  position:relative; z-index:2;
}
.scoreline{ display:flex; align-items:center; gap:8px; font-size:var(--t-nano); font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:5px; }
.scoreline .sv{ margin-left:auto; font-family:"Grandstander",sans-serif; font-size:var(--t-body);
  letter-spacing:-.01em; text-transform:none; color:var(--text); font-variant-numeric:tabular-nums; }
/* inset by half a star, so the marker for three stars sits on the end of
   the track rather than half off the side of the screen */
.starTrack{ position:relative; height:7px; border-radius:var(--r-full); background:var(--surface-3); margin:0 10px; }
.starTrack > i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%, var(--rose))); transition:width .4s cubic-bezier(.22,1,.36,1); width:0; }
.starTrack > s{ position:absolute; top:-6px; width:19px; height:19px; margin-left:-9.5px; }
.starTrack > s svg{ width:19px; height:19px; display:block; }
/* bottom-weighted on purpose: the slack above the board becomes the
   landscape, and a thin strip below becomes the foreground you are
   standing in. Centred, the board split the slack into two empty halves. */
.boardwrap{ position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:flex-end; justify-content:center; padding:6px 8px 14px; overflow:hidden; }
/* the lane the board is set down on: painted once per layout, behind everything */
#scene{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
#board{ display:block; touch-action:none; position:relative; z-index:1; }
.gbottom{
  flex:0 0 auto; display:flex; align-items:center; gap:9px;
  padding:8px 11px calc(9px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--line-soft);
}
.companion{
  position:relative; width:58px; height:58px; border-radius:18px; flex:0 0 auto;
  background:var(--surface-2); border:1px solid var(--line-soft);
  box-shadow:var(--shadow-1); display:grid; place-items:center;
  transition:transform .12s ease;
}
.companion canvas{ width:50px; height:50px; display:block; }
.companion:active{ transform:scale(.94); }
.companion.ready{ animation:petready 1.5s ease-in-out infinite; border-color:var(--accent-strong); }
.companion.ready::after{
  content:""; position:absolute; inset:-5px; border-radius:23px;
  box-shadow:0 0 0 2px var(--accent), 0 0 22px color-mix(in srgb,var(--accent) 70%, transparent);
  animation:petpulse 1.5s ease-in-out infinite; pointer-events:none;
}
@keyframes petready{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@keyframes petpulse{ 0%,100%{opacity:.42} 50%{opacity:1} }
.chargewrap{ flex:1 1 auto; min-width:0; }
.chargewrap .cl{ display:flex; align-items:center; gap:6px; font-size:var(--t-micro); font-weight:700; color:var(--text-dim); margin-bottom:4px; }
.chargewrap .cl b{ color:var(--accent-strong); }
.boosters{ display:flex; gap:6px; flex:0 0 auto; }
.booster{
  position:relative; width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
  background:var(--surface-2); border:1px solid var(--line-soft); box-shadow:var(--shadow-1);
  transition:transform .12s ease, border-color .15s;
}
.booster:active{ transform:scale(.92); }
.booster svg{ width:22px; height:22px; }
.booster .ct{
  position:absolute; right:-4px; top:-4px; min-width:17px; height:17px; padding:0 3px; border-radius:999px;
  background:var(--surface-3); color:var(--text); border:1px solid var(--line);
  font-size:var(--t-nano); font-weight:800; line-height:15px; text-align:center; font-variant-numeric:tabular-nums;
}
.booster.armed{ border-color:var(--accent-strong); background:color-mix(in srgb,var(--accent) 20%, var(--surface-2)); }
.booster.armed::after{ content:""; position:absolute; inset:-4px; border-radius:18px; box-shadow:0 0 0 2px var(--accent); animation:petpulse 1.1s ease-in-out infinite; }
.booster[disabled]{ opacity:.38; }

/* ---------- shop ---------- */
.tabs{ display:flex; gap:5px; padding:3px; background:var(--surface-2); border-radius:14px; border:1px solid var(--line-soft); }
.tabs button{ flex:1; padding:8px 3px; border-radius:11px; font-weight:700; font-size:var(--t-small); color:var(--text-dim); transition:.16s; }
.tabs button.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
/* Goods sit in a niche rather than floating in the middle of a white
   card, and their price is a pill at the end of the row rather than a
   full-width gold bar. Four identical gold bars down a shop screen is a
   lot of shouting for four small purchases. */
.good{
  display:flex; flex-direction:column; gap:5px; padding:9px 9px 9px; border-radius:18px;
  background:var(--surface); border:1px solid var(--line-soft); box-shadow:var(--shadow-1);
  position:relative; overflow:hidden;
}
.good .art{
  height:82px; display:grid; place-items:center; border-radius:13px; margin-bottom:3px;
  background:
    radial-gradient(120% 72% at 50% 118%, color-mix(in srgb,var(--accent) 30%, transparent), transparent 72%),
    linear-gradient(180deg, color-mix(in srgb,var(--text) 13%, transparent), color-mix(in srgb,var(--text) 3%, transparent) 62%);
  box-shadow:inset 0 2px 4px color-mix(in srgb,var(--text) 16%, transparent),
             inset 0 -1px 0 color-mix(in srgb,#FFFFFF 45%, transparent);
}
.good .art canvas{ display:block; }
.good .nm{ font-weight:700; font-size:var(--t-small); line-height:1.2; }
.good .ds{ font-size:var(--t-micro); color:var(--text-faint); line-height:1.35; min-height:28px; }
.good .have{ font-size:var(--t-micro); color:var(--text-faint); }
/* the price sits at the end of the card, sized to itself */
/* Price, not a slab. Four full gold buttons down a shop screen is four
   things all shouting the same thing; the goods are what the player is
   choosing between, so the goods get the colour and the control gets an
   outline. */
.good .btn{ align-self:flex-end; width:auto; margin-top:auto; border-radius:var(--r-full); padding:7px 13px; font-size:var(--t-small); }
/* How many you already own belongs on the thing you own, not on a line
   of its own underneath it. */
.good .art{ position:relative; }
.good .stock{
  position:absolute; right:6px; bottom:5px;
  padding:1px 7px; border-radius:var(--r-full);
  background:color-mix(in srgb,var(--text) 72%, transparent); color:var(--surface);
  font-size:var(--t-micro); font-weight:800; font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.btn.price{
  background:color-mix(in srgb,var(--accent) 12%, var(--surface));
  border-color:color-mix(in srgb,var(--accent-strong) 34%, var(--line));
  color:var(--accent-strong);
  box-shadow:var(--edge-hi), var(--shadow-0);
}
.btn.price:active{ transform:translateY(1px); background:color-mix(in srgb,var(--accent) 22%, var(--surface)); }
.good .btn.wide{ align-self:stretch; }
.good.owned{ border-color:var(--sage); }
.good.owned .art{ background:
    radial-gradient(120% 78% at 50% 116%, color-mix(in srgb,var(--sage) 18%, transparent), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb,var(--text) 6%, transparent), transparent 58%); }
.good .tag{ position:absolute; right:8px; top:8px; }

/* ---------- family / pets ---------- */
.petrow{ display:flex; align-items:center; gap:8px; padding:11px 10px; }
.petrow canvas{ width:56px; height:56px; flex:0 0 auto; }
.petrow .info{ flex:1 1 auto; min-width:0; }
.petrow .info .nm{ font-family:"Grandstander",sans-serif; font-weight:800; font-size:var(--t-body); }
.petrow .info .br{ font-size:var(--t-micro); color:var(--text-faint); font-weight:600; }
/* the row's own pill stays on one line: wrapped to two it took enough
   width from the name column to cut "bond 7" off the one pet that is
   actually on the board */
.petrow > .pill{ white-space:nowrap; flex:0 0 auto; padding-left:7px; padding-right:7px; }
.petrow.active{ border-color:var(--accent-strong); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%, transparent), var(--shadow-1); }

/* ---------- modal ---------- */
#modals{ position:fixed; inset:0; z-index:60; pointer-events:none; }
.veil{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
  background:var(--scrim); opacity:0; transition:opacity .28s ease; pointer-events:auto;
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.veil.on{ opacity:1; }
.sheet{
  width:min(400px,100%); max-height:86dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--surface); border:1px solid var(--line-soft); border-radius:26px;
  box-shadow:var(--shadow-pop); padding:20px 18px 18px;
  transform:translateY(16px) scale(.96); opacity:0;
  transition:transform .34s cubic-bezier(.22,1.2,.36,1), opacity .26s ease;
  display:flex; flex-direction:column; gap:13px; text-align:center;
}
.veil.on .sheet{ transform:none; opacity:1; }
.sheet h2{ font-size:var(--t-h2); }
.sheet p{ margin:0; color:var(--text-dim); font-size:var(--t-small); }
/* A sheet is a scrolling flex column, and a flex item's default is to
   shrink. Cards inside one carry their own overflow:hidden, so when the
   sheet ran out of room the card was squeezed and quietly cut its
   contents off — the settings sheet clipped the light control in half
   rather than letting the sheet scroll to it. */
.sheet > *{ flex:0 0 auto; }
.sheet .row{ display:flex; gap:9px; }
.sheet .row .btn{ flex:1; }
.starsRow{ display:flex; justify-content:center; gap:5px; }
.starsRow .s{ transform:scale(.3) rotate(-25deg); opacity:0; transition:transform .55s cubic-bezier(.2,1.7,.4,1), opacity .3s; }
.starsRow .s svg{ width:46px; height:46px; display:block; }
.starsRow .s.pop{ transform:none; opacity:1; }
.rewardRow{ display:flex; justify-content:center; gap:13px; flex-wrap:wrap; }
/* ---------- the card that starts the game ---------- */
.playHero{
  display:flex; align-items:center; gap:12px; text-align:left; padding:14px 14px 14px 16px;
  border-color:var(--accent-strong);
  background:linear-gradient(135deg, var(--accent-soft), var(--surface) 62%);
}
.playHero .ph-l{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
.playHero .ph-l b{ font-family:"Grandstander",sans-serif; font-size:var(--t-h2); line-height:1.1; }
.playHero .ph-l small{ color:var(--text-dim); font-size:var(--t-micro); line-height:1.35; }
.playHero .ph-best{ align-self:flex-start; margin-top:4px; }
.playHero .ph-best svg{ width:12px; height:12px; }
.playHero .ph-go{ flex:0 0 auto; padding:12px 20px; }
.playHero:active{ transform:scale(.985); }
.giftCard{ border-color:color-mix(in srgb,var(--accent-strong) 40%, var(--line-soft)); }
.giftCard .gi{ color:var(--accent-strong); }
.giftCard .gi svg{ width:26px; height:26px; }
.todayTile .di svg{ width:26px; height:26px; }
/* ---------- the week on the step ---------- */
.ladder{ display:flex; gap:5px; justify-content:center; }
.ladder .d{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 2px 5px; border-radius:13px; border:1px solid var(--line-soft);
  background:var(--surface-2);
}
.ladder .d i{ display:grid; place-items:center; width:19px; height:19px; color:var(--text-faint); }
.ladder .d i svg{ width:19px; height:19px; display:block; }
.ladder .d b{ font-size:var(--t-micro); font-weight:800; color:var(--text-faint); font-variant-numeric:tabular-nums; }
.ladder .d.past{ background:var(--sage-soft); border-color:transparent; }
.ladder .d.past i, .ladder .d.past b{ color:var(--sage); }
.ladder .d.now{ background:var(--accent-soft); border-color:var(--accent-strong); }
.ladder .d.now i, .ladder .d.now b{ color:var(--accent-strong); }
.ladder .d.now.land{ animation:chipbump .5s cubic-bezier(.2,1.5,.4,1); }
.ladder .d.jack{ border-style:dashed; border-color:var(--plum); }
.ladder .d.jack i{ color:var(--plum); }
.ladder .d.jack.past{ border-style:solid; }
.ladderNote{ font-size:var(--t-small); }
.ladderMiss{ font-size:var(--t-micro); color:var(--text-faint); margin-top:-6px; }
.giftWait{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; text-align:left; }
.giftWait .gi{ display:grid; place-items:center; width:30px; height:30px; color:var(--accent-strong); flex:0 0 auto; }
.giftWait .gi svg{ width:22px; height:22px; }
.giftWait .gt{ flex:1 1 auto; min-width:0; }
.giftWait .gt b{ font-family:"Grandstander",sans-serif; font-size:var(--t-body); display:block; }
.giftWait .gt small{ display:block; color:var(--text-faint); font-size:var(--t-micro); }
.giftWait .ladder{ flex:1 1 100%; }
.reward{ display:flex; align-items:center; gap:6px; font-weight:800; font-size:var(--t-body); font-variant-numeric:tabular-nums; }
.reward svg{ width:21px; height:21px; }
.goalList{ display:flex; flex-direction:column; gap:8px; }
.goalItem{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:15px; background:var(--surface-2); border:1px solid var(--line-soft); text-align:left; }
.goalItem canvas{ width:32px; height:32px; flex:0 0 auto; }
.goalItem .t{ flex:1 1 auto; font-size:var(--t-small); font-weight:600; color:var(--text-dim); }
.goalItem .t b{ color:var(--text); font-size:var(--t-small); display:block; font-family:"Grandstander",sans-serif; }

/* ---------- onboarding ---------- */
#onb{ position:fixed; inset:0; z-index:80; display:none; }
#onb.on{ display:block; }
.onbInner{ position:absolute; inset:0; background:var(--stage); display:flex; align-items:center; justify-content:center; padding:18px; overflow-y:auto; }
.onbCard{ width:min(430px,100%); display:flex; flex-direction:column; gap:15px; text-align:center; }
.choiceGrid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
/* The thing being chosen is the thing you can see. These held a 44px
   face in a 150px card, which made the choice the smallest element on
   the first screen anybody ever sees. */
.choice{
  display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 7px 10px;
  border-radius:var(--r-lg); background:var(--surface-lit); border:2px solid var(--line-soft);
  box-shadow:var(--edge-hi), var(--shadow-1);
  transition:transform .14s cubic-bezier(.2,.8,.3,1), border-color .16s, box-shadow .16s;
}
.choice canvas{ display:block; }
.choice.on{ background:linear-gradient(180deg,
  color-mix(in srgb,var(--accent) 14%, var(--surface)), var(--surface)); }
.choice .nm{ font-family:"Grandstander",sans-serif; font-weight:700; font-size:var(--t-body); }
.choice .ds{ font-size:var(--t-micro); color:var(--text-faint); text-align:center; line-height:1.3; }
.choice.on{ border-color:var(--accent-strong); transform:translateY(-2px); box-shadow:var(--shadow-2); }
.choice:active{ transform:scale(.96); }
.swatches{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
.sw{ width:38px; height:38px; border-radius:50%; border:3px solid transparent; box-shadow:var(--shadow-1); transition:transform .14s; }
.sw.on{ border-color:var(--text); transform:scale(1.1); }
.field{
  width:100%; padding:13px 15px; border-radius:16px; background:var(--surface);
  border:1px solid var(--line); color:var(--text); font-family:"Grandstander",sans-serif;
  font-weight:700; font-size:var(--t-title); text-align:center;
}
.field::placeholder{ color:var(--text-faint); font-weight:400; }
/* .row was only ever styled inside .sheet, so in the onboarding the two
   buttons had no layout at all and sat jammed against each other,
   centred by the card's text-align. */
.onbCard .row{ display:flex; gap:10px; justify-content:center; margin-top:2px; }
.onbCard .row .btn{ flex:1 1 0; max-width:180px; }
.dots{ display:flex; gap:6px; justify-content:center; }
/* the inactive dots were --line on a cream stage: a step counter that
   only ever showed the step you were on */
.dots i{
  width:7px; height:7px; border-radius:50%; transition:.2s;
  background:color-mix(in srgb,var(--text) 22%, transparent);
}
.dots i.on{ background:var(--accent-strong); width:20px; border-radius:var(--r-full); }
.nameSuggest{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.nameSuggest button{ padding:5px 11px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line-soft); font-size:var(--t-small); font-weight:600; color:var(--text-dim); }

/* ---------- toasts ---------- */
#toasts{ position:fixed; left:0; right:0; bottom:98px; z-index:70; display:flex; flex-direction:column; align-items:center; gap:7px; pointer-events:none; }
.toast{
  background:var(--surface); color:var(--text); border:1px solid var(--line-soft);
  padding:9px 15px; border-radius:999px; font-weight:700; font-size:var(--t-small); box-shadow:var(--shadow-2);
  display:flex; align-items:center; gap:7px; max-width:82vw;
  animation:toastin .35s cubic-bezier(.22,1.3,.36,1) both;
}
.toast svg{ width:16px; height:16px; flex:0 0 auto; }
.toast.out{ animation:toastout .3s ease forwards; }
@keyframes toastin{ from{opacity:0; transform:translateY(14px) scale(.9)} }
@keyframes toastout{ to{opacity:0; transform:translateY(-8px) scale(.96)} }

/* ---------- misc ---------- */
.switchRow{ display:flex; align-items:center; gap:12px; padding:11px 14px; }
.switchRow .lb{ flex:1 1 auto; font-weight:700; font-size:var(--t-small); }
.switchRow .lb small{ display:block; font-weight:500; font-size:var(--t-micro); color:var(--text-faint); line-height:1.35; }
.sw2{ width:48px; height:28px; border-radius:999px; background:var(--surface-3); position:relative; transition:background .2s; flex:0 0 auto; }
.sw2::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow-1); transition:transform .22s cubic-bezier(.22,1.4,.36,1); }
.sw2.on{ background:var(--accent); }
.sw2.on::after{ transform:translateX(20px); }
.seg{ display:flex; gap:3px; background:var(--surface-2); border-radius:12px; padding:3px; border:1px solid var(--line-soft); flex:0 0 auto; }
.seg button{ padding:6px 10px; border-radius:9px; font-size:var(--t-small); font-weight:700; color:var(--text-dim); }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
.divide{ height:1px; background:var(--line-soft); }
.empty{ text-align:center; padding:26px 16px; color:var(--text-faint); font-size:var(--t-small); }
.fx-shake{ animation:shake .34s ease; }
@keyframes shake{ 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(4px)} 50%{transform:translateX(-5px)} }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg) } }
@media (prefers-reduced-motion: reduce){
  .companion.ready, .companion.ready::after, .booster.armed::after{ animation:none !important; }
  .toast{ animation:none !important; }
}

/* ---------- screen reader only ---------- */
.sronly{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0;
}
#board:focus-visible{ outline:3px solid var(--accent); outline-offset:4px; border-radius:20px; }

/* ---------- trophy shelf ---------- */
.trophyGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.trophy{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:10px 6px 9px; border-radius:16px; text-align:center;
  background:var(--surface-2); border:1px solid var(--line-soft);
  opacity:.55;
}
.trophy.got{ opacity:1; background:var(--surface); border-color:var(--accent-strong); box-shadow:var(--shadow-1); }
.trophy .bi{ width:22px; height:22px; display:block; color:var(--text-faint); }
.trophy.got .bi{ color:var(--accent-strong); }
.trophy .bn{ font-family:"Grandstander",sans-serif; font-weight:700; font-size:var(--t-micro); line-height:1.2; }
.trophy .bp{ font-size:var(--t-nano); color:var(--text-faint); line-height:1.3; font-variant-numeric:tabular-nums; }
.trophy.got .bp{ color:var(--text-dim); }

/* the three care figures on a pet row: they must wrap rather than push
   past the frame on a 320px screen */
.statPills{ display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; min-width:0; }
.petrow .info{ min-width:0; }
.petrow .info .nm,
.petrow .info .br{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }

/* A settings row is label + control. In Turkish the three-way light
   control is wider than the space left over, so *that* row is allowed to
   wrap its control onto its own line rather than push past the card.

   It used to be every row. A long description then pushed its own toggle
   onto a second line — "Tile symbols" had its switch sitting under its
   own text, and the card clipped whatever fell past the bottom. The
   label shrinks instead; only the segmented control gets to wrap. */
.switchRow{ flex-wrap:nowrap; }
.switchRow .lb{ min-width:0; }
.switchRow.themeRow{ flex-wrap:wrap; }
.switchRow .seg{ margin-left:auto; }
@media (max-width:360px){
  .seg button{ padding:6px 8px; font-size:var(--t-micro); }
  .switchRow{ gap:8px; padding:11px 12px; }
}

/* The lane is virtualised: the spacer carries the real scroll height and
   the canvas is only ever one viewport tall, stuck to the top. */
#mapSpacer{ position:relative; width:100%; }
#mapCanvas{ position:sticky; top:0; display:block; }

/* ---------- the daily walk card ---------- */
/* The two errands of the day, side by side under the thing you came to
   do. They drop to one column on a narrow phone rather than squeezing. */
.todayRow{ display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:11px; }
.todayTile{
  display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  padding:13px 13px 12px; text-align:left; width:100%;
}
.todayTile .di, .todayTile .gi{
  width:32px; height:32px; display:grid; place-items:center; flex:0 0 auto;
}
.todayTile .dt, .todayTile .gt{ flex:1 1 auto; min-width:0; width:100%; }
.todayTile .dt b, .todayTile .gt b{
  font-family:"Grandstander",sans-serif; font-size:var(--t-body); display:block; line-height:1.2;
}
.todayTile .dt small, .todayTile .gt small{
  display:block; color:var(--text-faint); font-size:var(--t-micro); line-height:1.35; margin-top:2px;
}
.todayTile .btn{ width:100%; margin-top:auto; }
/* With nothing beside it there is no reason to keep the narrow column:
   one tile alone lays itself out across the row like the banner it is. */
.todayRow:has(.todayTile:only-child) .todayTile{
  flex-direction:row; align-items:center; gap:12px; padding:13px 14px;
}
.todayRow:has(.todayTile:only-child) .todayTile .dt,
.todayRow:has(.todayTile:only-child) .todayTile .gt{ flex:1 1 auto; width:auto; }
.todayRow:has(.todayTile:only-child) .todayTile .btn{ width:auto; margin-top:0; }
.dailyCard{ border-color:color-mix(in srgb,var(--sage) 45%, var(--line-soft)); }
.dailyCard .di{ color:var(--sage); }

/* ---------- how to play ---------- */
.howList{ display:flex; flex-direction:column; gap:9px; }
.howRow{ display:flex; align-items:center; gap:11px; text-align:left; }
.howArt{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
.howTile{ width:40px; height:40px; display:block; }
.howPlus{ font-family:"Grandstander",sans-serif; font-weight:700; color:var(--text-faint); font-size:var(--t-small); }
.howText{ font-size:var(--t-small); line-height:1.4; color:var(--text-dim); }

/* A button's label does not wrap. "Open it" broken over two lines, or
   "Back to the lane" over two, is the whole card looking broken. */
.card .btn.sm{ flex:0 0 auto; white-space:nowrap; }
.row .btn{ white-space:nowrap; }

/* ---------- badges ----------
   Nineteen badges all wore the same crown, which makes a shelf of
   achievements read as one achievement repeated. Each now has a picture
   for what it is and a colour for the kind of thing it is: walking the
   lane, taking stars, a feat on the board, the family, looking after
   them. */
.rosette{
  width:34px; height:34px; flex:0 0 auto; border-radius:50%;
  display:grid; place-items:center; color:var(--rose-ink,var(--accent-strong));
  background:var(--rose-bg,color-mix(in srgb,var(--accent) 18%, var(--surface)));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rose-ink,var(--accent-strong)) 30%, transparent),
             0 1px 2px color-mix(in srgb,var(--text) 14%, transparent);
}
.rosette svg{ width:19px; height:19px; }
.rosette.fam-lane  { --rose-ink:var(--sage); --rose-bg:color-mix(in srgb,var(--sage) 17%, var(--surface)); }
.rosette.fam-star  { --rose-ink:var(--accent-strong); --rose-bg:color-mix(in srgb,var(--accent) 22%, var(--surface)); }
.rosette.fam-feat  { --rose-ink:var(--rose); --rose-bg:color-mix(in srgb,var(--rose) 15%, var(--surface)); }
.rosette.fam-family{ --rose-ink:var(--plum); --rose-bg:color-mix(in srgb,var(--plum) 16%, var(--surface)); }
.rosette.fam-care  { --rose-ink:var(--sky); --rose-bg:color-mix(in srgb,var(--sky) 15%, var(--surface)); }
.rosette.locked{ --rose-ink:var(--text-faint); --rose-bg:var(--surface-3); box-shadow:none; }

/* three numbers with nothing to say which is which is three numbers */
.statPills .pill svg{ width:12px; height:12px; margin-right:-1px; }

.perkchips{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.perkchips .pill{ font-size:var(--t-micro); padding:2px 8px; }

/* The sheet says the pet is pleased with you, so the pet is in it. It
   is the only place the two halves of the game meet at the moment they
   pay off, and it used to be three gold stars and a sentence. */
.winPet{ display:grid; place-items:center; margin:-2px 0 -6px; }
.winPet canvas{ width:116px; height:116px; animation:winPetIn .5s cubic-bezier(.18,1.5,.4,1) both; }
@keyframes winPetIn{ from{ transform:translateY(9px) scale(.72); opacity:0 } to{ transform:none; opacity:1 } }
@media (prefers-reduced-motion:reduce){ .winPet canvas{ animation:none } }

/* One primary action per screen. The hero card is what the player came
   for; the two errands beside it are offers, not instructions, and
   three gold buttons in one view means none of them is the one. Their
   accent lives in the icon and the border instead. */
.todayTile .btn{ font-size:var(--t-small); padding:9px 12px; }
.giftCard .btn{ color:var(--accent-strong); border-color:color-mix(in srgb,var(--accent-strong) 34%, var(--line)); }
.dailyCard .btn{ color:var(--sage); border-color:color-mix(in srgb,var(--sage) 34%, var(--line)); }

/* An offer, under the free choices, not a command above them.
   The loudest control on a screen that has just told the player they
   lost should not be the one that spends their treats. Carrying on and
   walking away are both free; buying five more moves is a thing the
   player may want, and it is offered the way a shop offers something. */
.offer{
  display:flex; align-items:center; gap:11px; margin-top:2px;
  padding:10px 11px 10px 13px; border-radius:var(--r-md);
  background:color-mix(in srgb,var(--plum) 8%, var(--surface-2));
  border:1px dashed color-mix(in srgb,var(--plum) 38%, var(--line));
  text-align:left;
}
.offer .ot{ flex:1 1 auto; min-width:0; }
.offer .ot b{ display:block; font-family:"Grandstander",sans-serif; font-size:var(--t-small); line-height:1.2; }
.offer .ot small{ display:block; color:var(--text-faint); font-size:var(--t-micro); margin-top:1px; }
.offer .btn{ flex:0 0 auto; white-space:nowrap; color:var(--plum);
  border-color:color-mix(in srgb,var(--plum) 40%, var(--line)); }

/* ---------- turned sideways ----------
   A board that shrinks to 22px cells in a wide empty field is not a
   landscape layout, it is the portrait one apologising. The manifest
   asks for portrait when the game is installed; in a browser tab it can
   only ask nicely. Height-gated so a tablet, which has the room, is left
   alone. */
#rotate{
  position:fixed; inset:0; z-index:200; display:none;
  background:var(--stage); color:var(--text);
  place-items:center; text-align:center; padding:24px;
}
.rotWrap{ display:flex; flex-direction:column; align-items:center; gap:11px; max-width:320px; }
#rotate svg{ width:64px; height:64px; color:var(--accent-strong); }
#rotate b{ font-family:"Grandstander",sans-serif; font-size:var(--t-h2); }
#rotate small{ font-size:var(--t-small); color:var(--text-dim); line-height:1.45; }

/* The last level of a block is meant to be hard, so it says so. A wall

  border:1px solid color-mix(in srgb,var(--rose) 30%, transparent);
}

<script>
(function(){
/* ===== 00-util.js ===== */
/* ============================================================
   00 — utilities, icons, DOM helpers
   ============================================================ */
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const now = () => Date.now();
const HOUR = 3600000, MIN = 60000, DAY = 86400000;

/* seeded RNG so a level always builds the same board */
function mulberry(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* easings */
const E = {
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  bounceOut: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  },
  elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1
};

const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Timed wait used to pace cascades.

   Driven by rAF while the page is visible so the pacing lines up with
   painted frames, and by setTimeout when it is not — otherwise a player
   switching tabs mid-cascade would freeze the board half-resolved. */
/* Set from the console by the integration harness so a whole level can
   be played in a few seconds. Never set by the game itself. */
let FAST_FORWARD = false;
function wait(ms) {
  if (FAST_FORWARD) return Promise.resolve();
  if (reduceMotion()) ms = Math.min(ms, 60);
  return new Promise(res => {
    if (document.hidden) { setTimeout(res, Math.min(ms, 120)); return; }
    const t0 = performance.now();
    const step = t => {
      if (document.hidden) { setTimeout(res, 0); return; }
      (t - t0 >= ms) ? res() : requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* ---------- announcements ----------

   A lower layer sometimes has to say that something happened. The one
   thing it should not do is decide who cares.

   Four places wrote that call by hand, and all four wrote it the same
   way: `if (typeof clearSprites === 'function') clearSprites()`. That
   guard is what a call looks like when the thing being called might not
   be there — and in the node harness, which loads the save layer without
   the art, it genuinely was not. So the guard was load-bearing, and it
   was also the tell. A module that has to check whether its own
   dependency exists does not have a dependency. It has a listener, and
   it was calling it by hand.

   Named EV rather than a bare on/emit because the bundle is one scope:
   `emit` is already the particle emitter in 27-physics.js, and `on` is a
   local in shapeMask. A namespace object is what SFX, FX and HAP are for.

   There is no off(). Nothing here is ever torn down, and an unsubscribe
   nobody calls is a function that rots without anybody noticing. */
const EV = {
  at: new Map(),
  on(ev, fn) {
    if (!EV.at.has(ev)) EV.at.set(ev, []);
    EV.at.get(ev).push(fn);
  },
  emit(ev, arg) {
    const list = EV.at.get(ev);
    if (!list) return;
    /* indexed, not for-of: this runs inside cascades */
    for (let i = 0; i < list.length; i++) list[i](arg);
  }
};

/* ---------- colour helpers ---------- */
function hex2rgb(h) {
  h = h.trim().replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function shade(hexc, amt) {                       // amt -1..1
  const [r, g, b] = hex2rgb(hexc);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return rgb2hex(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p);
}
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function rgba(hexc, a) { const [r, g, b] = hex2rgb(hexc); return `rgba(${r},${g},${b},${a})`; }

/* ---------- canvas helpers ---------- */
function fitCanvas(cv, w, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return c;
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
/* squircle — softer than a rounded rect, reads as a moulded toy */
function squircle(c, x, y, w, h, n) {
  n = n || 4;
  const cx = x + w / 2, cy = y + h / 2, a = w / 2, b = h / 2, steps = 44;
  c.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps * Math.PI * 2;
    const ct = Math.cos(t), st = Math.sin(t);
    const px = cx + a * Math.sign(ct) * Math.pow(Math.abs(ct), 2 / n);
    const py = cy + b * Math.sign(st) * Math.pow(Math.abs(st), 2 / n);
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}

/* ---------------- tile silhouettes ----------------

   Six breeds used to be six identical rounded squares in six colours,
   which is a board you have to read one cell at a time. Shape is the
   fastest thing the eye sorts on — faster than hue, and it survives
   being small, being colour-blind, and being half-covered in mud.

   Each is star-convex about its own centre and fills the cell to about
   the same area, so no breed looks bigger than another, and each leaves
   room for a face across the middle. */
/* faceScale, because a face sized for a square hangs out of a diamond:
   each shape is given the width it actually has across the ears. */
const TILE_SHAPES = [
  { id: 'round',   faceY: 0,    faceScale: .96, pip: [-.27, -.27] },
  { id: 'square',  faceY: 0,    faceScale: 1,   pip: [-.30, -.30] },
  { id: 'hex',     faceY: .015, faceScale: .90, pip: [-.25, -.23] },
  { id: 'shield',  faceY: -.04, faceScale: .93, pip: [-.28, -.29] },
  { id: 'gem',     faceY: .01,  faceScale: .84, pip: [-.20, -.22] },
  { id: 'clover',  faceY: 0,    faceScale: .92, pip: [-.26, -.26] }
];
function tileShape(type) { return TILE_SHAPES[((type % TILE_SHAPES.length) + TILE_SHAPES.length) % TILE_SHAPES.length]; }

/* Same signature as squircle(), so it drops in wherever the tile body,
   its clip, its two bevels and its edge are traced. */
function tilePath(c, type, x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2, a = w / 2, b = h / 2;
  const id = tileShape(type).id;
  if (id === 'square') { squircle(c, x, y, w, h, 4.2); return; }
  if (id === 'shield') {
    /* a name tag: square across the shoulders, tapering to a soft point */
    const r = a * .42;
    c.beginPath();
    c.moveTo(cx - a + r, cy - b);
    c.lineTo(cx + a - r, cy - b);
    c.quadraticCurveTo(cx + a, cy - b, cx + a, cy - b + r);
    c.lineTo(cx + a * .94, cy + b * .18);
    c.quadraticCurveTo(cx + a * .82, cy + b * .82, cx, cy + b);
    c.quadraticCurveTo(cx - a * .82, cy + b * .82, cx - a * .94, cy + b * .18);
    c.lineTo(cx - a, cy - b + r);
    c.quadraticCurveTo(cx - a, cy - b, cx - a + r, cy - b);
    c.closePath();
    return;
  }
  /* the rest are one polar sweep each */
  const TAU = Math.PI * 2, steps = 72;
  const rad = t => {
    if (id === 'round') return 1;
    if (id === 'gem') {
      /* a rounded diamond. Pulled only a little past the circle: at
         1.45 it was a kite, too narrow at the shoulders to hold a face */
      const ct = Math.abs(Math.cos(t)), st = Math.abs(Math.sin(t));
      return 1 / Math.pow(Math.pow(ct, 1.42) + Math.pow(st, 1.42), 1 / 1.42);
    }
    if (id === 'hex') {
      /* regular hexagon, point upward, then eased back toward the circle
         so the corners read as corners and not as spikes */
      const k = Math.PI / 3;
      const u = ((t + Math.PI / 2) % k + k) % k - k / 2;
      const hexR = Math.cos(k / 2) / Math.cos(u);
      return hexR * .78 + .22;
    }
    /* clover: six soft lobes, deep enough to see at forty pixels */
    return .885 + .115 * Math.cos(6 * t + Math.PI / 2);
  };
  c.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps * TAU;
    const r = rad(t);
    const px = cx + a * r * Math.cos(t), py = cy + b * r * Math.sin(t);
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}

function ellipse(c, x, y, rx, ry, rot) {
  c.beginPath(); c.ellipse(x, y, Math.max(rx, .01), Math.max(ry, .01), rot || 0, 0, Math.PI * 2);
}

/* ---------- toast ---------- */
let toastTimers = [];
function toast(msg, ic) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (ic ? IC[ic] : '') + '<span>' + msg + '</span>';
  $('#toasts').appendChild(el);
  const t = setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 1900);
  toastTimers.push(t);
  const kids = $$('#toasts .toast');
  if (kids.length > 3) kids[0].remove();
}

/* ---------- modal ----------

   One sheet at a time.

   Sheets used to be sequenced by guessing at timers. Clearing a level
   that grew the pet and won a badge ran:

     showWin()                          the win sheet, open until tapped
     setTimeout(stageUpModal,  900)
     setTimeout(badgeModal,   2000)

   Those delays are measured from the win, not from the player, and the
   win sheet stays up until it is dismissed — so all three arrived on
   top of each other and all three were legible through one another.
   Only one call site in the whole game checked sheetIsOpen() first.

   A sheet opened while another is up now waits for it. The element is
   built and attached immediately, so a caller can wire up its buttons
   and paint its canvases exactly as before — an unattached sheet would
   have handed the stage-up animation a canvas with no layout. It simply
   is not shown, is not focusable, and does not take a tap, until the
   sheet in front of it closes.

   A veil with no `.on` is already transparent, so being queued costs
   nothing to draw; what it needs is to stop swallowing clicks. */
let modalStack = [];
const modalQueue = [];

/* the next sheet in line takes the screen, if nothing else holds it */
function modalPromoteNext() {
  if (sheetIsOpen()) return;
  const next = modalQueue.shift();
  if (next) next();
}

function modal(html, opts) {
  opts = opts || {};
  const veil = document.createElement('div');
  veil.className = 'veil';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.tabIndex = -1;
  sheet.innerHTML = html;
  veil.appendChild(sheet);
  /* Marked as waiting *before* it joins the document. sheetIsOpen()
     asks the DOM, so a veil appended first and asked about afterwards
     finds itself, decides a sheet is already up, and queues behind
     itself — every dialog in the game then waited for one that was
     never going to appear. */
  veil.dataset.queued = '1';
  veil.style.pointerEvents = 'none';
  $('#modals').appendChild(veil);
  let returnFocus = null;
  let shown = false, closed = false;

  /* Taking the screen: the focus moves here, and the fade starts. The
     keyboard follows the dialog, so it stops reaching whatever was
     behind it. Focus is set outside the rAF because that never fires in
     a hidden tab, and focus is not decoration. */
  const show = () => {
    if (closed) return;
    /* A test harness — and the game's own screen changes — can take a
       veil out of the document without going through close(). Skip it
       and let the next one have the screen, rather than focusing into a
       sheet nobody can see. */
    if (!veil.isConnected) { closed = true; modalPromoteNext(); return; }
    shown = true;
    delete veil.dataset.queued;
    veil.style.pointerEvents = '';
    returnFocus = document.activeElement;
    const first = sheet.querySelector('button, input, select, textarea, a[href]');
    try { (first || sheet).focus({ preventScroll: true }); } catch (e) { }
    requestAnimationFrame(() => veil.classList.add('on'));
  };

  const api = {
    el: sheet, veil,
    close() {
      if (closed) return;
      closed = true;
      if (!shown) {
        /* it never took the screen: drop it out of the line quietly */
        const i = modalQueue.indexOf(show);
        if (i >= 0) modalQueue.splice(i, 1);
        veil.remove();
        modalStack = modalStack.filter(m => m !== api);
        if (opts.onClose) opts.onClose();
        return;
      }
      veil.classList.remove('on');
      /* it lingers for the fade; it must not still be operable, and
         anything asking whether a sheet is up must see it as gone */
      veil.dataset.closing = '1';
      veil.style.pointerEvents = 'none';
      /* and nothing in it can be pressed again on the way out — several
         of these buttons spend a heart or a treat when pressed */
      sheet.querySelectorAll('button').forEach(b => { b.disabled = true; });
      setTimeout(() => { veil.remove(); modalPromoteNext(); }, 300);
      modalStack = modalStack.filter(m => m !== api);
      if (returnFocus && returnFocus.isConnected && returnFocus.focus) {
        try { returnFocus.focus({ preventScroll: true }); } catch (e) { }
      }
      if (opts.onClose) opts.onClose();
    }
  };
  if (opts.dismissable !== false) {
    veil.addEventListener('click', e => { if (e.target === veil) api.close(); });
    veil.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); api.close(); }
    });
  }
  modalStack.push(api);
  if (sheetIsOpen()) modalQueue.push(show);
  else show();
  return api;
}
/* Is a sheet up? Asked of the document rather than of modalStack, which
   can be left holding a sheet whose element is already gone. One on its
   way out does not count. */
function sheetIsOpen() {
  const list = document.querySelectorAll('#modals .veil');
  for (let i = 0; i < list.length; i++) {
    if (!list[i].dataset.closing && !list[i].dataset.queued) return true;
  }
  return false;
}

/* ---------- haptics ----------

   The one channel a phone has that a desktop does not, and it was
   carrying four events: a swap, a best chain, the ability, and a win.
   The most common thing in the game — tiles clearing — said nothing at
   all, and a swap the board refused felt exactly like one it accepted.

   Two rules underneath. Different events must feel different, or the
   motor is just noise; and a cascade must not hold the motor on for a
   second and a half, which is both unpleasant in the hand and rude to
   the battery. */
let lastBuzzAt = 0;
function buzz(pattern) {
  try {
    if (!SAVE || !SAVE.settings.haptics) return;
    if (navigator.vibrate) navigator.vibrate(pattern);
    lastBuzzAt = Date.now();
  } catch (e) { /* unsupported */ }
}
/* for anything that can fire many times in a row */
function buzzOften(pattern, gapMs) {
  if (Date.now() - lastBuzzAt < (gapMs === undefined ? 70 : gapMs)) return;
  buzz(pattern);
}
/* The vocabulary, so the same event feels the same everywhere and the
   difference between two events is a decision rather than an accident. */
const HAP = {
  tap: 6,                       // picking a tile up
  swap: 9,                      // two tiles changing places
  no: [15, 45, 15],             // the board refusing: a stutter, not a knock
  clear: n => Math.round(Math.min(26, 7 + n * 1.6)),   // scaled by how much went
  chain: d => [8, 30, Math.round(Math.min(30, 8 + d * 4))],
  crack: 20,                    // something breaking rather than matching
  star: 12,
  win: [16, 60, 16, 60, 30],
  lose: [34, 70, 46]
};

/* ---------- number formatting ---------- */
function fmt(n) {
  n = Math.round(n);
  return n >= 10000 ? n.toLocaleString('en-US') : String(n);
}
function fmtTime(ms) {
  if (ms <= 0) return '0:00';
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

let LANG = 'en';
/* Turkish puts the case on the end of the noun, and the noun here is a
   name the player typed.

   "Hazır — {name}'a dokun" had the suffix written into the string, so
   it was right for Marlow and wrong for everybody whose name has front
   vowels: Zeynep'a, Pamuk'e, Şeker'a. Every other line in the Turkish
   table sidesteps this by keeping the name in the nominative — "{name}
   büyüdü", "{name} ile bağ" — which is careful writing, and this one
   line was the exception.

   The dative agrees with the last vowel of the word: a, ı, o, u take
   -a; e, i, ö, ü take -e. A name that ends in a vowel takes a buffer y
   first, and a proper noun takes an apostrophe before the suffix. That
   is the whole rule for this case, and it is worth the twelve lines
   rather than asking players not to be called Zeynep. */
const TR_BACK = 'aıouâû', TR_FRONT = 'eiöüî';
function trDative(name) {
  const w = String(name || '').toLocaleLowerCase('tr');
  let last = '';
  for (let i = w.length - 1; i >= 0; i--) {
    if (TR_BACK.indexOf(w[i]) >= 0 || TR_FRONT.indexOf(w[i]) >= 0) { last = w[i]; break; }
  }
  const suffix = TR_FRONT.indexOf(last) >= 0 ? 'e' : 'a';
  const endsInVowel = w.length > 0 &&
    (TR_BACK.indexOf(w[w.length - 1]) >= 0 || TR_FRONT.indexOf(w[w.length - 1]) >= 0);
  return '’' + (endsInVowel ? 'y' : '') + suffix;
}

/* the name as the sentence needs it: in Turkish, with the case on it */
function petDative(name) {
  return LANG === 'tr' ? name + trDative(name) : name;
}

function T(key, vars) {
  let s = (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

/* ---------- the economy, in one table ----------

   Every payout and every price used to be a literal at the place it was
   spent: the level reward inside showWin, the walk inside dailyDone, the
   heart refill inside the sheet that sells it. test/economy.js could not
   read any of them, so it kept its own copies and guarded them by
   searching the source for the exact line — which caught drift by
   failing, loudly, every time anyone touched a number.

   The two columns have to be read together or neither means anything.
   They are one table now, and the simulation reads the real values. */
const ECON = {
  /* what a cleared level pays. Halved from (30, 22, /1400): the old
     curve paid about 113 coins for a three-starred level and the whole
     catalogue is 10,023, so a month of ordinary play bought everything
     the game sells twice over and kept 13,826 in change. */
  winBase: 18, winPerStar: 12, winPerScore: 2600,
  /* and what it pays the second time. A cleared level paid full price
     forever, which made the best coin-per-minute in the game "replay
     level 3", and made every price downstream a fiction. Beating your
     own score still pays, because that is a reason to go back that
     isn't farming. */
  replayRate: .10, replayBestRate: .25,

  dailyWalkCoins: 80, dailyWalkTreats: 1,
  /* treats on the gift ladder: day 4 and day 7 only, 1 and 3. Was day
     3, 6 and 7 for 2, 2 and 5 — nine a week, on top of fourteen from
     the walk. */
  giftTreats: { 4: 1, 7: 3 },
  /* the two bounded ones. These are paid once per level, so they are
     capped by how much game there is rather than by how long you play,
     and they are the reward for playing well rather than for showing
     up. Kept, but the every-fifth bonus comes down from 2. */
  threeStarTreats: 1, everyFifthTreats: 1,

  heartRefillMin: 25,
  /* the sinks. Nine treats to carry on is Candy Crush's number for the
     same offer, and at roughly five treats a day of free income it is a
     real decision rather than a formality — the old price was 2, which
     is not a decision, and 3 for a full set of hearts meant the wait
     never had to be waited. */
  continueTreats: 9, continueMoves: 5,
  heartRefillTreats: 12,
  /* and the gate on the offer. An extra five moves at 20% of the goal
     is not an offer, it is a sale of a lost level — the player finds
     that out after paying, once, and then never trusts the button
     again. Below this the card does not carry it at all. */
  continueAt: .70
};

/* The one thing joining the two halves of this game is that matching
   your own pet's breed charges its move. There are six breeds, and a
   level may deal five colours: twelve of the sixty handcrafted levels
   do, along with every generated level in the first two tiers and half
   the daily walks. A pug on one of those was charging at the slow rate
   for the whole level while being told to match a tile that was not
   there. Measured by `test/charge.js` over those twelve levels, the
   meter filled 3.19 times for every other breed and 1.06 times for the
   pug — a third of the pet moves, on a third of the early lane, decided
   by which animal you liked the look of in onboarding.

   Worse than the rate: `primaryGoalType` handed the same number to the
   abilities, so on a level with no collect goal a retriever's Fetch
   found no tiles and did nothing at all, and a pug's Snuffle painted
   tiles a colour the board can never deal again.

   So the favourite is the breed while the breed is dealt, and the tile
   beside it when it is not. Every reader goes through here, and the
   interface says which tile it landed on rather than assuming. */
/* The breed standing in a board slot, and its colours. A slot's look
   follows whoever is in it rather than the slot number: the cast is a
   permutation of the same six breeds, so all six gem colours and all six
   silhouettes are still on the board and still unique — a Pug is a pink
   clover on every board there has ever been, it is just that whether
   there is a Pug on your board at all depends on who you have taken in. */
/* The household lives in the save, which loads after this file, so the
   save installs the real answer on its way past. What is left here is
   the identity permutation: what a player with no pets yet sees, and
   what the headless harness measures against. The old line asked
   `typeof castBreed === 'function'` — a module checking whether its own
   dependency exists, which is a listener being called by hand. */
let castFor = null;
function useCast(fn) { castFor = fn; }
function slotBreed(slot) {
  return castFor ? castFor(slot)
    : Math.max(0, Math.round(+slot || 0)) % BREEDS.length;
}
function slotGem(slot) {
  const b = BREEDS[slotBreed(slot)];
  return b ? b.gem : '#888888';
}
function favTypeFor(breed, types) {
  const b = Math.max(0, Math.round(+breed || 0));
  if (!(types > 0)) return b;
  return b < types ? b : b % types;
