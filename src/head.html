<meta charset="utf-8">
<title>Biscuit Lane</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<!-- A game you keep on your phone, not a page you visit.

     The manifest and the service worker are sibling files, so they only
     exist where the game is served rather than opened as one file. Both
     are referenced defensively: a 404 on either costs nothing, and the
     single-file build still runs exactly as before. -->
<meta name="description" content="A match-3 puzzle where the cats and dogs on the board are the pets you adopt, feed and raise in the room upstairs.">
<meta name="theme-color" content="#F6EADA">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS installs from the meta tags, not the manifest -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biscuit Lane">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

<!-- a phone browser offering to dial a level number helps nobody -->
<meta name="format-detection" content="telephone=no">

<!-- The typefaces are embedded, not fetched. See tools/fonts.js: a font
     request is the one thing that used to leave this device, it made an
     offline first launch fall back to the phone's own sans-serif, and it
     blocked the first paint on a cold cache. -->
