<meta charset="utf-8">
<title>Biscuit Lane</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<!-- A game you keep on your phone, not a page you visit.

     The manifest and the service worker are sibling files, so they only
     exist where the game is served rather than opened as one file. Both
     are referenced defensively: a 404 on either costs nothing, and the
     single-file build still runs exactly as before. -->
<meta name="description" content="A match-3 puzzle where the cats and dogs on the board are the pets you adopt, feed and raise in the room upstairs.">
<meta name="theme-color" content="#F6EADA">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS installs from the meta tags, not the manifest -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biscuit Lane">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

<!-- a phone browser offering to dial a level number helps nobody -->
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;700;800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap">
